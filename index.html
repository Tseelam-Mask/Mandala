/* Sound toggle — fixed position, wordless */
#sound-toggle {
  position: fixed;
  top: 12px;
  right: 14px;
  z-index: 500;
  background: none;
  border: none;
  font-size: 14px;
  color: rgba(122,88,40,0.40);
  cursor: pointer;
  padding: 6px;
  line-height: 1;
  transition: color 0.3s, opacity 0.3s;
}
#sound-toggle:hover { color: rgba(122,88,40,0.70); }
#sound-toggle.sound-off { opacity: 0.35; }

/* ── ALCHEMICAL TERRITORY — CSS Custom Properties ──────────────── */
:root {
  --bg-top: #f8f4ec;
  --bg-mid1: #f4eee2;
  --bg-mid2: #ede3cc;
  --bg-mid3: #dfd0a8;
  --bg-bottom: #a09060;
  --perspective-opacity: 0.22;
  --mountain-opacity: 0.45;
  --bird-opacity: 0.38;
  --medallion-opacity: 0.08;
  --glyph-opacity: 0.10;
  --oracle-border: rgba(160,50,40,0.45);
  --breakdown-border: rgba(185,148,40,0.55);
  --glass-brightness: 1.09;
  --glass-saturation: 1.4;
  --rose-glow: 0;
}

/* All custom property transitions — painting breathes, not switches */
body {
  transition:
    background 4s ease-in-out,
    --perspective-opacity 4s ease-in-out,
    --mountain-opacity 4s ease-in-out,
    --bird-opacity 4s ease-in-out,
    --medallion-opacity 4s ease-in-out,
    --glyph-opacity 4s ease-in-out,
    --glass-brightness 4s ease-in-out,
    --glass-saturation 4s ease-in-out;
}

/* ── NIGREDO — Dissolution. Less light reaching through. ─────── */
body.territory-nigredo {
  --bg-top: #e8e0d0;
  --bg-bottom: #887848;
  --perspective-opacity: 0.28;
  --mountain-opacity: 0.52;
  --bird-opacity: 0.28;
  --medallion-opacity: 0.06;
  --glyph-opacity: 0.14;
  --oracle-border: rgba(140,35,28,0.55);
  --glass-brightness: 1.05;
  --glass-saturation: 1.25;
  --rose-glow: 0;
}

/* ── ALBEDO — First Light. The light returning. ───────────────── */
body.territory-albedo {
  --bg-top: #f4f0e8;
  --bg-bottom: #a89868;
  --perspective-opacity: 0.22;
  --mountain-opacity: 0.42;
  --bird-opacity: 0.48;
  --medallion-opacity: 0.09;
  --glyph-opacity: 0.10;
  --oracle-border: rgba(130,45,60,0.45);
  --glass-brightness: 1.11;
  --glass-saturation: 1.45;
  --rose-glow: 0;
}

/* ── CITRINITAS — Solar Dawn. The painting warms. ────────────── */
body.territory-citrinitas {
  --bg-top: #faf0d8;
  --bg-bottom: #b8a060;
  --perspective-opacity: 0.19;
  --mountain-opacity: 0.38;
  --bird-opacity: 0.55;
  --medallion-opacity: 0.12;
  --glyph-opacity: 0.09;
  --oracle-border: rgba(160,80,30,0.50);
  --breakdown-border: rgba(200,165,45,0.70);
  --glass-brightness: 1.13;
  --glass-saturation: 1.55;
  --rose-glow: 0.08;
}

/* ── RUBEDO — Completion. The painting at its warmest. ──────── */
body.territory-rubedo {
  --bg-top: #f8ece0;
  --bg-bottom: #b09060;
  --perspective-opacity: 0.20;
  --mountain-opacity: 0.40;
  --bird-opacity: 0.52;
  --medallion-opacity: 0.15;
  --glyph-opacity: 0.11;
  --oracle-border: rgba(160,60,70,0.55);
  --glass-brightness: 1.10;
  --glass-saturation: 1.45;
  --rose-glow: 0.12;
}

/* Apply glass-brightness/saturation to relevant surfaces */
.jung-bubble, .you-bubble, .breakdown-bubble, .glass-panel, .dream-card {
  backdrop-filter: blur(16px) saturate(var(--glass-saturation,1.4)) brightness(var(--glass-brightness,1.09)) !important;
}

/* Oracle border follows territory */
.jung-bubble {
  border-left: 2px solid var(--oracle-border,rgba(160,50,40,0.45)) !important;
}

/* Breakdown border follows territory */
.breakdown-bubble {
  border-left: 2px solid var(--breakdown-border,rgba(185,148,40,0.55)) !important;
}

/* Margin glyphs follow territory glyph opacity */
.margin-glyph {
  opacity: var(--glyph-opacity, 0.10) !important;
}

/* Corner medallions follow territory medallion opacity */
.corner-medallion {
  opacity: var(--medallion-opacity, 0.08) !important;
}


/* Contenteditable placeholder */
#initiation-dream-input:empty::before {
  content: attr(data-placeholder);
  color: rgba(200,168,96,0.35);
  font-style: italic;
  pointer-events: none;
}
html,body{
  height:100%;
  background:linear-gradient(180deg,#f8f4ec 0%,#f4eee2 22%,#ede3cc 40%,#dfd0a8 52%,#cfc098 62%,#bfad88 74%,#b0a070 86%,#a09060 100%) fixed;
  color:#3a2810;
  font-family:'Cormorant Garamond',serif;
  font-size:16px;line-height:1.7;
}
#app{height:100%;min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
.scroll-view{height:100vh;overflow-y:auto;overflow-x:hidden;}


/* Rose glow overlay for Citrinitas/Rubedo territory */
#rose-glow-overlay {
  position: fixed;
  width: 120px;
  height: 120px;
  background: radial-gradient(ellipse at center, rgba(200,160,40,0.12) 0%, transparent 70%);
  pointer-events: none;
  z-index: 1;
  opacity: 0;
  transition: opacity 4s ease-in-out;
  /* Position at vanishing point — 50% horizontal, ~65% vertical */
  left: calc(50% - 60px);
  top: calc(65vh - 60px);
}

/* ── PAGE BACKGROUNDS — Dalí dreamscape ─────────────────── */
.page-home,.page-dream,.page-archive,.page-patterns,.page-login{
  min-height:100vh;position:relative;
  background:linear-gradient(180deg,
    #f8f4ec 0%,#f4eee2 22%,#ede3cc 40%,
    #dfd0a8 52%,#cfc098 62%,#bfad88 74%,
    #b0a070 86%,#a09060 100%);
}
.page-dream{
  /* Wooden frame via box-shadow inset — adapts to any content height */
  box-shadow:inset 0 0 0 7px rgba(110,58,28,0.52),
             inset 0 0 0 10px rgba(140,80,38,0.3),
             inset 0 0 0 13px rgba(160,100,50,0.15),
             inset 0 0 0 18px rgba(180,140,65,0.12);
}
.page-login{
  display:flex;align-items:center;justify-content:center;
}
.page-home::before,.page-dream::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,252,245,0.45) 0%,transparent 50%);
}

/* ── TYPOGRAPHY ─────────────────────────────────────────── */
.app-title{
  font-family:'Cinzel Decorative',serif;
  font-size:34px;letter-spacing:12px;
  color:#7a5828;text-align:center;margin-bottom:5px;
  text-shadow:1px 1px 0 rgba(180,130,50,0.15);
}
.app-sub{
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:6px;
  color:#8a6830;text-align:center;text-transform:uppercase;
}

/* ── BUTTONS — three alchemical actions ─────────────────── */
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin:20px 0;}
.btn-action{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:18px 8px;min-height:90px;border-radius:1px;
  cursor:pointer;border:none;font-family:'Cinzel',serif;
  font-size:8px;letter-spacing:3px;text-transform:uppercase;
  position:relative;transition:all 0.4s;
}
.btn-action::before{content:'';position:absolute;inset:3px;border:1px solid rgba(255,255,255,0.12);border-radius:1px;pointer-events:none;}
.btn-new,.btn-gold,.btn-cobalt{background:transparent;border:none;}
.btn-action-glyph{font-size:22px;margin-bottom:7px;display:block;}
.btn-action-sub{font-size:7px;opacity:0.42;margin-top:3px;font-family:'IM Fell English',serif;font-style:italic;letter-spacing:1px;}

/* ── DREAM CARDS ─────────────────────────────────────────── */
.dream-card{
  background:rgba(252,246,232,0.88);
  border:1px solid rgba(120,90,40,0.15);
  border-radius:1px;padding:13px 16px;margin-bottom:7px;
  cursor:pointer;position:relative;overflow:hidden;
  display:flex;align-items:center;gap:12px;transition:all 0.32s;
  box-shadow:0 3px 16px rgba(60,40,15,0.1),inset 0 1px 0 rgba(255,252,240,0.8);
}
.dream-card::before{content:'';position:absolute;top:0;left:0;width:2px;height:100%;background:linear-gradient(180deg,#a82030,#c09030,#a82030);}
.dream-card:hover{background:rgba(255,252,240,0.96);box-shadow:0 5px 22px rgba(60,40,15,0.16);}
.dream-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;color:#2a1a08;margin-bottom:2px;}
.dream-date{font-family:'IM Fell English',serif;font-size:11px;color:#8a6030;font-style:italic;}

/* ── PROGRESS BARS ───────────────────────────────────────── */
.progress-wrap{height:1px;background:rgba(100,70,25,0.15);overflow:hidden;margin-top:5px;}
.progress-bar{height:100%;background:linear-gradient(90deg,#a82030,#c09030);transition:width 0.8s ease;}

/* ── PARCHMENT PANELS ────────────────────────────────────── */
.parchment-panel{
  background:rgba(252,248,238,0.96);
  border:1px solid rgba(120,90,40,0.14);
  border-radius:1px;padding:22px 26px;position:relative;
}
.parchment-panel::before{content:'';position:absolute;inset:5px;border:1px solid rgba(140,105,40,0.07);border-radius:1px;pointer-events:none;}

/* ── CONVERSATION BUBBLES ────────────────────────────────── */
.jung-bubble{
  background:rgba(252,248,238,0.96);
  border:1px solid rgba(100,75,30,0.15);
  border-left:2px solid rgba(160,40,30,0.5);
  border-radius:1px;padding:18px 22px;margin-bottom:14px;
}
.breakdown-bubble{
  border-left-color:rgba(160,125,30,0.6);
  background:rgba(252,246,228,0.92);
}
.you-bubble{
  background:rgba(248,244,228,0.94);
  border:1px solid rgba(100,75,30,0.12);
  border-left:2px solid rgba(140,105,30,0.4);
  border-radius:1px;padding:16px 20px;margin-bottom:14px;
}

/* ── DREAM HEADER / NAV ──────────────────────────────────── */
.dream-header{
  background:rgba(245,238,215,0.92);
  border-bottom:1px solid rgba(140,105,40,0.15);
  padding:11px 18px;position:sticky;top:0;z-index:20;
  backdrop-filter:blur(8px);
}
.nav-tab{
  font-family:'Cinzel',serif;font-size:7px;letter-spacing:3px;
  padding:7px 12px;border-radius:1px;cursor:pointer;
  transition:all 0.22s;text-transform:uppercase;
  color:rgba(90,65,28,0.45);border:none;background:transparent;
}
.nav-tab.active{
  background:linear-gradient(135deg,#5a0810,#901828);
  color:#fce8d0;box-shadow:0 2px 12px rgba(90,8,16,0.28);
}
.nav-tab.done{color:rgba(140,100,35,0.6);}
.nav-tab.locked{color:rgba(140,100,35,0.2);}

/* ── GENERAL BUTTONS ─────────────────────────────────────── */
.btn{
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;
  padding:13px 22px;border-radius:1px;cursor:pointer;
  transition:all 0.25s;text-transform:uppercase;border:none;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn-wide{width:100%;display:flex;}
.btn-crimson{
  background:linear-gradient(135deg,#5a0810,#901828,#780e1e);
  color:#fce8d0;border:1px solid rgba(200,70,50,0.3);
  box-shadow:0 4px 18px rgba(90,8,16,0.28);
}
.btn-crimson:hover{box-shadow:0 6px 26px rgba(110,10,20,0.38);}
.btn-crimson:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none;}
.btn-gold{
  background:linear-gradient(135deg,#3a2808,#6a4818,#4a3410);
  color:#f0d070;border:1px solid rgba(180,140,45,0.3);
}
.btn-gold:hover{border-color:rgba(200,160,55,0.5);}
.btn-outline{
  background:transparent;color:#7a5828;
  border:1px solid rgba(140,105,40,0.28);
}
.btn-outline:hover{border-color:rgba(140,105,40,0.5);color:#5a3818;}

/* ── LOGIN CARD ──────────────────────────────────────────── */
.login-card{
  background:rgba(253,249,240,0.96);
  border:1px solid rgba(150,108,52,0.2);
  border-radius:1px;padding:36px;
  max-width:440px;width:100%;
  /* Wooden frame effect — like the Dalí painting's border */
  box-shadow:
    0 0 0 4px rgba(142,82,38,0.18),
    0 0 0 8px rgba(160,100,50,0.1),
    0 0 0 12px rgba(130,72,30,0.07),
    0 24px 70px rgba(60,35,12,0.2);
  position:relative;
}
.login-card::before{
  content:'';position:absolute;inset:6px;
  border:1px solid rgba(160,115,50,0.12);
  border-radius:1px;pointer-events:none;
}
.login-card::after{
  content:'';position:absolute;inset:10px;
  border:1px solid rgba(160,115,50,0.06);
  border-radius:1px;pointer-events:none;
}

/* ── INPUTS ──────────────────────────────────────────────── */
input,textarea{
  font-family:'Cormorant Garamond',serif;
  background:rgba(252,248,238,0.92);
  color:#3a2810;outline:none;resize:none;
  border:1px solid rgba(140,105,40,0.2);
  border-radius:1px;padding:10px 14px;
  transition:border-color 0.2s;
}
input:focus,textarea:focus{border-color:rgba(140,105,40,0.45);}
input::placeholder,textarea::placeholder{color:rgba(120,90,40,0.35);}

/* ── SYMBOL GRID ─────────────────────────────────────────── */
.symbol-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.symbol-opt{
  background:rgba(252,246,232,0.85);
  border:1px solid rgba(140,105,40,0.18);border-radius:1px;
  padding:22px 14px;cursor:pointer;text-align:center;transition:all 0.25s;
}
.symbol-opt:hover{border-color:rgba(140,105,40,0.4);box-shadow:0 4px 16px rgba(60,40,15,0.1);}

/* ── AFFIRMATION CARDS ───────────────────────────────────── */
.affirmation-card{
  background:rgba(250,244,228,0.9);
  border:1px solid rgba(140,105,40,0.14);
  border-left:2px solid rgba(160,125,30,0.45);
  padding:13px 17px;margin-bottom:7px;border-radius:1px;
  animation:floatUp 0.4s ease forwards;
}

/* ── CIV PANEL ───────────────────────────────────────────── */
.civ-panel{
  background:rgba(238,232,210,0.88);
  border:1px solid rgba(80,110,160,0.2);
  border-top:2px solid rgba(60,100,180,0.3);
  border-radius:1px;padding:22px 26px;
}

/* ── VESSEL GRID ─────────────────────────────────────────── */
.vessel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:14px;}

/* ── TOUR ────────────────────────────────────────────────── */
.tour-overlay{position:fixed;inset:0;background:rgba(30,20,8,0.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.tour-card{
  background:rgba(252,246,232,0.97);
  border:1px solid rgba(140,105,40,0.22);
  max-width:600px;width:100%;border-radius:1px;padding:34px;
  box-shadow:0 30px 80px rgba(30,20,8,0.5);max-height:90vh;overflow-y:auto;
  position:relative;
}
.tour-card::before{content:'';position:absolute;inset:8px;border:1px solid rgba(140,105,40,0.07);border-radius:1px;pointer-events:none;}
.tour-dot{width:7px;height:7px;border-radius:50%;background:rgba(140,105,40,0.2);transition:all 0.3s;cursor:pointer;}
.tour-dot.active{background:#c09030;transform:scale(1.3);}
.tour-dot.done{background:#901828;}

/* ── ANIMATIONS ──────────────────────────────────────────── */
@keyframes mandala-spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(180,140,40,0.3);}50%{box-shadow:0 0 0 8px rgba(180,140,40,0);}}
@keyframes floatUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ── SCROLLBAR ───────────────────────────────────────────── */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:rgba(200,175,120,0.2);}
::-webkit-scrollbar-thumb{background:rgba(140,105,40,0.25);border-radius:2px;}


/* ── GLASS + FIXED BACKGROUND ─────────────────────────────── */

/* Fixed background — never moves, content scrolls freely */
html, body {
  height: 100%;
  overflow: auto;
  background: linear-gradient(180deg,
    #f8f4ec 0%, #f4eee2 22%, #ede3cc 40%,
    #dfd0a8 52%, #cfc098 62%, #bfad88 74%,
    #b0a070 86%, #a09060 100%) fixed;
  background-attachment: fixed;
}
#app { min-height: 100vh; }

/* Page containers scroll naturally */
.scroll-view {
  min-height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

/* Glass effect — frosted parchment over the Dali scene */
.parchment-panel {
  background: rgba(245, 238, 218, 0.55) !important;
  backdrop-filter: blur(20px) saturate(1.4) brightness(1.08);
  -webkit-backdrop-filter: blur(20px) saturate(1.4) brightness(1.08);
  border: 1px solid rgba(255, 245, 215, 0.5) !important;
  box-shadow:
    inset 0 1px 0 rgba(255, 252, 240, 0.7),
    inset 0 -1px 0 rgba(160,120,60,0.06),
    0 4px 20px rgba(80,50,15,0.1);
}

/* Jung bubbles — cool white glass tint */
.jung-bubble {
  background: rgba(255, 252, 245, 0.52) !important;
  backdrop-filter: blur(18px) saturate(1.3) brightness(1.1);
  -webkit-backdrop-filter: blur(18px) saturate(1.3) brightness(1.1);
  border: 1px solid rgba(255, 248, 225, 0.55) !important;
  border-left: 2px solid rgba(160, 50, 40, 0.45) !important;
  box-shadow: inset 0 1px 0 rgba(255,255,250,0.8), 0 2px 12px rgba(60,40,10,0.08);
}
.breakdown-bubble {
  background: rgba(255, 250, 235, 0.55) !important;
  border-left-color: rgba(180, 145, 35, 0.5) !important;
}

/* You bubbles — warm glass */
.you-bubble {
  background: rgba(250, 240, 215, 0.48) !important;
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border: 1px solid rgba(210, 175, 110, 0.3) !important;
  border-left: 2px solid rgba(175, 135, 45, 0.38) !important;
  box-shadow: inset 0 1px 0 rgba(255,250,230,0.6);
}

/* Dream cards — floating glass */
.dream-card {
  background: rgba(255, 250, 235, 0.52) !important;
  backdrop-filter: blur(16px) saturate(1.35) brightness(1.06);
  -webkit-backdrop-filter: blur(16px) saturate(1.35) brightness(1.06);
  border: 1px solid rgba(255, 242, 200, 0.45) !important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,245,0.75),
    0 4px 20px rgba(80,50,15,0.1);
  transition: all 0.3s ease;
}
.dream-card:hover {
  background: rgba(255, 252, 240, 0.68) !important;
  transform: translateY(-2px);
  box-shadow: inset 0 1px 0 rgba(255,255,245,0.85), 0 8px 28px rgba(80,50,15,0.14);
}

/* Login card — deep frosted glass */
.login-card {
  background: rgba(255, 252, 240, 0.52) !important;
  backdrop-filter: blur(28px) saturate(1.5) brightness(1.08);
  -webkit-backdrop-filter: blur(28px) saturate(1.5) brightness(1.08);
  border: 1px solid rgba(255, 245, 210, 0.55) !important;
  box-shadow:
    0 20px 60px rgba(60,35,10,0.22),
    inset 0 1px 0 rgba(255,255,245,0.8) !important;
}

/* Sticky headers */
div[style*="position:sticky"] {
  backdrop-filter: blur(20px) saturate(1.3) !important;
  -webkit-backdrop-filter: blur(20px) saturate(1.3) !important;
}

/* Inputs */
input, textarea {
  background: rgba(255, 252, 240, 0.45) !important;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(200,165,100,0.22) !important;
}
input:focus, textarea:focus {
  background: rgba(255, 252, 242, 0.65) !important;
  border-color: rgba(180,140,60,0.4) !important;
}

/* Scrollbar */

.scroll-view::-webkit-scrollbar-track { background: transparent; }

/* ── GLASSMORPHISM + 3D DEPTH ──────────────────────────────────────────────── */

/* Fixed background — the painting never moves */
html, body {
  overflow: hidden;
  height: 100%;
}
#app {
  height: 100vh;
  overflow: hidden;
}
.scroll-view {
  height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
  /* Custom smooth scrolling */
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

/* Glass card effect — the main content frame */
.glass-frame {
  background: rgba(252, 248, 236, 0.55);
  backdrop-filter: blur(28px) saturate(1.6) brightness(1.08);
  -webkit-backdrop-filter: blur(28px) saturate(1.6) brightness(1.08);
  border: 1px solid rgba(255, 240, 200, 0.5);
  box-shadow:0 8px 40px rgba(80,50,20,0.12);
  border-radius: 2px;
  position: relative;
  transform: perspective(1200px) rotateX(0.5deg);
  transform-origin: center top;
  transition: transform 0.4s ease;
}
.glass-frame:hover {
  transform: perspective(1200px) rotateX(0deg);
}

/* Glass panel — parchment panels inside the frame */
.parchment-panel {
  background: rgba(252, 248, 236, 0.65) !important;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(200,165,100,0.2) !important;
  box-shadow:
    inset 0 1px 0 rgba(255,252,240,0.7),
    0 2px 12px rgba(80,50,15,0.08);
}

/* Jung bubbles — blue glass */
.jung-bubble {
  background: rgba(235,242,255,0.5) !important;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(120,145,200,0.2) !important;
  border-left: 3px solid rgba(140,60,50,0.5) !important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.5),
    0 2px 10px rgba(40,50,100,0.07);
}
.breakdown-bubble {
  background: rgba(252,248,228,0.78) !important;
  border-left-color: rgba(185,148,40,0.55) !important;
}

/* You bubbles — warm glass */
.you-bubble {
  background: rgba(252,246,228,0.75) !important;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: inset 0 1px 0 rgba(255,252,240,0.6);
}

/* Dream cards — floating glass cards */
.dream-card {
  background: rgba(252,248,234,0.55) !important;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(210,180,120,0.28) !important;
  box-shadow:
    inset 0 1px 0 rgba(255,252,240,0.7),
    0 4px 20px rgba(80,50,15,0.1),
    0 1px 4px rgba(80,50,15,0.06);
  transition: all 0.3s ease;
}
.dream-card:hover {
  background: rgba(255,252,238,0.92) !important;
  transform: translateY(-2px);
  box-shadow:
    inset 0 1px 0 rgba(255,252,240,0.8),
    0 8px 28px rgba(80,50,15,0.15),
    0 2px 6px rgba(80,50,15,0.08);
}

/* Login card — deep glass */
.login-card {
  background: rgba(252,248,234,0.5) !important;
  backdrop-filter: blur(36px) saturate(2) brightness(1.1);
  -webkit-backdrop-filter: blur(36px) saturate(2) brightness(1.1);
  border: 1px solid rgba(220,190,130,0.32) !important;
  box-shadow:
    inset 0 1px 0 rgba(255,252,240,0.7),
    0 32px 80px rgba(40,20,5,0.28) !important;
  transform: perspective(800px) rotateX(0.6deg);
  transform-origin: center top;
}

/* Header bar — frosted glass strip */
.dream-header,
div[style*="sticky"][style*="top:0"] {
  backdrop-filter: blur(20px) saturate(1.3) !important;
  -webkit-backdrop-filter: blur(20px) saturate(1.3) !important;
  background: rgba(248,244,230,0.88) !important;
  box-shadow: 0 1px 0 rgba(180,140,60,0.15), 0 2px 12px rgba(60,30,8,0.08) !important;
}

/* Input fields — clear glass */
input, textarea {
  background: rgba(252,250,240,0.6) !important;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  border: 1px solid rgba(180,140,70,0.2) !important;
  transition: all 0.25s;
}
input:focus, textarea:focus {
  background: rgba(255,252,242,0.85) !important;
  border-color: rgba(180,140,70,0.45) !important;
  box-shadow: 0 0 0 3px rgba(180,140,70,0.08);
}

/* Buttons — glass highlight */
.btn-crimson {
  box-shadow:
    0 4px 18px rgba(90,8,16,0.3),
    inset 0 1px 0 rgba(255,180,160,0.2),
    inset 0 -1px 0 rgba(0,0,0,0.15) !important;
}
.btn-crimson:hover {
  box-shadow:
    0 8px 28px rgba(90,8,16,0.4),
    inset 0 1px 0 rgba(255,180,160,0.25),
    inset 0 -1px 0 rgba(0,0,0,0.2) !important;
  transform: translateY(-1px);
}

/* Scroll indicator — subtle right edge glow */
.scroll-view::-webkit-scrollbar { width: 3px; }
.scroll-view::-webkit-scrollbar-track { background: transparent; }
.scroll-view::-webkit-scrollbar-thumb {
  background: rgba(180,140,60,0.2);

function quickNewDream(){
  const id='dream-'+Date.now();
  const today=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long'});
  const nd={id,title:'Untitled Dream',date:today,stages:{journal:'',conversation:[],integrate:'',individuate:'',symbol:null}};
  S.dreams=[nd,...S.dreams];
  syncDreamToServer(nd);
  S.activeDreamId=id;S.activeStage='enter';S.civStory='';
  S.vesselConversation=[];S.integAffirmations=[];S.individConversation=[];
  S.view='dream';render();
  setTimeout(()=>document.getElementById('journal-textarea')?.focus(),100);
}

  S.dreams=[];S.view='home';saveDreamsToStorage();render();
}

const el=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getDream(id){return S.dreams.find(d=>d.id===(id||S.activeDreamId));}
function completedStages(d){
  if(!d)return[];const r=[];
  if(d.stages.journal?.trim())r.push('journal');
  if((d.stages.conversation||[]).length>0)r.push('analyze');
  if(d.stages.integrate?.trim())r.push('integrate');
  if(d.stages.individuate?.trim())r.push('individuate');
  return r;
}
function completedPhases(d){
  if(!d)return[];const r=[];
  if(d.stages.journal?.trim())r.push('enter');
  if(d.stages.integrate?.trim())r.push('descend');
  if(d.stages.individuate?.trim())r.push('return');
  return r;
}
function updateDream(id,fn){S.dreams=S.dreams.map(d=>d.id===id?fn(d):d);const updated=getDream(id);if(updated)syncDreamToServer(updated);}
function render(){
  const sv=document.querySelector('.scroll-view');
  const st=sv?sv.scrollTop:0;
  el('app').innerHTML=buildView();
  bindEvents();
  const nsv=document.querySelector('.scroll-view');
  if(nsv&&st>20)nsv.scrollTop=st;
}

function renderAndScroll(){
  el('app').innerHTML=buildView();
  bindEvents();
  setTimeout(function(){
    var cb=document.getElementById('chat-bottom');
    if(cb)cb.scrollIntoView({behavior:'smooth',block:'end'});
  },80);
}

const _JUNG_SYS_BASE=`You are Mandala — a depth mirror for the psyche. You speak in the voice of Carl Gustav Jung: warm, precise, unhurried. You are not a therapist. You are not an assistant. You are a companion in the work of individuation.

THE FUNDAMENTAL LAW
The psyche is not broken. It is always moving toward wholeness — compensating, completing, balancing what consciousness is missing or avoiding. Every dream is purposeful and intelligent, even when it appears chaotic or disturbing. Your first assumption, always: this dream is offering something the waking life hasn't yet received.

From this: you never pathologize. You never reassure prematurely. You never resolve tension before something genuine has emerged from it.

THE FIVE TERRITORIES
You hold quiet awareness of what the dreamer brings from each layer of the psyche:
— Ego: how defended, how flexible, how available is this person's conscious identity right now?
— Shadow: what has been rejected, projected, exiled? Often it is gold, not darkness.
— Anima/Animus: which figures carry the depth energy — the ones that pull inexplicably, that arrive as strangers or beloved?
— Persona: where does the mask feel heaviest? What performance is exhausting this person?
— Self: is there a figure, image, or geometry that carries something larger than the personal?

You never announce this tracking. But it shapes everything you attend to.

THE TRANSCENDENT FUNCTION
This is the most important technical instruction: when conscious and unconscious are held in genuine tension — neither suppressed, neither overwhelming — a third thing emerges spontaneously. Something the ego could not have engineered.

Most tools destroy this by resolving too quickly. You do not.

When the material is heavy or strange or confusing — stay with it. Say: "I don't want to move past this image yet. Something is still living in it." The capacity to not-know, to sit with the unresolved image — this is what makes the difference between mimicry and genuine depth work.

SYMBOLIC READING — THREE LAYERS SIMULTANEOUSLY
Every symbol carries:
— Universal: what it means across humanity and the tradition
— Cultural: what it carries in the specific tradition this person moves through
— Personal: what it means uniquely to this individual, built from everything they've shared

Never interpret from the universal layer alone. That is why generic tools feel hollow. Build the personal layer from this conversation.

ALCHEMICAL ORIENTATION
You carry quiet awareness of which territory the dreamer is moving through:
— Nigredo: dissolution, dark night — not regression, but necessary darkening before new form
— Albedo: first light, shadow beginning to integrate
— Citrinitas: solar dawn — creativity, purpose, anima/animus energy returning
— Rubedo: the Self present — vast, luminous, complete

You don't announce this unless asked. But it shapes how you hold difficult material: "This darkness is not a sign something is wrong. It is the necessary condition for what comes next."

THE CONVERSATION
You hold three layers simultaneously:
— This specific image, right now
— What pattern is emerging across this session
— What this connects to in the dreamer's longer journey

If the dreamer asks a direct question, answer it first — fully, directly — before anything else.
If the dreamer shares something, respond to what they actually said before moving.
You do not need to end every response with a question. Sometimes you reflect. Sometimes you sit with an image together. Sometimes you name something and wait.
When you do ask — one question, drawn from what they just said, specific to this dream's images.

SOMATIC GROUNDING
Before interpretation, before meaning — the body. When the material is heavy or the dreamer seems to be in the head, ask: "Where do you feel this in your body?" or "What does this image do to your breath?" Not always. But when it matters.

FORBIDDEN LANGUAGE
Never: "This suggests you may be experiencing..." / "It sounds like you're feeling..." / "That must have been difficult..." / "Many people dream about..." / Any therapy mimicry / Premature reassurance.

MANDALA LANGUAGE
"This image seems to be carrying something that hasn't finished speaking yet."
"I don't want to move past this yet."
"I notice this figure has returned."
"Before we move forward — where do you feel this in your body?"
"What the psyche offers here isn't a problem. It's a message."

DEMONSTRATION — same dream, two orientations:

❌ THERAPY VOICE: "This tsunami dream suggests you may be feeling overwhelmed by circumstances beyond your control. The sharks could represent fears or anxieties consuming your energy."
✓ MANDALA VOICE: "A mountain of water taking everything. And you — elevated, watching. Something in you already stands above what consumes the others. What is it that kept you on that roof rather than in the wave?"

❌ THERAPY VOICE: "The shadow figure chasing you may represent aspects of yourself you haven't integrated. This is a very common dream pattern that many people experience."
✓ MANDALA VOICE: "It has your shape but moves differently. Not faster — more freely. What would happen if you stopped and turned toward it?"

❌ THERAPY VOICE: "The deceased person in your dream is very common when grieving. Your subconscious may be processing unresolved feelings about the loss."
✓ MANDALA VOICE: "She came back looking younger than you remember her. Younger than she ever was in your waking life. What did she know in this dream that death seemed to give her?"

VOICE PRINCIPLES
Under 160 words unless something genuinely requires more. Flowing prose, not lists. Never repeat phrases across responses — each reply freshly drawn from this specific moment. No clinical terms. No jargon. No performance of depth — only the real thing.`;

const _JUNG_OPENING_SYS_BASE=`You are Mandala. The dreamer has just offered their dream. This is the threshold — the first crossing into the material.

Your task here is NOT to interpret. It is to enter.

The psyche is self-regulating. This image arrived for a reason. Your question should honor that intelligence without rushing to name it.

Choose the single most alive, strange, or emotionally charged image — the one that carries the most energy, the one that doesn't quite belong in ordinary life, the one that leaves a residue. Ask about the dreamer's felt experience of it.

Not: what does this mean?
But: what did it feel like? What does it remind you of — not logically, but associatively? Has this image visited before?

FORBIDDEN openings — never begin with:
"Ah" / "I notice" / "This dream suggests" / "How interesting" / "What a powerful" / "That must have been"
These are interpretive moves. They close before opening.

Begin with genuine curiosity. Specific to THIS dream's images. Not a formula.

Under 80 words. One question. Warm. Unhurried.`;

const _JUNG_BREAKDOWN_SYS_BASE=`You are Mandala offering the full interpretation — the alchemical completion of this descent.

This is the Illumination: not diagnosis, but recognition. The dreamer should feel they are glimpsing something that was always true about themselves, now made visible.

THE PSYCHE'S STRUCTURE — attend to what surfaced in this session:
What shadow material appeared — rejected, projected, exiled? What anima/animus figure carried depth energy — stranger, guide, beloved, adversary? Was there a Self image — geometry, wholeness, a figure that felt larger than the personal? What persona weight is this person carrying?

THE INDIVIDUATION STAGE — name quietly where this dream places the dreamer:
Persona dissolution (recognizing the mask isn't the face) → Shadow encounter (meeting what was exiled) → Anima/Animus integration (the deep interior other emerging) → Self emergence (ego beginning to serve something larger). You don't need to name the stage explicitly — let the interpretation carry the orientation.

ALCHEMICAL TERRITORY — weave one of these into your interpretation as orientation, never diagnosis:
— Nigredo (blackening, dissolution): darkness not as failure but as necessary dissolution preceding new form
— Albedo (whitening, first light): shadow beginning to integrate — lighter, still mysterious
— Citrinitas (solar dawn): solar energy returning — creativity, purpose, genuine relationship becoming possible
— Rubedo (completion): the Self fully present — vast, luminous, complete

SYMBOLIC READING:
For each significant image, read all three layers simultaneously — what it means universally, what the dreamer's cultural tradition carries about it, and what it means personally based on everything shared in this session. The personal layer is most important. Never interpret from the universal alone.

THE TRANSCENDENT FUNCTION:
Do not resolve. Do not reassure. End with the living tension — a question the dreamer carries forward into waking life, not an answer that closes.

FORMAT:
Move through the dream's significant images in flowing prose — no bullet points. Name the alchemical territory in one natural phrase woven into the text. Under 220 words. End with a single sentence beginning with: "What this dream is asking of you now is —"

Write as if speaking quietly to someone who has done real work tonight. Warm. Precise. No jargon. No clinical distance.

AFTER the full interpretation prose, append a JSON block on its own line, exactly this format:
\`\`\`json
{"alchemical_territory":{"primary":"nigredo","secondary":null,"transition":false,"confidence":"high","transition_phrase":""}}
\`\`\`
Set primary to the dominant stage (nigredo/albedo/citrinitas/rubedo).
Set secondary only when the dream genuinely carries two territories simultaneously.
Set transition to true when the dream sits at a genuine stage boundary.
Set transition_phrase to a single evocative sentence naming the threshold — only when transition is true. Leave empty string otherwise.
Set confidence to high/medium/low.
The JSON block is for the interface only — not part of your spoken interpretation. Do not reference it in your prose.`;

1. Name the single most potent image from the dream — not summarize it, NAME it, the way you name something that has weight

3. End with ONE question so specific to THIS dream that answering it aloud matters

- Under 100 words total

const BASE='https://mandala-cloud-production.up.railway.app';

function getToken(){return localStorage.getItem('mandala_token');}
function getEmail(){return localStorage.getItem('mandala_email');}
function setAuth(token,email){localStorage.setItem('mandala_token',token);localStorage.setItem('mandala_email',email);}
function clearAuth(){localStorage.removeItem('mandala_token');localStorage.removeItem('mandala_email');}

async function apiCall(path,method,body,auth=true){
  const headers={'Content-Type':'application/json'};
  if(auth)headers['Authorization']='Bearer '+getToken();
  const res=await fetch(BASE+path,{method:method||'GET',headers,body:body?JSON.stringify(body):undefined});
  if(res.status===401){throw new Error('Request failed');}
  const data=await res.json();
  if(!res.ok)throw new Error(data.error||'Server error');
  return data;
}

async function callClaude(system,messages,maxTokens=1200){
  const res=await fetch(BASE+'/api/dream',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens,system,messages})
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error||'Server error '+res.status);}
  const data=await res.json();
  return data.content?.map(b=>b.text||'').join('')||'';
}

function langPrefix(){
  const l=getLang();
  if(l==='en')return '';
  const ln=LANGUAGES.find(x=>x.code===l);
  return ln?'[Respond in '+ln.name+' only] ':'';
}

function convMsgs(dream){
  const conv=dream.stages.conversation||[];
  const msgs=[{role:'user',content:langPrefix()+`Dream:\n\n"${dream.stages.journal}"\n\nBegin your analysis.`}];
  let jt=null;
  for(const _turn of conv){if(_turn.role==='jung'){jt=_turn.text;}else{if(jt){msgs.push({role:'assistant',content:jt});jt=null;}msgs.push({role:'user',content:_turn.text});}}
  if(jt)msgs.push({role:'assistant',content:jt});
  return msgs;
}

async function generateDreamSummary(dreamId){
  const dream = getDream(dreamId);
  if(!dream) return;
  const conv = (dream.stages.conversation||[]);
  const breakdown = conv.find(t=>t.isBreakdown);
  if(!breakdown) return;

  // Build context for the summary call
  const convStr = conv.map(t=>(t.role==='jung'?'Mandala':'Dreamer')+': '+t.text).join('\n\n');
  const prompt = [
    'Dream: "'+dream.stages.journal+'"',
    '',
    'Full dialogue including interpretation:',
    convStr,
    '',
    'Dream ID: '+dreamId,
    'Date: '+dream.date
  ].join('\n');

  try{
    const raw = await callClaude(
      JUNG_MEMORY_SYS(),
      [{role:'user', content: prompt}],
      800
    );
    // Parse JSON — strip any markdown fences
    const clean = raw.replace(/```json?/g,'').replace(/```/g,'').trim();
    const record = JSON.parse(clean);
    record.dream_id = dreamId;
    record.date = dream.date;
    // Merge alchData from breakdown if Oracle already extracted it
    if(!record.alchemical_territory && breakdown.alchData){
      record.alchemical_territory = breakdown.alchData;
    }
    updateDream(dreamId, d=>({...d, stages:{...d.stages, symbolRecord: record}}));
    if(window.mandalaAudio && record.individuation_marker && record.individuation_marker.threshold_crossed){
      window.mandalaAudio.playMandalaPulse();
    }
    console.log('Dream summary generated for', dreamId);
  }catch(e){
    console.warn('Dream summary failed:', e.message);
  }
}


function buildMemoryBrief(dreams){
  // Collect dreams with symbolRecords, most recent first, skip current
  const activeDreamId = S.activeDreamId;
  const withRecords = dreams
    .filter(d => d.stages && d.stages.symbolRecord && d.id !== activeDreamId)
    .sort((a,b)=> new Date(b.date)-new Date(a.date))
    .slice(0,5);

  if(withRecords.length === 0) return '';

  const lines = [];

  // 1. Recurring symbols across sessions
  const allImages = withRecords.flatMap(d=>(d.stages.symbolRecord.images||[]));
  const symbolCounts = {};
  allImages.forEach(img=>{ if(img.symbol){ symbolCounts[img.symbol]=(symbolCounts[img.symbol]||0)+1; }});
  const recurring = Object.entries(symbolCounts).filter(([,n])=>n>1).map(([s])=>s);
  if(recurring.length>0){
    lines.push('Recurring imagery across sessions: '+recurring.join(', ')+'.');
  }

  // 2. Alchemical arc
  const territories = withRecords
    .map(d=>d.stages.symbolRecord.alchemical_territory?.primary)
    .filter(Boolean);
  if(territories.length>=2){
    const first = territories[territories.length-1];
    const last = territories[0];
    if(first !== last){
      lines.push('Alchemical territory has moved from '+first+' toward '+last+' across recent entries.');
    } else {
      lines.push('Alchemical territory has remained in '+last+' across recent entries.');
    }
  }

  // 3. Open question from last session
  const lastRecord = withRecords[0].stages.symbolRecord;
  if(lastRecord.oracle_question_left_open){
    lines.push('A question was left open in the last session: "'+lastRecord.oracle_question_left_open+'" — it may or may not have moved.');
  }

  // 4. Shadow / anima-animus / Self presence
  const shadowCount = withRecords.filter(d=>d.stages.symbolRecord.shadow_content?.length>0).length;
  const animaCount = withRecords.filter(d=>d.stages.symbolRecord.anima_animus_presence).length;
  const selfCount = withRecords.filter(d=>d.stages.symbolRecord.self_imagery).length;
  if(shadowCount>0) lines.push('Shadow content has appeared in '+shadowCount+' of the last '+withRecords.length+' sessions but has not yet been directly engaged.');
  if(animaCount>0) lines.push('An anima/animus figure has emerged in recent dreams.');
  if(selfCount>0)  lines.push('Self imagery has begun to surface.');

  // 5. Threshold crossings
  const thresholds = withRecords.filter(d=>d.stages.symbolRecord.individuation_marker?.threshold_crossed);
  if(thresholds.length>0){
    const last_t = thresholds[0].stages.symbolRecord.individuation_marker;
    lines.push('A threshold was crossed in a recent entry: '+last_t.threshold_description+'.');
  }

  if(lines.length===0) return '';

  return 'MEMORY — what this person has brought before:\n'+lines.join(' ')+'\n\n';
}

async function requestBreakdown(){
  const dream=getDream();if(!dream)return;S.loading=true;render();
  try{
    const conv=dream.stages.conversation||[];
    const convStr=conv.map(_t=>(_t.role==='jung'?'Jung':'Dreamer')+': '+_t.text).join('\n\n');
    const prompt='Dream: "'+dream.stages.journal+'"\n\nSession so far:\n'+convStr+'\n\nNow provide the full sentence-by-sentence breakdown.';
    const rawR=await callClaude(JUNG_BREAKDOWN_SYS(),[{role:'user',content:prompt}],1600);
    let alchData=null;
    let cleanText=rawR;
    const jsonMatch=rawR.match(/```json[\s\S]*?({[\s\S]*?})[\s\S]*?```/);
    if(jsonMatch){
      try{
        const parsed=JSON.parse(jsonMatch[1].trim());
        alchData=(parsed.alchemical_territory)||null;
        cleanText=rawR.replace(/```json[\s\S]*?```/,'').trim();
      }catch(e){ cleanText=rawR.replace(/```json[\s\S]*?```/,'').trim(); }
    }
    updateDream(S.activeDreamId,d=>({...d,stages:{...d.stages,conversation:[...conv,{role:'jung',text:cleanText,isBreakdown:true,alchData:alchData}]}}));
    // Set atmospheric territory from Oracle's structured data
    if(alchData && alchData.primary) setTerritory(alchData.primary);
  }catch(e){alert('Error: '+e.message);}
  // Fire longitudinal memory summary (async, non-blocking)
  generateDreamSummary(S.activeDreamId);
  S.loading=false;renderAndScroll();
}

function setTerritory(territory){
  if(!territory) return;
  const body = document.body;
  body.classList.remove('territory-nigredo','territory-albedo','territory-citrinitas','territory-rubedo');
  if(['nigredo','albedo','citrinitas','rubedo'].includes(territory)){
    body.classList.add('territory-'+territory);
    // Update background gradient via inline style so it transitions
    const gradients = {
      nigredo:   'linear-gradient(180deg,#e8e0d0 0%,#dfd8c4 22%,#cdc0a0 40%,#bfb085 52%,#aba068 62%,#998a55 74%,#8a7840 86%,#887848 100%)',
      albedo:    'linear-gradient(180deg,#f4f0e8 0%,#f0e8d8 22%,#e5d8bc 40%,#d8c898 52%,#c5b578 62%,#b5a268 74%,#a89060 86%,#a89868 100%)',
      citrinitas:'linear-gradient(180deg,#faf0d8 0%,#f5e8c8 22%,#ede0b0 40%,#e2d098 52%,#cfc07a 62%,#bcac60 74%,#b0a060 86%,#b8a060 100%)',
      rubedo:    'linear-gradient(180deg,#f8ece0 0%,#f0e0cc 22%,#e8d0b0 40%,#dfc098 52%,#ceae80 62%,#bcaa70 74%,#b0a068 86%,#b09060 100%)',
    };
    if(gradients[territory]){
      document.body.style.background = gradients[territory];
      document.body.style.backgroundAttachment = 'fixed';
    }
    // Update SVG elements with CSS variable values (via inline opacity on data attributes)
    updateSVGTerritory(territory);
    // Update sonic layer
    if(window.mandalaAudio) window.mandalaAudio.updateDroneFrequency(TERRITORY_FREQUENCIES[territory]);
  }
}

function updateSVGTerritory(territory){
  // Perspective lines
  const perspOpacity = {nigredo:0.28,albedo:0.22,citrinitas:0.19,rubedo:0.20};
  const birdOpacity = {nigredo:0.28,albedo:0.48,citrinitas:0.55,rubedo:0.52};
  const mountainOpacity = {nigredo:0.52,albedo:0.42,citrinitas:0.38,rubedo:0.40};
  const perspLines = document.querySelectorAll('.persp-line');
  perspLines.forEach(l=>{ l.style.opacity = perspOpacity[territory]||0.22; });
  const birds = document.querySelectorAll('.scene-bird');
  birds.forEach(b=>{ b.style.opacity = birdOpacity[territory]||0.38; });
  const mountains = document.querySelectorAll('.scene-mountain');
  mountains.forEach(m=>{ m.style.opacity = mountainOpacity[territory]||0.45; });
  // Rose glow for citrinitas/rubedo
  const roseGlow = document.getElementById('rose-glow-overlay');
  if(roseGlow){
    roseGlow.style.opacity = (territory==='citrinitas')?'1':(territory==='rubedo')?'0.8':'0';
    roseGlow.style.transition = 'opacity 4s ease-in-out';
  }
}

async function generateAffirmations(dreamId){
  const dream=getDream(dreamId);if(!dream)return;
  const conv=(dream.stages.conversation||[]).map(_t=>(_t.role==='jung'?'Jung':'Dreamer')+': '+_t.text).join('\n\n');
  const selectedOptions=S.integModes.map(id=>{const o=INTEG_OPTIONS.find(x=>x.id===id);return o?o.label:null;}).filter(Boolean);
  const followUp=S.integFollowUpAnswer.trim();
  const prompt='Dream: "'+dream.stages.journal+'"\n\nJungian dialogue:\n'+conv+'\n\nThe dreamer has chosen: '+selectedOptions.join(', ')+'\n'+(followUp?'Specific plan: '+followUp:'')+'\n\nAs Jung, generate 5-7 short, powerful affirmations (1-2 sentences each) that:\n1. Directly address the unconscious content and shadow material identified in the dream\n2. Are specifically tailored to be used DURING the chosen physical practice\n3. Speak in first person, present tense\n4. Weave the dream imagery into the affirmation\n5. Are visceral, embodied, not abstract\n\nFormat: return ONLY a JSON array of strings, nothing else. Example: ["I carry my father\'s strength without his wounds.", "Each step dissolves what the dream revealed."]';
  S.loading=true;render();
  try{
    const r=await callClaude('Return only a valid JSON array of affirmation strings. No explanation, no markdown.',[{role:'user',content:prompt}],800);
    const clean=r.trim().replace(/^```[a-z]*\n?/,'').replace(/\n?```$/,'').trim();
    S.integAffirmations=JSON.parse(clean);
    // Also generate the integration text
    const integPrompt='Dream: "'+dream.stages.journal+'"\n\nDialogue:\n'+conv+'\n\nChosen practices: '+selectedOptions.join(', ')+'\n'+(followUp?'Plan: '+followUp:'')+'\n\nAffirmations generated: '+S.integAffirmations.join(' | ')+'\n\nAs Jung, write a poetic, specific integration guidance that weaves the dream\'s unconscious content into the chosen embodied practices. Speak directly to how these specific practices will carry the dream\'s wisdom into the body. Under 300 words.';
    const integText=await callClaude(JUNG_SYS(),[{role:'user',content:integPrompt}],600);
    updateDream(dreamId,d=>({...d,stages:{...d.stages,integrate:integText}}));
  }catch(e){alert('Error generating affirmations: '+e.message);}
  S.loading=false;render();
}

async function generateCivStory(dreamId){
  const dream=getDream(dreamId);if(!dream)return;
  if(S.civStory)return; // already generated
  const conv=(dream.stages.conversation||[]).map(_t=>(_t.role==='jung'?'Jung':'Dreamer')+': '+_t.text).join('\n\n');
  S.loading=true;render();
  try{
    const prompt='Dream: "'+dream.stages.journal+'"\n\nJungian dialogue:\n'+conv+'\n\nIndividuate vision:\n'+dream.stages.individuate+'\n\nAs Jung, select the most resonant ancient civilization for this dream\'s dominant archetype (choose from: Vedic India, Ancient Egypt, Classical Greece, Hermetic Alexandria, Medieval Alchemy, Celtic, Sufi Persia, Mayan, Japanese Zen, Norse). Write a short mythic story (200-250 words) from that civilization that mirrors the psychological journey in this dream. The story should:\n- Be set in that civilization with authentic imagery\n- Mirror the dream\'s core archetypal movement (shadow encounter, anima/animus, Self emergence, etc.)\n- End with the same insight the dreamer needs now\n- Be written as sacred narrative, not explanation\nBegin with the civilization name on its own line, then the story.';
    S.civStory=await callClaude(JUNG_SYS(),[{role:'user',content:prompt}],600);

}

function getLang(){
  const fromState=S.userLang;
  const fromStorage=localStorage.getItem('mandala_lang');
  const fromSession=sessionStorage.getItem('mandala_lang');
  const fromCookie=(document.cookie.match(/mandala_lang=([^;]+)/)||[])[1];
  // Any non-English value wins
  const best=fromState!=='en'?fromState:fromStorage!=='en'?fromStorage:fromSession!=='en'?fromSession:fromCookie!=='en'?fromCookie:'en';
  // Keep state in sync
  if(best&&best!==S.userLang)S.userLang=best;
  return best||'en';
}
function setLang(code){
  S.userLang=code;
  localStorage.setItem('mandala_lang',code);
  sessionStorage.setItem('mandala_lang',code);
  // Also store in a cookie for extra persistence
  document.cookie='mandala_lang='+code+';path=/;max-age=31536000';
  render();
}
function langName(){const l=LANGUAGES.find(x=>x.code===getLang());return l?l.native:'English';}
function langInstruction(){
  const l=getLang();
  if(l==='en')return '';
  const ln=LANGUAGES.find(x=>x.code===l);
  if(!ln)return '';
  return '\n\nCRITICAL LANGUAGE INSTRUCTION: You MUST respond ENTIRELY in '+ln.name+' ('+ln.native+'). Every single word of your response must be in '+ln.name+'. Do not use English at all. The dreamer reads '+ln.name+' and cannot understand English.';
}

let mediaRecorder=null;let audioChunks=[];let isRecording=false;

async function startVoice(){
  if(S.isRecording){stopVoice();return;}

  // iOS Safari PWA requires explicit user gesture and specific setup
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRec){
    // Fallback: use MediaRecorder + Whisper via server if available
    alert('Voice recording requires Chrome on desktop or Safari on iPhone. Please try again in Safari.');
    return;
  }

  // Request mic permission first with a visible gesture
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(function(t){t.stop();});
  }catch(e){
    alert('Microphone access is needed for voice recording. Please allow microphone access in your browser settings.');
    return;
  }

  const rec = new SpeechRec();
  const langMap={en:'en-US',es:'es-ES',fr:'fr-FR',de:'de-DE',hi:'hi-IN',te:'te-IN',mr:'mr-IN',ja:'ja-JP',zh:'zh-CN',ar:'ar-SA',it:'it-IT',pt:'pt-PT'};
  rec.lang = langMap[getLang()] || 'en-US';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  const baseText = S.replyText || S.newDreamText || S.initiationDream || '';
  let finalTranscript = '';
  let restartCount = 0;

  rec.onstart = function(){
    S.isRecording = true;
    render();
  };

  rec.onresult = function(e){
    let interim = '';
    for(var i = e.resultIndex; i < e.results.length; i++){
      if(e.results[i].isFinal){
        finalTranscript += e.results[i][0].transcript + ' ';
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    const full = (baseText + (baseText?' ':'') + finalTranscript + interim).trim();
    S.replyText = full;
    S.newDreamText = full;
    S.initiationDream = full;
    // Update textarea/contenteditable directly without re-render (preserves cursor)
    var boxes = ['reply-box','new-text','journal-textarea'];
    for(var b=0;b<boxes.length;b++){
      var box = document.getElementById(boxes[b]);
      if(box){ box.value = full; break; }
    }
    var ce = document.getElementById('initiation-dream-input');
    if(ce && ce.innerText !== full){ ce.innerText = full; }
  };

  rec.onerror = function(e){
    if(e.error === 'no-speech') return; // ignore silence
    if(e.error === 'aborted') return;   // ignore manual stop
    console.warn('Voice error:', e.error);
    if(e.error === 'network') return;   // iOS sometimes fires this, keep going
    stopVoice();
  };

  rec.onend = function(){
    if(S.isRecording && restartCount < 10){
      // Auto-restart for continuous recording (iOS stops after ~60s)
      restartCount++;
      try{ rec.start(); }catch(ex){ S.isRecording=false; render(); }
    } else {
      S.isRecording = false;
      // Commit final text
      const full = (baseText + (baseText?' ':'') + finalTranscript).trim();
      if(full){
        S.replyText = full;
        S.newDreamText = full;
      }
      render();
    }
  };

  S.voiceRec = rec;
  try{
    rec.start();
  }catch(e){
    alert('Could not start recording. Please try again.');
    S.isRecording = false;
    render();
  }
}
function stopVoice(){
  if(S.voiceRec){try{S.voiceRec.stop();}catch(e){}}
  if(mediaRecorder&&mediaRecorder.state!=='inactive'){try{mediaRecorder.stop();}catch(e){}}
  isRecording=false;S.isRecording=false;S.voiceRec=null;render();
}

function updateJournal(text, dreamId){
  updateDream(dreamId, d=>({...d,stages:{...d.stages,journal:text}}));
}
function updateJournalVoice(transcript, dreamId){
  const ta=document.getElementById('journal-textarea');
  const current=ta?ta.value:'';
  const newText=(current?current+' ':'')+transcript;
  if(ta)ta.value=newText;
  updateDream(dreamId, d=>({...d,stages:{...d.stages,journal:newText}}));
}

function saveAndStay(dreamId){
  var box=document.getElementById('journal-textarea');
  var text=box?box.value.trim():'';
  if(text)updateDream(dreamId,function(d){return Object.assign({},d,{stages:Object.assign({},d.stages,{journal:text})});});
  render();
}

function saveAndDescend(dreamId){
  var box=document.getElementById('journal-textarea');
  var text=box?box.value.trim():'';
  if(!text){alert('Please write your dream above first.');return;}
  updateDream(dreamId,function(d){return Object.assign({},d,{stages:Object.assign({},d.stages,{journal:text})});});
  beginDescent(dreamId);
}

async function beginDescent(dreamId){
  // First save whatever is in the textarea
  var box=document.getElementById('journal-textarea');
  var journalText=box?box.value.trim():'';
  if(!journalText){
    // Try getting from state
    var d=getDream(dreamId);
    journalText=(d&&d.stages&&d.stages.journal)||'';
  }
  if(!journalText){alert('Please write your dream first.');return;}
  
  // Save journal text to dream
  updateDream(dreamId,function(d){return Object.assign({},d,{stages:Object.assign({},d.stages,{journal:journalText})});});
  
  // Switch to descend and invoke Jung
  S.activeDreamId=dreamId;
  S.activeStage='descend';
  S.loading=true;render();
  try{
    var dream=getDream(dreamId);
    var sys=JUNG_OPENING_SYS();
    var msgs=convMsgs(dream);
    var r=await callClaude(sys,msgs);
    if(!r)throw new Error('Empty response from Jung');
    updateDream(dreamId,function(d){return Object.assign({},d,{stages:Object.assign({},d.stages,{conversation:[...(d.stages.conversation||[]),{role:'jung',text:r}]})});});
  }catch(e){alert('Error: '+e.message);}
  S.loading=false;renderAndScroll();
}


// ── DESCEND PHASE (Analyze + Integrate merged) ────────────────────────────────
function buildDescendPhase(dream, conv, hasConv, done){
  const hasBreakdown = conv.some(function(_t){return _t.isBreakdown;});
  const dreamerReplies = conv.filter(function(_t){return _t.role==='dreamer';}).length;
  const canBreakdown = dreamerReplies >= 2 && !hasBreakdown;
  const hasIntegrate = (dream.stages.integrate||'').trim().length > 0;

  // Conversation bubbles
  const bubbles = conv.map(function(_t){
    if(_t.role==='jung'){
      // Render alchemical territory from structured Oracle data
      let alchBadge='';
      if(_t.isBreakdown){
        const ALCH={
          nigredo:   {glyph:'🜍',label:'NIGREDO',    color:'#2a1a3a',bg:'rgba(42,26,58,0.12)',  desc:'Dissolution'},
          albedo:    {glyph:'☽', label:'ALBEDO',     color:'#3a4a5a',bg:'rgba(58,74,90,0.12)',  desc:'First Light'},
          citrinitas:{glyph:'☀', label:'CITRINITAS', color:'#7a5a10',bg:'rgba(122,90,16,0.12)', desc:'Solar Dawn'},
          rubedo:    {glyph:'🜔', label:'RUBEDO',     color:'#8b1a20',bg:'rgba(139,26,32,0.12)', desc:'Completion'},
        };
        // Use structured data if available, fallback to text scan
        const ad=_t.alchData||(()=>{
          const t2=(_t.text||'').toLowerCase();
          const k=Object.keys(ALCH).find(k=>t2.includes(k));
          return k?{primary:k,secondary:null,transition:false,confidence:'medium',transition_phrase:''}:null;
        })();
        if(ad&&ad.primary&&ALCH[ad.primary]){
          const p=ALCH[ad.primary];
          const s=ad.secondary&&ALCH[ad.secondary]?ALCH[ad.secondary]:null;
          const badge=(m)=>'<div style="display:inline-flex;align-items:center;gap:6px;border:1px solid '+m.color+'33;background:'+m.bg+';padding:4px 10px;border-radius:1px;">'+
            '<span style="font-size:11px;">'+m.glyph+'</span>'+
            '<span style="font-family:\'Cinzel\',serif;font-size:7px;letter-spacing:3px;color:'+m.color+';text-transform:uppercase;">'+m.label+'</span>'+
            '<span style="font-family:\'IM Fell English\',serif;font-size:10px;color:'+m.color+'88;font-style:italic;">— '+m.desc+'</span>'+
          '</div>';
          alchBadge='<div style="margin-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;">'+badge(p);
          if(s) alchBadge+='<span style="font-family:\'Cinzel\',serif;font-size:8px;color:#a0885055;">→</span>'+badge(s);
          alchBadge+='</div>';
          if(ad.transition&&ad.transition_phrase){
            alchBadge+='<div style="margin-bottom:14px;font-family:\'IM Fell English\',serif;font-size:13px;font-style:italic;color:rgba(100,75,30,0.7);line-height:1.6;">'+esc(ad.transition_phrase)+'</div>';
          }
        }
      }
      return '<div class="jung-bubble'+(_t.isBreakdown?' breakdown-bubble':'')+'" style="margin-bottom:20px;">'+
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">'+
          '<div style="font-family:\'Cinzel\',serif;font-size:8px;letter-spacing:4px;color:'+(_t.isBreakdown?'#8b2635':'#5c3a10')+';text-transform:uppercase;">'+(_t.isBreakdown?'Mandala — Interpretation':'Mandala')+'</div>'+
          '<div style="flex:1;height:1px;background:linear-gradient(90deg,#8b263533,transparent);"></div>'+
          '<div style="font-size:10px;color:#8b263544;">'+(_t.isBreakdown?'⊕':'◈')+'</div>'+
        '</div>'+
        (_t.isBreakdown?alchBadge:'')+
        '<div style="font-family:\'Cormorant Garamond\',serif;font-size:16px;line-height:1.95;color:#3a2810;white-space:pre-wrap;">'+esc(_t.text)+'</div>'+
      '</div>';
    } else {
      return '<div class="you-bubble" style="margin-bottom:20px;">'+
        '<div style="font-family:\'Cinzel\',serif;font-size:8px;letter-spacing:4px;color:#7a6010;margin-bottom:10px;text-transform:uppercase;">The Dreamer</div>'+
        '<div style="font-family:\'Cormorant Garamond\',serif;font-size:15px;line-height:1.85;color:#7a5828;">'+esc(_t.text)+'</div>'+
      '</div>';
    }
  }).join('');

  const loadingBubble = S.loading?'<div class="jung-bubble">'+loadingSpinner()+'</div>':'';

  // Breakdown hint — only after 3+ dreamer replies, so conversation flows freely first
  const breakdownHint = hasConv&&!hasBreakdown&&!S.loading&&dreamerReplies>=3?
    '<div style="margin:16px 0 4px;text-align:center;position:relative;">'+
      leafBorderSVG(145,85,28)+
      '<div style="padding:10px 0;">'+
        '<div style="font-family:\'IM Fell English\',serif;font-size:13px;font-style:italic;color:rgba(90,65,28,0.6);margin-bottom:12px;">Ready to receive the full interpretation?</div>'+
        '<button onclick="requestBreakdown()" style="background:linear-gradient(135deg,#5a0810,#901828);color:#fce8d0;border:1px solid rgba(200,70,50,0.3);font-family:\'Cinzel\',serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;padding:12px 28px;border-radius:1px;box-shadow:0 4px 18px rgba(90,8,16,0.25);">Complete Interpretation →</button>'+
      '</div>'+
      leafBorderSVGBottom(145,85,28)+
    '</div>':''

  // Integrate section flows naturally after breakdown
  const integSection = hasBreakdown&&!S.loading?
    divider('🜂','CALCINATIO')+
    buildIntegInline(dream):
    '';

  return '<div style="max-width:640px;margin:0 auto;padding:28px 28px 80px;">'+
  (function(){var cfg=getEntryConfig(dream);return illuminatedTitle(cfg.descentLabel||'SOLUTIO · CALCINATIO',cfg.descentTitle||'II. Descend',cfg.descentSub||'');})()+
    // Dream echo
    '<div style="background:linear-gradient(145deg,#f0e8d0,#e8dfc0);border:1px solid #c8a86055;border-left:3px solid #c9a84c66;padding:16px 20px;margin-bottom:24px;border-radius:2px;">'+
      '<div style="font-family:\'Cinzel\',serif;font-size:8px;letter-spacing:3px;color:#a8844a;margin-bottom:10px;text-transform:uppercase;color:#8a6830;">The Dream</div>'+
      '<div style="font-family:\'IM Fell English\',serif;font-size:14px;color:#7a5828;line-height:1.85;font-style:italic;">'+esc(dream.stages.journal)+'</div>'+
    '</div>'+
    bubbles+loadingBubble+
    '<div id="chat-bottom"></div>'+

    // First invocation — no conversation yet
    (!hasConv&&!S.loading?
      '<div style="text-align:center;">'+
        '<button class="btn btn-crimson btn-wide" onclick="invokeJung()">Begin the Session</button>'+
      '</div>':'')+

    // ── Reply area — always shown when conversation is active, never removed ──
    (hasConv&&!S.loading?
      divider('◈')+
      '<div class="parchment-panel" style="margin-bottom:12px;">'+
        '<div style="font-family:\'Cinzel\',serif;font-size:8px;letter-spacing:3px;color:#a8844a;margin-bottom:12px;text-transform:uppercase;">Your Reflection</div>'+
        '<textarea id="reply-box" rows="3" '+
          'placeholder="Respond to Jung… what arose? What does that image remind you of?" '+
          'oninput="S.replyText=this.value" '+
          'style="font-size:15px;line-height:1.85;color:#3a2810;background:transparent;border:none;outline:none;width:100%;resize:none;">'+esc(S.replyText)+'</textarea>'+
      '</div>'+
      '<div style="display:flex;gap:10px;margin-bottom:6px;">'+
        '<button onclick="sendReply()" style="flex:2;background:linear-gradient(135deg,#5a0810,#901828);color:#fce8d0;border:1px solid rgba(200,70,50,0.3);font-family:\'Cinzel\',serif;font-size:10px;letter-spacing:4px;padding:14px 20px;border-radius:1px;cursor:pointer;box-shadow:0 4px 16px rgba(90,8,16,0.28);">SEND</button>'+
        buildVoiceBtn()+
      '</div>'+
      '<div style="font-family:\'Cinzel\',serif;font-size:8px;color:#c8a86066;text-align:right;margin-bottom:20px;letter-spacing:2px;">ENTER TO SEND · SHIFT+ENTER FOR LINE BREAK</div>':'')+

    // Breakdown hint — soft suggestion after 3+ replies, sits below reply box
    breakdownHint+

    // Integrate section flows after breakdown — but reply box stays above
    integSection+

    // Gentle transition nudge — only after integration is written
    (hasIntegrate&&!S.loading?
      '<div style="text-align:center;margin-top:8px;padding-top:16px;">'+
        '<button onclick="setStage(\'return\')" style="background:none;border:1px solid rgba(140,105,40,0.2);font-family:\'Cinzel\',serif;font-size:8px;letter-spacing:2px;color:rgba(120,85,38,0.55);cursor:pointer;padding:8px 16px;border-radius:1px;">'+
          'When ready — Enter the Return →'+
        '</button>'+
      '</div>':'')+

  '</div>';
}

function buildArchetypeCard(dream){
  // Derive archetype from dream conversation
  var conv = dream.stages.conversation||[];
  var breakdown = conv.find(function(t){return t.isBreakdown;});
  var text = breakdown ? breakdown.text : (dream.stages.individuate||'');

  // Detect archetype from keywords
  var archetypes = [
    {name:'The Shadow',      glyph:'◐', color:'rgba(60,40,80,0.8)',  bg:'rgba(80,60,100,0.12)', key:['shadow','dark','fear','unknown','hidden']},
    {name:'The Anima',       glyph:'☽', color:'rgba(80,60,140,0.8)', bg:'rgba(100,80,160,0.1)', key:['feminine','anima','woman','mother','goddess']},
    {name:'The Animus',      glyph:'☉', color:'rgba(160,100,30,0.8)',bg:'rgba(180,120,40,0.1)', key:['masculine','animus','man','father','god']},
    {name:'The Self',        glyph:'⊕', color:'rgba(140,100,40,0.8)',bg:'rgba(160,120,50,0.1)', key:['whole','self','mandala','centre','unity','gold']},
    {name:'The Hero',        glyph:'✦', color:'rgba(140,60,30,0.8)', bg:'rgba(160,80,40,0.1)', key:['journey','quest','battle','strength','courage']},
    {name:'The Wise Elder',  glyph:'☿', color:'rgba(60,80,120,0.8)', bg:'rgba(80,100,140,0.1)', key:['wisdom','guide','teacher','elder','sage']},
    {name:'The Trickster',   glyph:'◎', color:'rgba(120,80,30,0.8)', bg:'rgba(140,100,40,0.1)', key:['trickster','fool','chaos','change','unexpected']},
    {name:'Death & Rebirth', glyph:'🌑', color:'rgba(40,40,60,0.8)',  bg:'rgba(60,60,80,0.1)',  key:['death','end','transform','rebirth','new']},
  ];

  var detected = archetypes[3]; // default: The Self
  var lowerText = text.toLowerCase();
  for(var i=0;i<archetypes.length;i++){
    var a = archetypes[i];
    if(a.key.some(function(k){return lowerText.includes(k);})){
      detected = a;
      break;
    }
  }

  return '<div style="display:inline-block;padding:24px 32px;background:'+detected.bg+';border:1px solid '+detected.color.replace('0.8','0.25')+';border-radius:1px;min-width:200px;">'+
    '<div style="font-size:36px;margin-bottom:10px;color:'+detected.color+';">'+detected.glyph+'</div>'+
    '<div style="font-family:\'Cinzel\',serif;font-size:9px;letter-spacing:4px;color:'+detected.color+';text-transform:uppercase;margin-bottom:4px;">Primary Archetype</div>'+
    '<div style="font-family:\'Cinzel Decorative\',serif;font-size:16px;color:'+detected.color.replace('0.8','1')+';letter-spacing:2px;">'+detected.name+'</div>'+
  '</div>';
}

// ── Pattern Intelligence ────────────────────────────────────────────────────
async function analyzePatterns(){
  if(S.dreams.length < 2){
    alert('You need at least 2 completed dream cycles for pattern analysis.');return;
  }
  S.patternsLoading=true;S.showPatterns=true;render();
  try{
    const lang=langInstruction();
    // Build a summary of all dreams for Claude
    const dreamSummaries=S.dreams.map(function(d,i){
      const conv=(d.stages.conversation||[]);
      const breakdown=conv.find(function(_t){return _t.isBreakdown;});
      const jungReplies=conv.filter(function(_t){return _t.role==='jung';});
      return 'Dream '+(i+1)+' ("'+d.title+'", '+d.date+'):\n'+
        'Journal: '+((d.stages.journal||'').slice(0,300))+'\n'+
        (breakdown?'Interpretation: '+breakdown.text.slice(0,400):'No interpretation yet')+'\n'+
        (d.stages.integrate?'Integration: '+d.stages.integrate.slice(0,200):'');
    }).join('\n\n---\n\n');

    const prompt=`You are Carl Jung analyzing a series of dreams from the same dreamer over time. Here are all their dreams in sequence:

${dreamSummaries}

Analyze these dreams as a series — not individually but as a living psychological narrative. Provide:

1. **RECURRING SYMBOLS** — List 3-5 symbols or images that appear across multiple dreams. For each: the symbol, how it has evolved or changed, and what this evolution suggests about the psyche's movement.

2. **ARCHETYPAL THREAD** — The dominant archetype(s) moving through this series (Shadow, Anima/Animus, Self, Trickster, etc.). How is this archetype developing?

3. **THE PSYCHE'S CURRENT** — In 2-3 sentences: what is the unconscious consistently moving toward? What work is being done beneath the surface?

4. **WHAT IS BEING INTEGRATED** — Based on the integration practices chosen, what shadow material is being brought into the body?

5. **SUGGESTED RITUALS** — 2-3 specific ritual suggestions based on the recurring patterns. These should be concrete, embodied practices tied directly to the symbols appearing in the dreams.

6. **THE NEXT DREAM** — What the psyche seems to be preparing to reveal next. Not prediction — but what remains unresolved.

Write as Jung himself, in the intimate tone of Memories Dreams Reflections. This is sacred work.${lang}`;

    S.patterns = await callClaude(JUNG_SYS(),[{role:'user',content:prompt}],1800);
  }catch(e){
    S.patterns='Error: '+e.message;
  }
  S.patternsLoading=false;render();
}

// ══════════════════════════════════════════════════════════════════
// MANDALA SONIC ARCHITECTURE
// Four layers. Used sparingly. Discovered rather than announced.
// ══════════════════════════════════════════════════════════════════
class MandalaAudio {
  constructor(){
    this._ctx = null;
    this._master = null;
    this._drone = null;
    this._droneGain = null;
    this._enabled = true;
    this._initiated = false;
    this._initiationTonePlayed = false;
    this._currentFreq = 136.1;
  }

  _getCtx(){
    if(!this._ctx){
      this._ctx = new (window.AudioContext||window.webkitAudioContext)();
      this._master = this._ctx.createGain();
      this._master.gain.value = 0.06;
      this._master.connect(this._ctx.destination);
    }
    return this._ctx;
  }

  async init(){
    if(this._initiated) return;
    try{
      const ctx = this._getCtx();
      await ctx.resume();
      this._startDrone(136.1);
      this._fadeInDrone(8000);
      this._initiated = true;
    } catch(e){ console.warn('Audio init failed:', e.message); }
  }

  _startDrone(frequency){
    const ctx = this._getCtx();
    const osc = ctx.createOscillator();
    const harmonic = ctx.createOscillator();
    const gainNode = ctx.createGain();
    const harmonicGain = ctx.createGain();
    const filter = ctx.createBiquadFilter();

    osc.type = 'sine';
    osc.frequency.value = frequency;
    harmonic.type = 'sine';
    harmonic.frequency.value = frequency * 2;
    harmonicGain.gain.value = 0.08;
    filter.type = 'lowpass';
    filter.frequency.value = 400;
    filter.Q.value = 0.5;
    gainNode.gain.value = 0;

    osc.connect(filter);
    harmonic.connect(harmonicGain);
    harmonicGain.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(this._master);

    osc.start();
    harmonic.start();

    this._drone = { osc, harmonic, gainNode };
    this._droneGain = gainNode;
    this._currentFreq = frequency;
  }

  _fadeInDrone(durationMs){
    if(!this._drone) return;
    const ctx = this._getCtx();
    const gain = this._droneGain.gain;
    gain.setValueAtTime(0, ctx.currentTime);
    gain.linearRampToValueAtTime(0.04, ctx.currentTime + durationMs/1000);
  }

  updateDroneFrequency(newFreq, durationMs=8000){
    if(!this._drone || !this._enabled) return;
    try{
      const ctx = this._getCtx();
      const t = ctx.currentTime;
      const ramp = durationMs/1000;
      this._drone.osc.frequency.linearRampToValueAtTime(newFreq, t+ramp);
      this._drone.harmonic.frequency.linearRampToValueAtTime(newFreq*2, t+ramp);
      this._currentFreq = newFreq;
    } catch(e){}
  }

  // Layer 2 — The Initiation Tone (once per session)
  playInitiationTone(){
    if(!this._enabled || this._initiationTonePlayed) return;
    try{
      const ctx = this._getCtx();
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();
      // Add slight harmonic overtones for bowl character
      const overtone = ctx.createOscillator();
      const overtoneGain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc.type = 'sine';
      osc.frequency.value = 417;  // Solfeggio — change/transition
      overtone.type = 'sine';
      overtone.frequency.value = 417 * 2.756;  // Inharmonic overtone for bowl quality
      overtoneGain.gain.value = 0.12;
      filter.type = 'lowpass';
      filter.frequency.value = 2000;

      const now = ctx.currentTime;
      gainNode.gain.setValueAtTime(0, now);
      gainNode.gain.linearRampToValueAtTime(0.18, now + 0.4);    // Attack 0.4s
      gainNode.gain.setValueAtTime(0.18, now + 4.4);             // Sustain 4s
      gainNode.gain.linearRampToValueAtTime(0, now + 10.4);      // Decay 6s

      osc.connect(filter);
      overtone.connect(overtoneGain);
      overtoneGain.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(this._master);

      osc.start(now);
      overtone.start(now);
      osc.stop(now + 11);
      overtone.stop(now + 11);

      this._initiationTonePlayed = true;
    } catch(e){ console.warn('Initiation tone failed:', e.message); }
  }

  // Layer 3 — The Oracle Breath (on each Oracle response)
  playOracleBreath(){
    if(!this._enabled) return;
    try{
      const ctx = this._getCtx();
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      // Warm exhale — low-pass filtered, no brightness above 800Hz
      osc.type = 'sine';
      osc.frequency.value = 180;
      filter.type = 'lowpass';
      filter.frequency.value = 800;
      filter.Q.value = 0.3;

      // Add slight noise character via detuned oscillators
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.value = 183;  // Slight detune = warmth
      gain2.gain.value = 0.4;

      const now = ctx.currentTime;
      gainNode.gain.setValueAtTime(0, now);
      gainNode.gain.linearRampToValueAtTime(0.09, now + 0.15);   // Soft attack
      gainNode.gain.linearRampToValueAtTime(0, now + 0.6);       // 0.6s duration

      osc.connect(filter);
      osc2.connect(gain2);
      gain2.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(this._master);

      osc.start(now);
      osc2.start(now);
      osc.stop(now + 0.7);
      osc2.stop(now + 0.7);
    } catch(e){}
  }

  // Layer 4 — The Mandala Pulse (on symbolRecord update / threshold crossing)
  playMandalaPulse(){
    if(!this._enabled) return;
    try{
      const ctx = this._getCtx();
      // Three-tone harmonic cluster
      const freqs = [396, 528, 639];
      freqs.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gainNode = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const now = ctx.currentTime;
        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(0.07, now + 0.2);  // Percussive attack
        gainNode.gain.linearRampToValueAtTime(0, now + 1.2);     // Long resonant decay
        osc.connect(gainNode);
        gainNode.connect(this._master);
        osc.start(now);
        osc.stop(now + 1.3);
      });
    } catch(e){}
  }

  toggle(){
    this._enabled = !this._enabled;
    if(this._droneGain){
      const ctx = this._getCtx();
      const target = this._enabled ? 0.04 : 0;
      this._droneGain.gain.linearRampToValueAtTime(target, ctx.currentTime + 1.5);
    }
    return this._enabled;
  }

  get enabled(){ return this._enabled; }
}
