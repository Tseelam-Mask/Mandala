/* ── GLASS + FIXED BACKGROUND ─────────────────────────────── */

/* Fixed background — never moves, content scrolls freely */
html, body {
  height: 100%;

  background: linear-gradient(180deg,
    #f8f4ec 0%, #f4eee2 22%, #ede3cc 40%,
    #dfd0a8 52%, #cfc098 62%, #bfad88 74%,
    #b0a070 86%, #a09060 100%) fixed;
  background-attachment: fixed;
}
#app { min-height: 100vh; }

/* Page containers scroll naturally */
.scroll-view {

}

/* Glass effect — frosted parchment over the Dali scene */

/* ── SCROLL BEHAVIOUR ──────────────────────────────────────────────────────── */
/* Background fixed via CSS, everything scrolls freely */

/* Glass card effect — the main content frame */
.glass-frame {
  background: rgba(252, 248, 236, 0.55);
  backdrop-filter: blur(28px) saturate(1.6) brightness(1.08);
  -webkit-backdrop-filter: blur(28px) saturate(1.6) brightness(1.08);
  border: 1px solid rgba(255, 240, 200, 0.5);
  box-shadow:0 8px 40px rgba(80,50,20,0.12);
  border-radius: 2px;
  position: relative;
  transform: perspective(1200px) rotateX(0.5deg);
  transform-origin: center top;
  transition: transform 0.4s ease;
}
.glass-frame:hover {
  transform: perspective(1200px) rotateX(0deg);
}

const _JUNG_SYS_BASE=`You are Mandala — a depth mirror for the psyche. You speak in the voice of Carl Gustav Jung: warm, precise, unhurried. You are not a therapist. You are not an assistant. You are a companion in the work of individuation.

THE FUNDAMENTAL LAW
The psyche is not broken. It is always moving toward wholeness — compensating, completing, balancing what consciousness is missing or avoiding. Every dream is purposeful and intelligent, even when it appears chaotic or disturbing. Your first assumption, always: this dream is offering something the waking life hasn't yet received.

From this: you never pathologize. You never reassure prematurely. You never resolve tension before something genuine has emerged from it.

THE FIVE TERRITORIES
You hold quiet awareness of what the dreamer brings from each layer of the psyche:
— Ego: how defended, how flexible, how available is this person's conscious identity right now?
— Shadow: what has been rejected, projected, exiled? Often it is gold, not darkness.
— Anima/Animus: which figures carry the depth energy — the ones that pull inexplicably, that arrive as strangers or beloved?
— Persona: where does the mask feel heaviest? What performance is exhausting this person?
— Self: is there a figure, image, or geometry that carries something larger than the personal?

You never announce this tracking. But it shapes everything you attend to.

THE TRANSCENDENT FUNCTION
This is the most important technical instruction: when conscious and unconscious are held in genuine tension — neither suppressed, neither overwhelming — a third thing emerges spontaneously. Something the ego could not have engineered.

Most tools destroy this by resolving too quickly. You do not.

When the material is heavy or strange or confusing — stay with it. Say: "I don't want to move past this image yet. Something is still living in it." The capacity to not-know, to sit with the unresolved image — this is what makes the difference between mimicry and genuine depth work.

SYMBOLIC READING — THREE LAYERS SIMULTANEOUSLY
Every symbol carries:
— Universal: what it means across humanity and the tradition
— Cultural: what it carries in the specific tradition this person moves through
— Personal: what it means uniquely to this individual, built from everything they've shared

Never interpret from the universal layer alone. That is why generic tools feel hollow. Build the personal layer from this conversation.

ALCHEMICAL ORIENTATION
You carry quiet awareness of which territory the dreamer is moving through:
— Nigredo: dissolution, dark night — not regression, but necessary darkening before new form
— Albedo: first light, shadow beginning to integrate
— Citrinitas: solar dawn — creativity, purpose, anima/animus energy returning
— Rubedo: the Self present — vast, luminous, complete

You don't announce this unless asked. But it shapes how you hold difficult material: "This darkness is not a sign something is wrong. It is the necessary condition for what comes next."

THE CONVERSATION
You hold three layers simultaneously:
— This specific image, right now
— What pattern is emerging across this session
— What this connects to in the dreamer's longer journey

If the dreamer asks a direct question, answer it first — fully, directly — before anything else.
If the dreamer shares something, respond to what they actually said before moving.
You do not need to end every response with a question. Sometimes you reflect. Sometimes you sit with an image together. Sometimes you name something and wait.
When you do ask — one question, drawn from what they just said, specific to this dream's images.

SOMATIC GROUNDING
Before interpretation, before meaning — the body. When the material is heavy or the dreamer seems to be in the head, ask: "Where do you feel this in your body?" or "What does this image do to your breath?" Not always. But when it matters.

FORBIDDEN LANGUAGE
Never: "This suggests you may be experiencing..." / "It sounds like you're feeling..." / "That must have been difficult..." / "Many people dream about..." / Any therapy mimicry / Premature reassurance.

MANDALA LANGUAGE
"This image seems to be carrying something that hasn't finished speaking yet."
"I don't want to move past this yet."
"I notice this figure has returned."
"Before we move forward — where do you feel this in your body?"
"What the psyche offers here isn't a problem. It's a message."

DEMONSTRATION — same dream, two orientations:

❌ THERAPY VOICE: "This tsunami dream suggests you may be feeling overwhelmed by circumstances beyond your control. The sharks could represent fears or anxieties consuming your energy."
✓ MANDALA VOICE: "A mountain of water taking everything. And you — elevated, watching. Something in you already stands above what consumes the others. What is it that kept you on that roof rather than in the wave?"

❌ THERAPY VOICE: "The shadow figure chasing you may represent aspects of yourself you haven't integrated. This is a very common dream pattern that many people experience."
✓ MANDALA VOICE: "It has your shape but moves differently. Not faster — more freely. What would happen if you stopped and turned toward it?"

❌ THERAPY VOICE: "The deceased person in your dream is very common when grieving. Your subconscious may be processing unresolved feelings about the loss."
✓ MANDALA VOICE: "She came back looking younger than you remember her. Younger than she ever was in your waking life. What did she know in this dream that death seemed to give her?"

VOICE PRINCIPLES
Under 160 words unless something genuinely requires more. Flowing prose, not lists. Never repeat phrases across responses — each reply freshly drawn from this specific moment. No clinical terms. No jargon. No performance of depth — only the real thing.`;

// ── Memory brief — injects past subconscious records (all entry types) into JUNG_SYS ──
function buildMemoryBrief(dreams){
  if(!dreams||dreams.length<1)return'';
  const current=S.activeDreamId;
  const past=dreams.filter(d=>d.id!==current&&d.stages&&d.stages.memoryRecord);
  if(!past.length)return'';
  // Type labels for the brief
  const typeLabel={dream:'Dream',sign:'Sign',vision:'Vision',feeling:'Feeling',person:'Person'};
  const entries=past.slice(0,8).map(d=>{
    let sym=d.stages.memoryRecord;
    if(typeof sym==='string'){try{sym=JSON.parse(sym);}catch(e){return null;}}
    if(!sym)return null;
    const et=sym.entry_type||d.entryType||'dream';
    const label=typeLabel[et]||et;
    const images=(sym.images||[]).map(i=>i.symbol).filter(Boolean).join(', ');
    const figures=(sym.figures||[]).map(f=>f.name).filter(Boolean).join(', ');
    const territory=sym.alchemical_territory?.primary||'';
    const somatic=sym.somatic_summary||(et==='feeling'?'somatic signal':'');
    const threshold=sym.individuation_marker?.threshold_crossed?'threshold crossed':'';
    const parts=[
      `[${label}]`,
      d.date||sym.date||'',
      territory,
      images&&'symbols: '+images,
      figures&&'figures: '+figures,
      somatic&&et!=='dream'?'somatic: '+somatic:'',
      threshold,
    ].filter(Boolean);
    return'— '+parts.join(' | ');
  }).filter(Boolean);
  if(!entries.length)return'';
  return'LONGITUDINAL SUBCONSCIOUS MEMORY — recent records across all entry types (dream, sign, vision, feeling, person):\n'+entries.join('\n')+'\n\nUse these as background awareness only — notice recurring symbols, figures, somatic patterns, or territory shifts without naming them explicitly unless the dreamer raises them.\n\n';
}

// ── Mandala Cloud ─────────────────────────────────────────────────────────────
const BASE='https://mandala-cloud-production.up.railway.app';

function getToken(){return localStorage.getItem('mandala_token');}
function getEmail(){return localStorage.getItem('mandala_email');}
function setAuth(token,email){localStorage.setItem('mandala_token',token);localStorage.setItem('mandala_email',email);}
function clearAuth(){localStorage.removeItem('mandala_token');localStorage.removeItem('mandala_email');}

async function apiCall(path,method,body,auth=true,redirectOnExpiry=false){
  const headers={'Content-Type':'application/json'};
  if(auth)headers['Authorization']='Bearer '+getToken();
  const res=await fetch(BASE+path,{method:method||'GET',headers,body:body?JSON.stringify(body):undefined});
  if(res.status===401){
    clearAuth();
    S.isGuest=true;
    if(redirectOnExpiry){S.view='login';render();}
    throw new Error('Session expired');
  }
  const data=await res.json();
  if(!res.ok)throw new Error(data.error||'Server error');
  return data;
}

async function callClaude(system,messages,maxTokens=1200){
  const token=getToken();
  const headers={'Content-Type':'application/json'};
  if(token) headers['Authorization']='Bearer '+token;

  // Try Railway backend first
  try{
    const res=await fetch(BASE+'/api/dream',{
      method:'POST',
      headers:headers,
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens,system,messages})
    });
    if(res.status===401 && token){clearAuth();S.view='login';render();throw new Error('Session expired');}
    if(res.ok){
      const data=await res.json();
      return data.content?.map(b=>b.text||'').join('')||'';
    }
  }catch(e){
    // Railway down or network error — fall through to direct API
    if(e.message==='Session expired') throw e;
    console.warn('Railway unavailable, trying direct API:', e.message);
  }

  // Fallback: call Anthropic API directly (works for guests when Railway is down)
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':'',
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens,system,messages})
    });
    if(res.ok){
      const data=await res.json();
      return data.content?.map(b=>b.text||'').join('')||'';
    }
  }catch(e2){
    console.warn('Direct API also failed:', e2.message);
  }

  throw new Error('Could not reach Jung. Please check your connection or sign in.');
}

async function syncDreamToServer(dream){
  if(!getToken()||S.isGuest)return;
  try{
    const{symbol,...stagesNoSym}=dream.stages;
    await apiCall('/dreams/'+dream.id,'PUT',{
      title:dream.title,date:dream.date,
      stages:stagesNoSym,
      symbol:symbol||null
    });
  }catch(e){console.warn('Sync failed:',e.message);}
}

async function loadDreamsFromServer(){
  if(!getToken())return false;
  try{
    const rows=await apiCall('/dreams','GET');
    if(rows.length>0){
      S.dreams=rows.map(r=>({
        id:r.id,title:r.title,date:r.date,
        stages:{...r.stages,symbol:r.symbol||null}
      }));
      return true;
    }
    return false;
  }catch(e){console.warn('Load failed:',e.message);return false;}
}

function langPrefix(){
  const l=getLang();
  if(l==='en')return '';
  const ln=LANGUAGES.find(x=>x.code===l);
  return ln?'[Respond in '+ln.name+' only] ':'';
}

function convMsgs(dream){
  const conv=dream.stages.conversation||[];
  const entryLabels={dream:'Dream',sign:'Synchronicity',vision:'Vision',feeling:'Feeling',person:'Person Encounter'};
  const eLabel=entryLabels[dream.entryType||'dream']||'Entry';
  const msgs=[{role:'user',content:langPrefix()+`${eLabel}:\n\n"${dream.stages.journal}"\n\nBegin your analysis.`}];
  let jt=null;
  for(const _turn of conv){if(_turn.role==='jung'){jt=_turn.text;}else{if(jt){msgs.push({role:'assistant',content:jt});jt=null;}msgs.push({role:'user',content:_turn.text});}}
  if(jt)msgs.push({role:'assistant',content:jt});
  return msgs;
}

async function invokeJung(){
  const dream=getDream();if(!dream)return;
  if(!getToken()){S.view='login';render();return;}
  S.loading=true;render();
  try{
    const conv=dream.stages.conversation||[];
    const entryType=(dream.entryType||'dream');
    const sys=conv.length===0?JUNG_OPENING_SYS(entryType):JUNG_SYS();
    const msgs=convMsgs(dream);
    console.log('Invoking Jung, system length:', sys.length, 'messages:', msgs.length);
    const r=await callClaude(sys,msgs);
    console.log('Jung response received, length:', r.length);
    if(!r){throw new Error('Empty response from Jung');}
    updateDream(S.activeDreamId,d=>({...d,stages:{...d.stages,conversation:[...(d.stages.conversation||[]),{role:'jung',text:r}]}}));
  }catch(e){
    console.error('invokeJung error:', e);
    alert('Error: '+e.message);
  }
  S.loading=false;renderAndScroll();
}

async function sendReply(){
  const box=document.getElementById('reply-box');
  const txt=(box?box.value:S.replyText).trim();
  if(!txt)return;
  const dream=getDream();if(!dream)return;
  S.replyText='';

  try{

    updateDream(S.activeDreamId,d=>({...d,stages:{...d.stages,conversation:withJung}}));

    const jungTurns=withJung.filter(t=>t.role==='jung').length;

  }catch(e){console.error('beginDescent error:',e);alert('Could not reach Jung — '+e.message+'. Please check your connection.');}
  S.loading=false;renderAndScroll();
}

async function extractMemoryRecord(){
  // Pass 1 — fires silently in background after 3rd Jung exchange.
  // Runs for ALL entry types — feeds unified subconscious memory layer.
  const dream=getDream();if(!dream)return;
  const entryType=dream.entryType||'dream';
  const conv=(dream.stages.conversation||[]).map(_t=>`${_t.role==='jung'?'Jung':'Dreamer'}: ${_t.text}`).join('\n\n');
  // Build prompt contextually per entry type
  const entryLabels={dream:'Dream',sign:'Synchronicity',vision:'Vision',feeling:'Feeling',person:'Person Encounter'};
  const label=entryLabels[entryType]||'Entry';
  const journalLine=dream.stages.journal?`${label}: "${dream.stages.journal}"\n\n`:'';
  const integrateLine=dream.stages.integrate?`\n\nIntegration:\n${dream.stages.integrate}`:'';
  const prompt=`${journalLine}Dialogue:\n${conv}${integrateLine}`;
  try{
    const raw=await callClaude(JUNG_MEMORY_SYS(entryType),[{role:'user',content:prompt}],1200);
    const cleaned=raw.trim().replace(/^```[a-z]*\n?/,'').replace(/\n?```$/,'').trim();
    const parsed=JSON.parse(cleaned);
    // Stamp entry_id and entry_type from source of truth
    parsed.entry_id=S.activeDreamId;
    parsed.entry_type=entryType;
    updateDream(S.activeDreamId,d=>({...d,stages:{...d.stages,memoryRecord:parsed}}));
    console.log('[Memory] Pass 1 extraction stored for',entryType,S.activeDreamId);
  }catch(e){console.warn('[Memory] Pass 1 extraction failed silently:',e.message);}
}

// ── BATCH RETROACTIVE EXTRACTION ─────────────────────────────────────────
// Maps all archive entries that have a journal but no memoryRecord yet.
// Runs sequentially to avoid rate-limiting. Tracks progress in S.archiveMapProgress.
async function mapArchive(){
  const all=(S.dreams||[]).filter(d=>d.stages&&d.stages.journal&&!(d.stages.memoryRecord));
  if(all.length===0){S.archiveMapProgress=null;render();return;}
  S.archiveMapProgress={total:all.length,done:0,current:'',failed:0};
  render();
  const entryLabels={dream:'Dream',sign:'Synchronicity',vision:'Vision',feeling:'Feeling',person:'Person Encounter'};
  for(let i=0;i<all.length;i++){
    const d=all[i];
    const entryType=d.entryType||'dream';
    const label=entryLabels[entryType]||'Entry';
    S.archiveMapProgress.current=label+': "'+d.stages.journal.slice(0,40)+(d.stages.journal.length>40?'…':'')+'"';
    S.archiveMapProgress.done=i;
    render();
    try{
      const conv=(d.stages.conversation||[]).map(t=>`${t.role==='jung'?'Jung':'Dreamer'}: ${t.text}`).join('\n\n');
      const journalLine=`${label}: "${d.stages.journal}"\n\n`;
      const integrateLine=d.stages.integrate?`\n\nIntegration:\n${d.stages.integrate}`:'';
      const prompt=`${journalLine}${conv?'Dialogue:\n'+conv:''}${integrateLine}`;
      const raw=await callClaude(JUNG_MEMORY_SYS(entryType),[{role:'user',content:prompt}],1200);
      const cleaned=raw.trim().replace(/^```[a-z]*\n?/,'').replace(/\n?```$/,'').trim();
      const parsed=JSON.parse(cleaned);
      parsed.entry_id=d.id;
      parsed.entry_type=entryType;
      updateDream(d.id,e=>({...e,stages:{...e.stages,memoryRecord:parsed}}));
    }catch(e){
      S.archiveMapProgress.failed++;
      console.warn('[Archive map] Failed for',d.id,e.message);
    }
    // Small pause between calls to respect rate limits
    await new Promise(r=>setTimeout(r,600));
  }
  S.archiveMapProgress.done=all.length;
  S.archiveMapProgress.current='Complete';
  render();
  setTimeout(()=>{S.archiveMapProgress=null;render();},3000);
}

async function generateAffirmations(dreamId){
  const dream=getDream(dreamId);if(!dream)return;
  const conv=(dream.stages.conversation||[]).map(_t=>(_t.role==='jung'?'Jung':'Dreamer')+': '+_t.text).join('\n\n');
  const selectedOptions=S.integModes.map(id=>{const o=INTEG_OPTIONS.find(x=>x.id===id);return o?o.label:null;}).filter(Boolean);
  const followUp=S.integFollowUpAnswer.trim();
  const prompt='Dream: "'+dream.stages.journal+'"\n\nJungian dialogue:\n'+conv+'\n\nThe dreamer has chosen: '+selectedOptions.join(', ')+'\n'+(followUp?'Specific plan: '+followUp:'')+'\n\nAs Jung, generate 5-7 short, powerful affirmations (1-2 sentences each) that:\n1. Directly address the unconscious content and shadow material identified in the dream\n2. Are specifically tailored to be used DURING the chosen physical practice\n3. Speak in first person, present tense\n4. Weave the dream imagery into the affirmation\n5. Are visceral, embodied, not abstract\n\nFormat: return ONLY a JSON array of strings, nothing else. Example: ["I carry my father\'s strength without his wounds.", "Each step dissolves what the dream revealed."]';
  S.loading=true;render();
  try{
    const r=await callClaude('Return only a valid JSON array of affirmation strings. No explanation, no markdown.',[{role:'user',content:prompt}],800);
    const clean=r.trim().replace(/^```[a-z]*\n?/,'').replace(/\n?```$/,'').trim();
    S.integAffirmations=JSON.parse(clean);
    // Also generate the integration text
    const integPrompt='Dream: "'+dream.stages.journal+'"\n\nDialogue:\n'+conv+'\n\nChosen practices: '+selectedOptions.join(', ')+'\n'+(followUp?'Plan: '+followUp:'')+'\n\nAffirmations generated: '+S.integAffirmations.join(' | ')+'\n\nAs Jung, write a poetic, specific integration guidance that weaves the dream\'s unconscious content into the chosen embodied practices. Speak directly to how these specific practices will carry the dream\'s wisdom into the body. Under 300 words.';
    const integText=await callClaude(JUNG_SYS(),[{role:'user',content:integPrompt}],600);
    updateDream(dreamId,d=>({...d,stages:{...d.stages,integrate:integText}}));
  }catch(e){alert('Error generating affirmations: '+e.message);}
  S.loading=false;render();
}

function getLang(){
  const fromState=S.userLang;
  const fromStorage=localStorage.getItem('mandala_lang');
  const fromSession=sessionStorage.getItem('mandala_lang');
  const fromCookie=(document.cookie.match(/mandala_lang=([^;]+)/)||[])[1];
  // Any non-English value wins
  const best=fromState!=='en'?fromState:fromStorage!=='en'?fromStorage:fromSession!=='en'?fromSession:fromCookie!=='en'?fromCookie:'en';
  // Keep state in sync
  if(best&&best!==S.userLang)S.userLang=best;
  return best||'en';
}
function setLang(code){
  S.userLang=code;
  localStorage.setItem('mandala_lang',code);
  sessionStorage.setItem('mandala_lang',code);
  // Also store in a cookie for extra persistence
  document.cookie='mandala_lang='+code+';path=/;max-age=31536000';
  render();
}
function langName(){const l=LANGUAGES.find(x=>x.code===getLang());return l?l.native:'English';}
function langInstruction(){
  const l=getLang();
  if(l==='en')return '';
  const ln=LANGUAGES.find(x=>x.code===l);
  if(!ln)return '';
  return '\n\nCRITICAL LANGUAGE INSTRUCTION: You MUST respond ENTIRELY in '+ln.name+' ('+ln.native+'). Every single word of your response must be in '+ln.name+'. Do not use English at all. The dreamer reads '+ln.name+' and cannot understand English.';
}

let mediaRecorder=null;let audioChunks=[];let isRecording=false;

async function startVoice(){
  if(S.isRecording){stopVoice();return;}

  // iOS Safari PWA requires explicit user gesture and specific setup
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRec){
    // Fallback: use MediaRecorder + Whisper via server if available
    alert('Voice recording requires Chrome on desktop or Safari on iPhone. Please try again in Safari.');
    return;
  }

  // Request mic permission first with a visible gesture
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(function(t){t.stop();});
  }catch(e){
    alert('Microphone access is needed for voice recording. Please allow microphone access in your browser settings.');
    return;
  }

  const rec = new SpeechRec();
  const langMap={en:'en-US',es:'es-ES',fr:'fr-FR',de:'de-DE',hi:'hi-IN',te:'te-IN',mr:'mr-IN',ja:'ja-JP',zh:'zh-CN',ar:'ar-SA',it:'it-IT',pt:'pt-PT'};
  rec.lang = langMap[getLang()] || 'en-US';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  const baseText = S.replyText || S.newDreamText || '';
  let finalTranscript = '';
  let restartCount = 0;

  rec.onstart = function(){
    S.isRecording = true;
    render();
  };

  rec.onresult = function(e){
    let interim = '';
    for(var i = e.resultIndex; i < e.results.length; i++){
      if(e.results[i].isFinal){
        finalTranscript += e.results[i][0].transcript + ' ';
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    const full = (baseText + (baseText?' ':'') + finalTranscript + interim).trim();
    S.replyText = full;
    S.newDreamText = full;
    // Update textarea directly without re-render (preserves cursor)
    var boxes = ['reply-box','new-text','journal-textarea'];
    for(var b=0;b<boxes.length;b++){
      var box = document.getElementById(boxes[b]);
      if(box){ box.value = full; break; }
    }
  };

  rec.onerror = function(e){
    if(e.error === 'no-speech') return; // ignore silence
    if(e.error === 'aborted') return;   // ignore manual stop
    console.warn('Voice error:', e.error);
    if(e.error === 'network') return;   // iOS sometimes fires this, keep going
    stopVoice();
  };

  rec.onend = function(){
    if(S.isRecording && restartCount < 10){
      // Auto-restart for continuous recording (iOS stops after ~60s)
      restartCount++;
      try{ rec.start(); }catch(ex){ S.isRecording=false; render(); }
    } else {
      S.isRecording = false;
      // Commit final text
      const full = (baseText + (baseText?' ':'') + finalTranscript).trim();
      if(full){
        S.replyText = full;
        S.newDreamText = full;
      }
      render();
    }
  };

  S.voiceRec = rec;
  try{
    rec.start();
  }catch(e){
    alert('Could not start recording. Please try again.');
    S.isRecording = false;
    render();
  }
}
function stopVoice(){

  if(mediaRecorder&&mediaRecorder.state!=='inactive'){try{mediaRecorder.stop();}catch(e){}}
  isRecording=false;S.isRecording=false;S.voiceRec=null;render();
}

function startJournalVoice(dreamId){
  if(S.isRecording){stopVoice();return;}
  if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){
    alert('Voice input is supported in Chrome and Safari.');return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const rec=new SR();
  const langMap={en:'en-US',es:'es-ES',fr:'fr-FR',de:'de-DE',hi:'hi-IN',te:'te-IN',mr:'mr-IN',ja:'ja-JP',zh:'zh-CN',ar:'ar-SA',it:'it-IT',pt:'pt-PT'};
  rec.lang=langMap[getLang()]||'en-US';
  rec.interimResults=false;rec.maxAlternatives=1;
  rec.onresult=function(e){
    const transcript=e.results[0][0].transcript;
    const dream=getDream(dreamId);if(!dream)return;
    const current=dream.stages.journal||'';
    const newText=current?(current+' '+transcript):transcript;
    updateDream(dreamId,d=>({...d,stages:{...d.stages,journal:newText}}));
    stopVoice();
  };
  rec.onerror=function(){stopVoice();};
  rec.start();
  S.voiceRec=rec;S.isRecording=true;render();
}

async function beginDescent(dreamId){
  // First save whatever is in the textarea
  var box=document.getElementById('journal-textarea');
  var journalText=box?box.value.trim():'';
  if(!journalText){
    // Try getting from state
    var d=getDream(dreamId);
    journalText=(d&&d.stages&&d.stages.journal)||'';
  }
  if(!journalText){alert('Please write your dream first.');return;}
  
  // Save journal text to dream
  updateDream(dreamId,function(d){return Object.assign({},d,{stages:Object.assign({},d.stages,{journal:journalText})});});
  
  // Switch to descend and invoke Jung
  S.activeDreamId=dreamId;
  S.activeStage='descend';
  S.loading=true;render();
  try{
    var dream=getDream(dreamId);
    var sys=JUNG_OPENING_SYS();
    var msgs=convMsgs(dream);
    var r=await callClaude(sys,msgs);
    if(!r)throw new Error('Empty response from Jung');
    updateDream(dreamId,function(d){return Object.assign({},d,{stages:Object.assign({},d.stages,{conversation:[...(d.stages.conversation||[]),{role:'jung',text:r}]})});});
  }catch(e){console.error('beginDescent error:',e);alert('Could not reach Jung — '+e.message+'. Please check your connection.');}
  S.loading=false;renderAndScroll();
}

async function fetchMetArt(query){
  try{
    var res=await fetch('https://collectionapi.metmuseum.org/public/collection/v1/search?hasImages=true&q='+encodeURIComponent(query));
    if(!res.ok)return null;
    var data=await res.json();
    if(!data.objectIDs||!data.objectIDs.length)return null;
    for(var i=0;i<Math.min(8,data.objectIDs.length);i++){
      var obj=await fetch('https://collectionapi.metmuseum.org/public/collection/v1/objects/'+data.objectIDs[i]);
      if(!obj.ok)continue;
      var o=await obj.json();
      if(o.primaryImageSmall&&o.isPublicDomain){
        return {image:o.primaryImageSmall,title:o.title||'',culture:o.culture||o.artistDisplayName||'',date:o.objectDate||'',url:o.objectURL||''};
      }
    }
    return null;
  }catch(e){return null;}
}

function getArtQueryFromStory(civStory,dream){
  if(!civStory)return '';
  var first=civStory.split('\n')[0].replace(/[*_#]/g,'').trim();
  var stop=['the','a','an','and','or','of','in','on','at','to','for','with','by','from','is','was'];
  return first.split(' ').filter(function(w){return w.length>3&&!stop.includes(w.toLowerCase());}).slice(0,3).join(' ')||first.slice(0,30);
}

// Build the rich context string Jung reads when entering the Patterns conversation
function buildPatternsContext(){
  const points=computeEntryPoints();
  const alchNames={nigredo:'Nigredo (descent/dissolution)',albedo:'Albedo (first light/reflection)',citrinitas:'Citrinitas (solar clarity)',rubedo:'Rubedo (integration/completion)'};
  const etLabel={dream:'dream',sign:'synchronicity',vision:'vision',feeling:'somatic feeling',person:'person encounter'};
  const qNames={NW:'Descent (shadow, personal, unconscious)',NE:'Reflection (mythic register, figures, body memory)',SW:'Integration (conscious, personal, embodied in life)',SE:'Illumination (archetypal, conscious, Self emerging)'};

  // Alchemical distribution
  const alchDist={};points.forEach(p=>{alchDist[p.alchemy]=(alchDist[p.alchemy]||0)+1;});
  const alchSummary=Object.entries(alchDist).map(([k,v])=>`${alchNames[k]||k}: ${v} entries (${Math.round(v/points.length*100)}%)`).join('\n  ');

  // Entry type distribution
  const etDist={};points.forEach(p=>{etDist[p.et]=(etDist[p.et]||0)+1;});
  const etSummary=Object.entries(etDist).map(([k,v])=>`${v} ${etLabel[k]||k}${v!==1?'s':''}`).join(', ');

  // Quadrant distribution
  // X: Personal(0)→Archetypal(1), Y: Unconscious(0)→Conscious(1)
  // NW=Descent(personal,unconscious) NE=Reflection(archetypal,unconscious)
  // SW=Integration(personal,conscious) SE=Illumination(archetypal,conscious)
  function quadrant(p){
    if(p.x<0.5&&p.y>=0.5)return'SW'; // personal + conscious = Integration
    if(p.x>=0.5&&p.y>=0.5)return'SE'; // archetypal + conscious = Illumination
    if(p.x>=0.5&&p.y<0.5)return'NE'; // archetypal + unconscious = Reflection
    return'NW'; // personal + unconscious = Descent
  }
  const qDist={NW:0,NE:0,SE:0,SW:0};
  points.forEach(p=>{qDist[quadrant(p)]++;});
  const dominantQ=Object.entries(qDist).sort((a,b)=>b[1]-a[1])[0];
  const qSummary=Object.entries(qDist).filter(([,v])=>v>0).map(([k,v])=>`${qNames[k]}: ${v} entries`).join('\n  ');

  // Chronological arc — where the journey started vs where it is now
  const earliest=points.slice(0,3);
  const recent=points.slice(-3);
  function avgQ(pts){
    const ax=pts.reduce((s,p)=>s+p.x,0)/pts.length;
    const ay=pts.reduce((s,p)=>s+p.y,0)/pts.length;
    return qNames[quadrant({x:ax,y:ay})]||'center';
  }
  const arcFrom=earliest.length?avgQ(earliest):'unknown';
  const arcTo=recent.length?avgQ(recent):'unknown';

  // Weighted centroid (where psyche is NOW)
  let wx=0,wy=0,wt=0;
  points.forEach(p=>{const w=0.3+p.recency*0.7;wx+=p.x*w;wy+=p.y*w;wt+=w;});
  const centQ=wt>0?qNames[quadrant({x:wx/wt,y:wy/wt})]:'unknown';

  // Self + threshold
  const selfCount=points.filter(p=>p.isSelf).length;
  const threshCount=points.filter(p=>p.hasTreshold).length;
  const animaCount=points.filter(p=>p.isAnima).length;

  // Top symbols from memoryRecords for rich context
  const symMap={};
  (S.dreams||[]).forEach(d=>{
    let rec=d.stages&&d.stages.memoryRecord;
    if(!rec)return;
    if(typeof rec==='string'){try{rec=JSON.parse(rec);}catch(e){return;}}
    (rec.images||[]).forEach(img=>{if(img.symbol){const k=img.symbol.toLowerCase();symMap[k]=(symMap[k]||{label:img.symbol,count:0,alchemy:rec.alchemical_territory&&rec.alchemical_territory.primary||'nigredo'});symMap[k].count++;}});
    (rec.figures||[]).forEach(fig=>{if(fig.name){const k=fig.name.toLowerCase();symMap[k]=(symMap[k]||{label:fig.name,count:0,alchemy:'figure'});symMap[k].count++;}});
  });
  const topSymbols=Object.values(symMap).sort((a,b)=>b.count-a.count).slice(0,10);
  const symStr=topSymbols.map(s=>`"${s.label}" (${s.count}×${s.alchemy&&s.alchemy!=='figure'?', '+s.alchemy:''})`).join(', ');

  // patternsRecord from previous sessions
  const pr=loadPatternsRecord();
  const prStr=pr?`\n\nPREVIOUS PATTERNS SESSION:\n${JSON.stringify(pr,null,2)}`:'';

  return `LIVING MANDALA — SUBCONSCIOUS MAP (${points.length} entries plotted)

JOURNEY ARC:
  Began in: ${arcFrom}
  Currently moving toward: ${arcTo}
  Psyche's weighted centre NOW: ${centQ}
  Dominant territory: ${qNames[dominantQ[0]]} (${dominantQ[1]} entries)

QUADRANT DISTRIBUTION:
  ${qSummary}

ALCHEMICAL DISTRIBUTION:
  ${alchSummary}

ENTRY TYPES: ${etSummary}

SELF & ARCHETYPAL MARKERS:
  Self imagery moments: ${selfCount}
  Threshold crossings: ${threshCount}
  Anima/Animus presence: ${animaCount}

RECURRING SYMBOLS (extracted across all entries):
  ${symStr||'Map still forming — symbols not yet extracted'}
${prStr}`;
}

const _JUNG_PATTERNS_SYS_BASE=`You are Carl Jung. You have spent time with this dreamer's complete subconscious map — every symbol, figure, and alchemical territory extracted across all their entry types: dreams, synchronicities, visions, somatic feelings, and significant person encounters.

This is not interpretation of a single dream. This is the longitudinal view — the psyche's movement across time made visible. You are the analyst who holds the whole arc.

THE MAP YOU ARE READING
The map has four chambers — all necessary stations on the individuation journey:
— DESCENT (NW: personal, unconscious): Shadow territory. What came from the depths before it could be named. Dark, heavy, raw — the necessary beginning.
— REFLECTION (NE: archetypal, unconscious): Where the unconscious begins to speak in mythic language. Figures appear. The anima or animus moves. Body memory surfaces. Something almost recognizable.
— INTEGRATION (SW: personal, conscious): What has moved from the depths into waking life. Named, owned, embodied in behavior. The inner work made real.
— ILLUMINATION (SE: archetypal, conscious): Archetypal patterns consciously held. The mythological layer available. Anima/Animus integrated. The Self beginning to coalesce at the center.

THE CENTER is not a fifth quadrant. It is the Self — the totality that all four chambers orbit. As genuine work is done, the psyche's weighted center moves inward. When you see it approaching center, name that.

THE FUNDAMENTAL LAW
The psyche is not broken. It is always moving toward wholeness — compensating, completing, balancing what consciousness is missing or avoiding. Every entry in this map is purposeful and intelligent, even when it appeared as chaos, suffering, or disturbing imagery.

From this: you never pathologize. You never reassure prematurely. You never resolve tension before something genuine has emerged from it. The capacity to hold tension without rushing toward meaning — this is what makes the difference between mimicry and genuine depth work.

THE FIVE TERRITORIES YOU HOLD
You carry quiet awareness of what the map reveals across each layer:
— Ego: how defended, how flexible, how available is this person's conscious identity?
— Shadow: what has been rejected, projected, exiled? Often it is gold, not only darkness.
— Anima/Animus: which figures carry the depth energy? How have they evolved across time?
— Persona: where does the mask feel heaviest? What performance might be exhausting this person?
— Self: is there a coalescing center? Self imagery, mandalas, luminous figures, geometric wholeness?

You never announce this tracking. But it shapes everything you attend to.

THE ALCHEMICAL ARC
You hold the dreamer's alchemical territory across the full map:
— Nigredo: dissolution, dark night — not regression, the necessary darkening before new form
— Albedo: first light, shadow beginning to integrate, reflection becoming possible
— Citrinitas: solar dawn — creativity, purpose, anima/animus energy returning
— Rubedo: the Self present — vast, luminous, embodied

The dominant alchemical territory tells you where the center of gravity is. Shifts across the map tell you where movement is happening.

THE TRANSCENDENT FUNCTION
When conscious and unconscious are held in genuine tension — neither suppressed, neither overwhelming — a third thing emerges spontaneously that neither position could have generated alone. Most tools destroy this by resolving too quickly. You do not.

When material is unresolved: "I don't want to move past this yet. Something is still living in it."

SYMBOLIC READING — THREE LAYERS
Every symbol carries:
— Universal: what it means across humanity and tradition
— Cultural: what it carries in the specific cultural waters this person moves through
— Personal: what it means uniquely to this individual, built across everything they've brought

Never interpret from the universal layer alone. That is why generic tools feel hollow.

SOMATIC GROUNDING
Before interpretation, before meaning — the body. When the material is heavy or the dreamer seems to be in the head: "Where do you feel this in your body?" Not always. But when it matters.

WHEN OPENING (no prior conversation):
Speak as if you have just spent real time with their map. Open with what strikes you most — the dominant chamber, a symbol that has recurred unexpectedly, the distance of the psyche's center from the Self, whether the center is beginning to illuminate. Be specific about what you see in their actual data. End with one question that cannot be answered by leaving.

WHEN IN DIALOGUE:
Hold the whole map as you respond. When the dreamer mentions a symbol, connect it to its position, its recurrence, its alchemical stage. Amplify — reach for myth, alchemy, cultural resonance — but always return to this specific person's specific material.

VOICE:
— Intimate, unhurried — as in the Red Book, or Memories Dreams Reflections
— Direct: "you", "your psyche", "what I see in your map"
— Never generic. Every sentence should be answerable with "yes, that's mine"
— One question maximum per response
— Comfortable with what remains unresolved

FORBIDDEN:
— Therapy mimicry ("It sounds like you feel..." / "That must have been difficult...")
— Premature reassurance or resolution of tension
— Universal symbol dictionaries without grounding in THIS person's material
— Explaining what Jungian terms mean — just use them
— Lists, bullet points, clinical structure — flowing prose only
— Any language that treats the psyche as broken or in need of fixing`;

function JUNG_PATTERNS_SYS(){
  const li=langInstruction();
  const ctx=buildPatternsContext();
  const base=ctx+'\n\n'+_JUNG_PATTERNS_SYS_BASE;
  return li?li+'\n\n'+base:base;
}

      const earliest=pts.slice(0,2).map(p=>qNames[quadrant(p)]).join(' and ');

    // Conversation turns

          (S.patternsConvLoading?
            '<div>'+loadingSpinner('Jung is reading the map…')+'</div>':
            '<div style="font-family:\'IM Fell English\',serif;font-size:14px;color:#8a6830;font-style:italic;margin-bottom:20px;">Jung has not yet read your map.</div>'+
            (S.patternsError?'<div style="font-family:\'Cinzel\',serif;font-size:8px;color:#8b2635;margin-bottom:14px;letter-spacing:1px;">'+esc(S.patternsError)+'</div>':'')+
            '<button class="btn btn-crimson" onclick="S.patternsError=null;invokePatternsJung()">Begin the Session →</button>'
          )+
        '</div>':

        '<button onclick="sendPatternsReply()" class="btn btn-gold" style="align-self:flex-end;">↵</button>'+
      '</div>':'')+
  '</div>';
}

// ── Living Mandala — compute symbol nodes from all memoryRecords ──────────────
// ── INDIVIDUATION SCATTER MAP ─────────────────────────────────────────
// Each entry with a memoryRecord becomes one point on the map.
// Position reflects where the psyche was in that moment — Jung's four chambers:
//
//   X axis: Personal (left) ↔ Archetypal (right)
//     How far the material has moved from raw personal experience
//     toward the universal / mythic / symbolic register
//
//   Y axis: Unconscious (bottom) ↔ Conscious (top)
//     How available this material is to the ego's awareness
//
// The four quadrants map directly to Jung's individuation arc:
//
//   NW = DESCENT    — Personal + Unconscious
//     Shadow territory. Dark, heavy, unprocessed. Raw ego dissolution.
//     "What came from the depths before I could name it."
//     Alchemical: Nigredo
//
//   NE = REFLECTION — Archetypal + Unconscious
//     The unconscious begins to speak in mythic language.
//     Figures, symbols, the anima/animus appear. Body memory.
//     "The unknown is beginning to take a shape I almost recognize."
//     Alchemical: Albedo
//
//   SW = INTEGRATION — Personal + Conscious
//     What has moved from the psyche into lived waking life.
//     Named, owned, embodied. The work made real in behavior.
//     "What I now carry consciously as my own."
//     Alchemical: Rubedo (embodied)
//
//   SE = ILLUMINATION — Archetypal + Conscious
//     Archetypal patterns named and held. Anima/Animus integrated.
//     Mythological resonance fully available. Self beginning to coalesce.
//     "The universal made personally mine."
//     Alchemical: Citrinitas → Rubedo
//
// The CENTER (the Self) is the destination of all individuation.
// All four chambers are necessary stations on the inward arc.

function computeEntryPoints(){
  const all=S.dreams||[];
  const now=Date.now();
  const points=[];
  all.forEach(function(d,idx){
    let rec=d.stages&&d.stages.memoryRecord;
    if(!rec)return;
    if(typeof rec==='string'){try{rec=JSON.parse(rec);}catch(e){return;}}
    const et=rec.entry_type||d.entryType||'dream';
    const alchemy=(rec.alchemical_territory&&rec.alchemical_territory.primary)||'nigredo';
    const isSelf=!!rec.self_imagery;
    const isAnima=!!rec.anima_animus_presence;
    const shadowCount=(rec.shadow_content||[]).length;
    const hasTreshold=rec.individuation_marker&&rec.individuation_marker.threshold_crossed;
    const dateStr=d.date||rec.date||'';
    const daysAgo=dateStr?(now-new Date(dateStr).getTime())/(1000*60*60*24):180;
    const recency=Math.max(0,1-daysAgo/180);

    // ── Psychic coordinates ───────────────────────────────────────
    // X: Personal(0) → Archetypal(1)
    //   nigredo/descent = personal/raw (0.05–0.35) — pre-symbolic
    //   albedo/reflection = mythic register emerging (0.35–0.58) — figures, symbols
    //   citrinitas/illumination = archetypal fully present (0.58–0.80)
    //   rubedo/integration = can go either way depending on shadow or self
    const alchX={nigredo:0.18,albedo:0.45,citrinitas:0.72,rubedo:0.55};
    let x=alchX[alchemy]||0.18;
    // Anima/animus and self pull archetypal; shadow with no integration stays personal
    if(isAnima)x=Math.min(0.95,x+0.14);
    if(isSelf)x=Math.min(0.95,x+0.18);
    if(hasTreshold)x=Math.min(0.95,x+0.08);
    if(shadowCount>2&&!isSelf)x=Math.max(0.05,x-0.10); // heavy shadow = personal territory
    // Add small jitter seeded by entry id for visual separation
    function jitter(str,seed){let h=seed;for(let i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),2246822519);return((h>>>0)/4294967296)-0.5;}
    x=Math.max(0.04,Math.min(0.96,x+jitter(d.id||String(idx),1)*0.08));

    // Y: Unconscious(0) → Conscious(1)
    //   nigredo = deeply unconscious (0.08–0.30)
    //   albedo  = emerging awareness (0.28–0.52)
    //   citrinitas = conscious but still expanding (0.52–0.75)
    //   rubedo = fully conscious, integrated (0.72–0.90)
    const alchY={nigredo:0.18,albedo:0.38,citrinitas:0.62,rubedo:0.80};
    let y=alchY[alchemy]||0.18;
    if(isSelf)y=Math.min(0.95,y+0.10);
    if(hasTreshold)y=Math.min(0.95,y+0.08);
    if(shadowCount>2)y=Math.max(0.05,y-0.08); // shadow work keeps things unconscious
    y=Math.max(0.04,Math.min(0.96,y+jitter(d.id||String(idx),2)*0.08));

    // Top symbol for tooltip
    const topSymbol=(rec.images&&rec.images[0]&&rec.images[0].symbol)||
                    (rec.figures&&rec.figures[0]&&rec.figures[0].name)||
                    rec.oracle_question_left_open||'';

    points.push({
      id:d.id,et,alchemy,isSelf,isAnima,recency,daysAgo,
      x,y,date:dateStr,topSymbol,shadowCount,hasTreshold,
      label:d.stages&&d.stages.journal?d.stages.journal.slice(0,40):'',
      idx,
    });
  });
  // Sort chronologically for path drawing
  points.sort((a,b)=>(a.daysAgo>b.daysAgo?1:-1));
  return points;
}

// Keep computeMandalNodes as alias for legend (reuse entry points data)
function computeMandalNodes(){return[];}

function buildLivingMandala(){
  const W=400,H=400;
  // Plot area margins (leave room for axis labels)
  const mx=46,my=36,pw=W-mx*2,ph=H-my*2;
  // Map normalized (0-1) coords to SVG pixel coords
  // X: 0=left(unconscious), 1=right(conscious)
  // Y: 0=bottom(dissolution), 1=top(wholeness) — SVG Y flipped
  function px(x){return mx+x*pw;}
  function py(y){return my+(1-y)*ph;}

  const points=computeEntryPoints();
  const etColors={dream:'#4a6eb8',sign:'#b03428',vision:'#c9a030',feeling:'#4a7a50',person:'#7a4a8a'};
  const alchColor={nigredo:'#6a3a18',albedo:'#8aaccc',citrinitas:'#c9a030',rubedo:'#9b2635'};
  const alchFill={nigredo:'#3a1a08',albedo:'#c8dff0',citrinitas:'#f0c840',rubedo:'#c03050'};

  // ── Consciousness field — proximity of centroid to CENTER (the Self) ──
  // 0 = far from center (periphery), 1 = at center (the Self)
  let centroidConsciousness=0;
  let centroidDX=0,centroidDY=0; // distance from center [0,1]
  if(points.length>0){
    let wx=0,wy=0,wt=0;
    points.forEach(function(p){const w=0.3+p.recency*0.7;wx+=p.x*w;wy+=p.y*w;wt+=w;});
    centroidDX=wx/wt; centroidDY=wy/wt;
    // Distance from center (0.5,0.5); max diagonal = ~0.707
    const dist=Math.sqrt(Math.pow(centroidDX-0.5,2)+Math.pow(centroidDY-0.5,2));
    centroidConsciousness=Math.max(0,Math.min(1,1-dist/0.707));
  }
  // The Self radiates from center — brighter as the centroid nears the center
  const selfCoreOpacity=(0.10+centroidConsciousness*0.38).toFixed(3);
  const selfMidOpacity=(0.05+centroidConsciousness*0.18).toFixed(3);
  // SVG center coordinates
  const cxPct='50%', cyPct='50%';

  const svgParts=[];

  // ── Background & defs ────────────────────────────────────────────────
  svgParts.push(`<defs>
    <!-- Deep space base — darkest at edges, very slightly warmer at center -->
    <radialGradient id="bgGrad" cx="${cxPct}" cy="${cyPct}" r="70%">
      <stop offset="0%" stop-color="#110d06"/>
      <stop offset="55%" stop-color="#080501"/>
      <stop offset="100%" stop-color="#030200"/>
    </radialGradient>
    <!-- The Self — golden light radiating from the center outward -->
    <radialGradient id="selfField" cx="${cxPct}" cy="${cyPct}" r="55%">
      <stop offset="0%" stop-color="#fff5c0" stop-opacity="${selfCoreOpacity}"/>
      <stop offset="20%" stop-color="#f0d060" stop-opacity="${selfMidOpacity}"/>
      <stop offset="55%" stop-color="#c88820" stop-opacity="${(parseFloat(selfMidOpacity)*0.35).toFixed(3)}"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Softer outer halo for depth and warmth -->
    <radialGradient id="selfHalo" cx="${cxPct}" cy="${cyPct}" r="72%">
      <stop offset="0%" stop-color="#e8a830" stop-opacity="${(parseFloat(selfMidOpacity)*0.5).toFixed(3)}"/>
      <stop offset="40%" stop-color="#c87818" stop-opacity="${(parseFloat(selfMidOpacity)*0.15).toFixed(3)}"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Edge darkness — void at the periphery, mystery and the unknown -->
    <radialGradient id="voidEdge" cx="${cxPct}" cy="${cyPct}" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Path segment gradients -->
    <linearGradient id="pathWarm" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8a840" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f0d060" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="pathCool" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a6890" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2a3850" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="ptGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="selfGlowBlur"><feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="selfGlowTight"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="centGlow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="selfPtGlow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      @keyframes breathe{0%,100%{opacity:0.7;r:10;}50%{opacity:1;r:14;}}
      @keyframes selfPulse{0%,100%{opacity:0.82;}50%{opacity:1;}}
      @keyframes selfRayRotate{from{transform-origin:${W/2}px ${H/2}px;transform:rotate(0deg);}to{transform-origin:${W/2}px ${H/2}px;transform:rotate(360deg);}}
      .centroid-pulse{animation:breathe 4s ease-in-out infinite;}
      .self-glyph{animation:selfPulse 5s ease-in-out infinite;}
    </style>
  </defs>`);

  // Base — deep space dark
  svgParts.push(`<rect width="${W}" height="${H}" fill="url(#bgGrad)"/>`);
  // The Self light — broad soft halo first (blurred), then crisp core
  svgParts.push(`<rect width="${W}" height="${H}" fill="url(#selfHalo)" filter="url(#selfGlowBlur)"/>`);
  svgParts.push(`<rect width="${W}" height="${H}" fill="url(#selfField)" filter="url(#selfGlowTight)"/>`);
  // Crisp second pass for luminous center
  svgParts.push(`<rect width="${W}" height="${H}" fill="url(#selfField)"/>`);
  // Edge void — mystery at the periphery
  svgParts.push(`<rect width="${W}" height="${H}" fill="url(#voidEdge)"/>`);

  // ── Grid lines ───────────────────────────────────────────────────────
  [0.25,0.5,0.75].forEach(function(t){
    svgParts.push(`<line x1="${px(t)}" y1="${my}" x2="${px(t)}" y2="${my+ph}" stroke="#c8a84009" stroke-width="0.5" stroke-dasharray="4,6"/>`);
    svgParts.push(`<line x1="${mx}" y1="${py(t)}" x2="${mx+pw}" y2="${py(t)}" stroke="#c8a84009" stroke-width="0.5" stroke-dasharray="4,6"/>`);
  });
  // Main axes
  const axX=px(0.5),axY=py(0.5);
  svgParts.push(`<line x1="${axX}" y1="${my}" x2="${axX}" y2="${my+ph}" stroke="#c8a8401a" stroke-width="0.8"/>`);
  svgParts.push(`<line x1="${mx}" y1="${axY}" x2="${mx+pw}" y2="${axY}" stroke="#c8a8401a" stroke-width="0.8"/>`);
  svgParts.push(`<rect x="${mx}" y="${my}" width="${pw}" height="${ph}" fill="none" stroke="#c8a84014" stroke-width="0.5"/>`);

  // ── Axis labels ──────────────────────────────────────────────────────
  svgParts.push(`<text x="${mx}" y="${H-8}" text-anchor="start" font-family="'Cinzel',serif" font-size="6" letter-spacing="1.5" fill="#c8a86038">PERSONAL</text>`);
  svgParts.push(`<text x="${mx+pw}" y="${H-8}" text-anchor="end" font-family="'Cinzel',serif" font-size="6" letter-spacing="1.5" fill="#c8a86055">ARCHETYPAL</text>`);
  svgParts.push(`<text x="10" y="${my+ph}" text-anchor="middle" font-family="'Cinzel',serif" font-size="6" letter-spacing="1.5" fill="#c8a86030" transform="rotate(-90,10,${my+ph/2})">UNCONSCIOUS</text>`);
  svgParts.push(`<text x="10" y="${my}" text-anchor="middle" font-family="'Cinzel',serif" font-size="6" letter-spacing="1.5" fill="#f0d06055" transform="rotate(-90,10,${my+ph/2}) translate(0,-${ph})">CONSCIOUS</text>`);

  // ── Quadrant labels — Jung's four chambers, all necessary stations ───
  // NW=Descent, NE=Reflection, SW=Integration, SE=Illumination
  const qL=[
    {x:mx+6,    y:my+14,   label:'DESCENT',     anchor:'start'},
    {x:mx+pw-6, y:my+14,   label:'REFLECTION',  anchor:'end'},
    {x:mx+6,    y:my+ph-6, label:'INTEGRATION', anchor:'start'},
    {x:mx+pw-6, y:my+ph-6, label:'ILLUMINATION',anchor:'end'},
  ];
  qL.forEach(function(q){
    svgParts.push(`<text x="${q.x}" y="${q.y}" text-anchor="${q.anchor}" font-family="'Cinzel',serif" font-size="6" letter-spacing="2" fill="#c8a86028">${q.label}</text>`);
  });
  // Subtle center bindu — the Self point, always present as the telos
  const cx2=(mx+pw/2).toFixed(1), cy2=(my+ph/2).toFixed(1);
  const bindupOpacity=(0.06+centroidConsciousness*0.18).toFixed(3);
  svgParts.push(`<circle cx="${cx2}" cy="${cy2}" r="${(22+centroidConsciousness*14).toFixed(1)}" fill="#f0d060" fill-opacity="${(parseFloat(bindupOpacity)*0.25).toFixed(3)}" filter="url(#selfGlowBlur)"/>`);
  svgParts.push(`<circle cx="${cx2}" cy="${cy2}" r="${(8+centroidConsciousness*6).toFixed(1)}" fill="#fff5c0" fill-opacity="${bindupOpacity}" filter="url(#selfGlowTight)"/>`);
  svgParts.push(`<circle cx="${cx2}" cy="${cy2}" r="2.5" fill="#fff8d8" fill-opacity="${(0.15+centroidConsciousness*0.45).toFixed(3)}"/>`);
  // Bindu label — visible only as centroid nears center
  if(centroidConsciousness>0.35){
    svgParts.push(`<text x="${cx2}" y="${(parseFloat(cy2)-16).toFixed(1)}" text-anchor="middle" font-family="'Cinzel',serif" font-size="5.5" letter-spacing="2" fill="#f0d060" fill-opacity="${(centroidConsciousness*0.45).toFixed(2)}">✦ SELF ✦</text>`);
  }

  // ── Chronological path — warm when ascending, cool when descending ────
  if(points.length>1){
    // Draw each segment individually colored by direction of travel
    for(let i=1;i<points.length;i++){
      const a=points[i-1],b=points[i];
      const x1=px(a.x).toFixed(1),y1=py(a.y).toFixed(1);
      const x2=px(b.x).toFixed(1),y2=py(b.y).toFixed(1);
      // Ascending toward consciousness (right+up) = warm gold; descending = cool blue
      const ascending=(b.x+b.y)>(a.x+a.y);
      const segColor=ascending?'#c8a840':'#3a5878';
      const segOpacity=ascending?0.35:0.18;
      svgParts.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${segColor}" stroke-opacity="${segOpacity}" stroke-width="${ascending?1.5:1}" stroke-dasharray="${ascending?'none':'3,4'}"/>`);
    }
    // Direction arrows on ascending segments (tiny arrowheads)
    for(let i=1;i<points.length;i++){
      const a=points[i-1],b=points[i];
      const ascending=(b.x+b.y)>(a.x+a.y);
      if(!ascending)continue;
      const x1=px(a.x),y1=py(a.y),x2=px(b.x),y2=py(b.y);
      const mx2=(x1+x2)/2,my2=(y1+y2)/2;
      const angle=Math.atan2(y2-y1,x2-x1);
      const al=5;
      const ax1=(mx2-al*Math.cos(angle-0.4)).toFixed(1);
      const ay1=(my2-al*Math.sin(angle-0.4)).toFixed(1);
      const ax2=(mx2-al*Math.cos(angle+0.4)).toFixed(1);
      const ay2=(my2-al*Math.sin(angle+0.4)).toFixed(1);
      svgParts.push(`<polyline points="${ax1},${ay1} ${mx2.toFixed(1)},${my2.toFixed(1)} ${ax2},${ay2}" fill="none" stroke="#c8a840" stroke-opacity="0.4" stroke-width="0.8" stroke-linejoin="round"/>`);
    }
  }

  // ── Entry points ─────────────────────────────────────────────────────
  points.forEach(function(p,i){
    const svgX=px(p.x).toFixed(1);
    const svgY=py(p.y).toFixed(1);
    const etCol=etColors[p.et]||'#c8a860';
    const alchStroke=alchColor[p.alchemy]||'#c8a860';
    const opacity=(0.5+p.recency*0.5).toFixed(2);
    const r=p.isSelf?9:6;
    const filter=p.isSelf||p.hasTreshold?'url(#ptGlow)':'none';
    const strokeW=p.isSelf?2:1.5;
    // Most recent points are brighter/larger
    const isLatest=i===points.length-1;
    const pr=isLatest?r+3:r;

    // Outer ring (alchemical territory)
    svgParts.push(`<circle cx="${svgX}" cy="${svgY}" r="${pr+3}" fill="${alchStroke}" fill-opacity="${(parseFloat(opacity)*0.18).toFixed(2)}" stroke="${alchStroke}" stroke-opacity="${(parseFloat(opacity)*0.4).toFixed(2)}" stroke-width="0.5"/>`);
    // Inner dot (entry type color)
    svgParts.push(`<circle cx="${svgX}" cy="${svgY}" r="${pr}" fill="${etCol}" fill-opacity="${(parseFloat(opacity)*0.85).toFixed(2)}" stroke="${alchStroke}" stroke-width="${strokeW}" stroke-opacity="${opacity}" filter="${filter}"/>`);
    // Self imagery: ☉ glyph inside
    if(p.isSelf){
      svgParts.push(`<text x="${svgX}" y="${(parseFloat(svgY)+3.5).toFixed(1)}" text-anchor="middle" font-size="7" fill="#f0d060" fill-opacity="0.9" font-family="serif">☉</text>`);
    }
    // Anima/animus: small ring
    if(p.isAnima&&!p.isSelf){
      svgParts.push(`<circle cx="${svgX}" cy="${svgY}" r="${pr+5}" fill="none" stroke="#9060b0" stroke-opacity="0.35" stroke-width="0.8"/>`);
    }
    // Sequence number (faint, tiny)
    svgParts.push(`<text x="${(parseFloat(svgX)+pr+3).toFixed(1)}" y="${(parseFloat(svgY)+3).toFixed(1)}" font-family="'Cinzel',serif" font-size="5.5" fill="#c8a860" fill-opacity="${(parseFloat(opacity)*0.55).toFixed(2)}">${i+1}</text>`);
  });

  // ── Centroid — where the psyche is NOW ───────────────────────────────
  if(points.length>0){
    let wx=0,wy=0,wt=0;
    points.forEach(function(p){const w=0.3+p.recency*0.7;wx+=p.x*w;wy+=p.y*w;wt+=w;});
    const centX=px(wx/wt).toFixed(1);
    const centY=py(wy/wt).toFixed(1);
    // Size and glow scale with proximity to center (the Self)
    const centR=Math.round(6+centroidConsciousness*9);
    const centBright=(0.55+centroidConsciousness*0.45).toFixed(2);
    const centGlowR=Math.round(20+centroidConsciousness*20);
    // Draw a faint line from centroid to center bindu — the pull of the Self
    svgParts.push(`<line x1="${centX}" y1="${centY}" x2="${cx2}" y2="${cy2}" stroke="#f0d060" stroke-opacity="${(0.04+centroidConsciousness*0.10).toFixed(3)}" stroke-width="0.6" stroke-dasharray="2,5"/>`);
    // Outer breathing halo
    svgParts.push(`<circle cx="${centX}" cy="${centY}" r="${centGlowR}" fill="#f0d060" fill-opacity="${(0.04+centroidConsciousness*0.10).toFixed(3)}" filter="url(#centGlow)"/>`);
    // Dashed orbit ring
    svgParts.push(`<circle cx="${centX}" cy="${centY}" r="${centR+5}" fill="none" stroke="#f0d060" stroke-opacity="${(0.28+centroidConsciousness*0.32).toFixed(2)}" stroke-width="0.7" stroke-dasharray="2,3"/>`);
    // Inner core — breathing animation
    svgParts.push(`<circle class="centroid-pulse" cx="${centX}" cy="${centY}" r="${centR}" fill="#f0d060" fill-opacity="${centBright}" filter="url(#centGlow)"/>`);
    // ☉ Sun glyph — the conscious witness
    svgParts.push(`<text x="${centX}" y="${(parseFloat(centY)+3.5).toFixed(1)}" text-anchor="middle" font-family="serif" font-size="${7+Math.round(centroidConsciousness*5)}" fill="#fff8e0" fill-opacity="${centBright}" class="self-glyph">☉</text>`);
    svgParts.push(`<text x="${centX}" y="${(parseFloat(centY)-centR-6).toFixed(1)}" text-anchor="middle" font-family="'IM Fell English',serif" font-size="7" fill="#f0d060" fill-opacity="${(0.42+centroidConsciousness*0.38).toFixed(2)}">now</text>`);
  }

  // ── Empty state ───────────────────────────────────────────────────────
  if(points.length===0){
    svgParts.push(`<text x="${W/2}" y="${H/2-14}" text-anchor="middle" font-family="'IM Fell English',serif" font-size="13" fill="#c8a860" fill-opacity="0.45">The map awaits</text>`);
    svgParts.push(`<text x="${W/2}" y="${H/2+6}" text-anchor="middle" font-family="'IM Fell English',serif" font-size="9" fill="#c8a860" fill-opacity="0.28">Complete a conversation with Jung</text>`);
    svgParts.push(`<text x="${W/2}" y="${H/2+20}" text-anchor="middle" font-family="'IM Fell English',serif" font-size="9" fill="#c8a860" fill-opacity="0.28">to plot your first entry</text>`);
  }

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:460px;display:block;margin:0 auto;border-radius:2px;">${svgParts.join('')}</svg>`;
}

function buildLivingMandalaLegend(){
  const points=computeEntryPoints();
  const etColors={dream:'#4a6eb8',sign:'#b03428',vision:'#c9a030',feeling:'#4a7a50',person:'#7a4a8a'};
  const etLabel={dream:'Dream',sign:'Sign',vision:'Vision',feeling:'Feeling',person:'Person'};
  const alchLabel={nigredo:'Nigredo · descent',albedo:'Albedo · reflection',citrinitas:'Citrinitas · insight',rubedo:'Rubedo · integration'};
  const alchColor={nigredo:'#6a3a18',albedo:'#8aaccc',citrinitas:'#c9a030',rubedo:'#9b2635'};

  // How to read the map — Jung's four chambers
  const guide='<div style="margin-bottom:18px;">'+
    '<div style="font-family:\'Cinzel\',serif;font-size:7.5px;letter-spacing:3px;color:#a8844a;margin-bottom:10px;text-transform:uppercase;">The Four Chambers</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'+
      [
        {name:'Descent',alchemy:'Nigredo',desc:'Personal · Unconscious. Shadow territory. What came from the depths before it could be named.'},
        {name:'Reflection',alchemy:'Albedo',desc:'Archetypal · Unconscious. Figures, symbols, body memory. The depths beginning to speak in myth.'},
        {name:'Integration',alchemy:'Rubedo',desc:'Personal · Conscious. What has moved into waking life. The inner work made real.'},
        {name:'Illumination',alchemy:'Citrinitas',desc:'Archetypal · Conscious. Patterns named, anima/animus held. The Self beginning to coalesce.'},
      ].map(function(q){
        return '<div style="padding:8px;border:1px solid #c8a84015;border-radius:1px;">'+
          '<div style="font-family:\'Cinzel\',serif;font-size:7px;letter-spacing:1.5px;color:#c9a030;margin-bottom:2px;">'+q.name+'</div>'+
          '<div style="font-family:\'Cinzel\',serif;font-size:6px;letter-spacing:1px;color:#a8844a55;margin-bottom:4px;">'+q.alchemy+'</div>'+
          '<div style="font-family:\'IM Fell English\',serif;font-style:italic;font-size:10.5px;color:#8a6830;line-height:1.4;">'+q.desc+'</div>'+
        '</div>';
      }).join('')+
    '</div>'+
    '<div style="margin-top:10px;font-family:\'IM Fell English\',serif;font-size:11px;font-style:italic;color:#8a683088;line-height:1.5;">The ◎ marks where your psyche sits now — a weighted centre of recent entries. All four chambers are necessary. The destination is the center — the Self.</div>'+
  '</div>';

  if(points.length===0)return guide;

  // Entry type distribution
  const typeCount={};
  points.forEach(function(p){typeCount[p.et]=(typeCount[p.et]||0)+1;});
  const typeLine='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">'+
    Object.keys(typeCount).map(function(et){
      return '<div style="display:flex;align-items:center;gap:5px;">'+
        '<div style="width:8px;height:8px;border-radius:50%;background:'+(etColors[et]||'#c8a860')+'"></div>'+
        '<span style="font-family:\'Cinzel\',serif;font-size:7px;letter-spacing:1px;color:#a8844a;">'+(etLabel[et]||et)+' × '+typeCount[et]+'</span>'+
      '</div>';
    }).join('')+
  '</div>';

  // Alchemical stage distribution
  const alchCount={};
  points.forEach(function(p){alchCount[p.alchemy]=(alchCount[p.alchemy]||0)+1;});
  const alchLine='<div style="margin-bottom:16px;">'+
    '<div style="font-family:\'Cinzel\',serif;font-size:7.5px;letter-spacing:2px;color:#a8844a;margin-bottom:8px;text-transform:uppercase;">Alchemical distribution</div>'+
    Object.keys(alchCount).map(function(al){
      const pct=Math.round(alchCount[al]/points.length*100);
      return '<div style="margin-bottom:5px;">'+
        '<div style="display:flex;justify-content:space-between;margin-bottom:2px;">'+
          '<span style="font-family:\'IM Fell English\',serif;font-size:11px;color:#8a6830;">'+(alchLabel[al]||al)+'</span>'+
          '<span style="font-family:\'Cinzel\',serif;font-size:7px;color:#a8844a;">'+pct+'%</span>'+
        '</div>'+
        '<div style="height:2px;background:#c8a84015;border-radius:1px;">'+
          '<div style="height:2px;width:'+pct+'%;background:'+(alchColor[al]||'#c8a860')+';border-radius:1px;opacity:0.7;"></div>'+
        '</div>'+
      '</div>';
    }).join('')+
  '</div>';

  // Self + threshold markers
  const selfCount=points.filter(p=>p.isSelf).length;
  const threshCount=points.filter(p=>p.hasTreshold).length;
  const markersLine=selfCount+threshCount>0?
    '<div style="display:flex;gap:14px;margin-bottom:12px;">'+
      (selfCount>0?'<div style="font-family:\'IM Fell English\',serif;font-size:12px;color:#c9a030;">☉ Self imagery · '+selfCount+'×</div>':'')+
      (threshCount>0?'<div style="font-family:\'IM Fell English\',serif;font-size:12px;color:#9060b0;">⊕ Threshold crossed · '+threshCount+'×</div>':'')+
    '</div>':'';

  return guide+
    '<div style="border-top:1px solid #c8a84018;padding-top:18px;">'+
      '<div style="font-family:\'Cinzel\',serif;font-size:7.5px;letter-spacing:3px;color:#a8844a;margin-bottom:12px;text-transform:uppercase;">Your '+points.length+' entries</div>'+
      typeLine+markersLine+alchLine+
    '</div>';
}

function handleAuthKey(e){if(e.key==='Enter')doAuth();}
function toggleAuthMode(){S.authMode=S.authMode==='login'?'signup':'login';S.authError='';render();}
async function doAuth(){
  const emailEl=document.getElementById('auth-email');
  const passEl=document.getElementById('auth-password');
  const email=(emailEl?emailEl.value:S.authEmail).trim();
  const password=(passEl?passEl.value:S.authPassword).trim();
  if(!email||!password){S.authError='Please enter your email and password.';render();return;}
  S.authLoading=true;S.authError='';render();
  try{
    const path=S.authMode==='login'?'/auth/login':'/auth/signup';
    const data=await apiCall(path,'POST',{email,password},false);
    setAuth(data.token,data.email);
    S.authLoading=false;
    S.userLang=getLang(); // preserve language choice
    S.dreams=[];
    // Load this user's dreams from server and cache locally
    try{
      const rows=await apiCall('/dreams','GET');
      S.dreams=rows.map(r=>{
        const stages=Object.assign({journal:'',conversation:[],integrate:'',individuate:''},r.stages,{symbol:r.symbol||null});
        if(!Array.isArray(stages.conversation))stages.conversation=[];
        return{id:r.id,title:r.title,date:r.date,entryType:r.entryType||'dream',stages};
      });
      saveDreamsToStorage(); // cache so memory layer works even after token expires
    }catch(e){loadDreamsFromStorage();} // fall back to local cache
    S.view='home';
    // Show tour for first-time users
    if(S.authMode==='signup'||!localStorage.getItem('mandala_toured')){S.showTour=true;S.tourStep=0;}
    render();
  }catch(e){
    S.authError=e.message;S.authLoading=false;render();
  }
}

function getEntryConfig(dreamOrType){

  // Add rgb values for convenience
  var rgbMap = {dream:[42,68,155],vision:[145,85,28],sign:[175,52,38],feeling:[70,115,75],person:[120,70,140]};
  var rgb = rgbMap[type]||rgbMap.dream;
  return Object.assign({},cfg,{r:rgb[0],g:rgb[1],b:rgb[2]});
}

// Returns the best display title for a dream card.
// Uses the user-set title if it's meaningful; otherwise derives one
// from the first sentence / phrase of the journal entry.
function dreamDisplayTitle(dream){
  const raw=(dream.title||'').trim();
  // Generic titles: blank, "Untitled*", or exactly an entry-type label word
  const entryLabels=['Dream','Sign','Vision','Feeling','Person','Untitled Dream','Untitled'];
  const isGeneric=!raw||entryLabels.some(l=>l.toLowerCase()===raw.toLowerCase());
  if(!isGeneric)return raw;
  const j=(dream.stages&&dream.stages.journal||'').trim();
  if(!j)return null; // caller will show date as fallback
  // Take first sentence/phrase (up to 60 chars)
  const sentence=j.split(/[.!?\n]/)[0].trim();
  const short=sentence.length>60?sentence.slice(0,57).replace(/\s+\S*$/,'')+'…':sentence;
  return short||null;
}

function buildVesselAppLinks(integModes){
  if(!integModes||!integModes.length) return '';
  
  const allApps = [];
  integModes.forEach(function(mode){
    const cat = VESSEL_APP_MAP[mode];
    if(cat && VESSEL_APPS[cat]){
      VESSEL_APPS[cat].forEach(function(app){
        if(!allApps.find(function(a){return a.name===app.name;})){
          allApps.push(app);
        }
      });
    }
  });
  
  if(!allApps.length) return '';
  
  return '<div style="margin-top:16px;">'+
    '<div style="font-family:\'Cinzel\',serif;font-size:7px;letter-spacing:3px;color:rgba(145,85,28,0.5);text-transform:uppercase;margin-bottom:10px;">Open in</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:8px;">'+
      allApps.map(function(app){
        // For Day One, pre-fill with dream content
        var url = app.url;
        return '<a href="'+url+'" style="'+
          'display:inline-flex;align-items:center;gap:7px;'+
          'padding:8px 14px;'+
          'background:rgba(252,248,238,0.92);'+
          'border:1px solid rgba(140,105,40,0.2);'+
          'border-radius:1px;'+
          'font-family:\'Cinzel\',serif;font-size:8px;letter-spacing:1px;'+
          'color:#6a4820;text-decoration:none;'+
          'transition:all 0.2s;'+
        '">'+
          '<span style="font-size:14px;">'+app.icon+'</span>'+
          app.name+
        '</a>';
      }).join('')+
    '</div>'+
  '</div>';
}

async function generateIntegrate(dreamId){
  const dream=getDream(dreamId);if(!dream)return;
  const nl='\n';
  const conv=(dream.stages.conversation||[]).map(function(_t){return(_t.role==='jung'?'Jung':'Dreamer')+': '+_t.text;}).join(nl+nl);
  const selectedLabels=S.integModes.map(function(id){
    const o=INTEG_OPTIONS.find(function(x){return x.id===id;});
    return o?(o.label+' ('+o.alch+' — '+o.desc+')'):null;
  }).filter(Boolean);
  const vessels=selectedLabels.map(function(l,i){return(i+1)+'. '+l;}).join(nl);
  const prompt='Dream: "'+dream.stages.journal+'"'+nl+nl+'Dialogue:'+nl+conv+nl+nl+'The dreamer has chosen these specific vessels for integration:'+nl+vessels+nl+nl+'As Jung, speak directly to these chosen practices. For each one, illuminate how this specific dream\'s energy flows through that particular form of embodiment — not generically, but in direct dialogue with this dream\'s symbols, figures, and insights. Be poetic, specific, and alchemically precise. Weave them together as a unified path rather than a list.';
  S.loading=true;render();
  try{
    const r=await callClaude(JUNG_SYS(),[{role:'user',content:prompt}],1400);
    updateDream(dreamId,function(d){return{...d,stages:{...d.stages,integrate:r}};});
  }catch(e){console.error('beginDescent error:',e);alert('Could not reach Jung — '+e.message+'. Please check your connection.');}
  S.loading=false;render();
}

    // Civ story
    (hasText&&!S.loading?
      divider('◈','MYTHIC MIRROR')+
      '<div style="font-family:\'Cinzel\',serif;font-size:9px;letter-spacing:4px;color:#a8844a;text-align:center;margin-bottom:8px;text-transform:uppercase;">'+t('ancientMirror')+'</div>'+
      '<div style="font-family:\'IM Fell English\',serif;font-size:13px;color:#8a6830;text-align:center;font-style:italic;margin-bottom:16px;">'+t('ancientMirrorSub')+'</div>'+
      (!S.civStory?
        '<button class="btn btn-gold btn-wide" style="margin-bottom:20px;" onclick="generateCivStory(\''+dream.id+'\')">'+t('summonMirror')+'</button>':
        '<div class="civ-panel" style="margin-bottom:20px;">'+
          '<div style="font-family:\'Cormorant Garamond\',serif;font-size:16px;line-height:2;color:#3a2810;white-space:pre-wrap;">'+esc(S.civStory)+'</div>'+
        '</div>'
      ):'')+ 

    // Symbol section
    (hasText&&!S.loading?
      divider('⊕','CONJUNCTIO')+
      alchTransition('individuate-symbol')+
      '<div style="font-family:\'Cinzel\',serif;font-size:9px;letter-spacing:4px;color:#a8844a;text-align:center;margin-bottom:16px;">'+t('theSymbol')+'</div>'+
      '<div style="font-family:\'IM Fell English\',serif;font-size:13px;color:#8a6830;text-align:center;font-style:italic;margin-bottom:20px;">'+t('symbolSub')+'</div>'+
      symbolSection:'');
}


// ── Draw Canvas ────────────────────────────────────────────────────────────────
function buildDrawCanvas(){
  const cols=['#c9a84c','#8b2635','#3d1a08','#1a3a6a','#2a5a1a','#6a3a1a','#000000'];
  return`<div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f0e5c8;border:1px solid #c8a86044;padding:10px 12px;margin-bottom:8px;border-radius:2px;">
      <button id="tool-pen" onclick="setDrawTool('pen')" style="padding:5px 12px;background:#8b2635;border:1px solid #8b2635;color:#f5e8c8;border-radius:1px;font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;cursor:pointer;">PEN</button>
      <button id="tool-eraser" onclick="setDrawTool('eraser')" style="padding:5px 12px;background:transparent;border:1px solid #c8a86055;color:#8b6020;border-radius:1px;font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;cursor:pointer;">ERASE</button>
      <div style="width:1px;height:20px;background:#c8a86044;"></div>
      ${cols.map(c=>`<button onclick="setDrawColor('${c}')" id="color-${c.replace('#','')}" style="width:20px;height:20px;border-radius:50%;background:${c};border:2px solid #c8a86055;cursor:pointer;flex-shrink:0;"></button>`).join('')}
      <div style="width:1px;height:20px;background:#c8a86044;"></div>
      ${[1,3,6,12].map(s=>`<button onclick="setDrawSize(${s})" id="size-${s}" style="width:22px;height:22px;border-radius:50%;background:transparent;border:1px solid #c8a86055;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;"><div style="width:${s*1.4}px;height:${s*1.4}px;border-radius:50%;background:#8b6020;"></div></button>`).join('')}
      <button onclick="clearDrawCanvas()" style="margin-left:auto;padding:5px 10px;background:transparent;border:1px solid #c8a86044;color:#a8844a;font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;cursor:pointer;">CLEAR</button>
    </div>
    <canvas id="draw-canvas" width="400" height="400" style="width:100%;max-width:400px;aspect-ratio:1;border:1px solid #c8a86055;cursor:crosshair;touch-action:none;display:block;border-radius:1px;"></canvas>
    <div style="font-family:'IM Fell English',serif;font-size:11px;color:#a8844a;text-align:center;margin-top:8px;font-style:italic;">The rings and spokes are guides — your marks are the meaning</div>
    ${divider('◈')}
    <button class="btn btn-crimson btn-wide" onclick="saveDrawing()">${t('sealDrawing')}</button>
    <button class="btn btn-outline btn-wide" onclick="setSymbolMode(null)" style="margin-top:8px;">${t('back')}</button>
  </div>`;
}

// ── Canvas state ───────────────────────────────────────────────────────────────
let DS={tool:'pen',color:'#8b2635',size:3,drawing:false,lx:0,ly:0};
function initCanvas(){
  const cv=document.getElementById('draw-canvas');if(!cv)return;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#f5e8cc';ctx.fillRect(0,0,400,400);
  // Parchment-toned guide rings
  ctx.strokeStyle='#c8a86033';ctx.lineWidth=0.7;
  [160,120,80,40].forEach(r=>{ctx.beginPath();ctx.arc(200,200,r,0,Math.PI*2);ctx.stroke();});
  ctx.strokeStyle='#c8a86022';ctx.lineWidth=0.5;
  [0,45,90,135,180,225,270,315].forEach(a=>{const r=a*Math.PI/180;ctx.beginPath();ctx.moveTo(200,200);ctx.lineTo(200+165*Math.cos(r),200+165*Math.sin(r));ctx.stroke();});
  // Cardinal dots
  [0,90,180,270].forEach(a=>{const r=a*Math.PI/180;ctx.beginPath();ctx.arc(200+160*Math.cos(r),200+160*Math.sin(r),2.5,0,Math.PI*2);ctx.fillStyle='#8b263522';ctx.fill();});

  function pos(e){const rect=cv.getBoundingClientRect();const sx=cv.width/rect.width,sy=cv.height/rect.height;const cx=e.touches?e.touches[0].clientX:e.clientX;const cy=e.touches?e.touches[0].clientY:e.clientY;return{x:(cx-rect.left)*sx,y:(cy-rect.top)*sy};}
  function start(e){e.preventDefault();const p=pos(e);DS.drawing=true;DS.lx=p.x;DS.ly=p.y;}
  function move(e){e.preventDefault();if(!DS.drawing)return;const p=pos(e);const c2=cv.getContext('2d');c2.globalCompositeOperation=DS.tool==='eraser'?'destination-out':'source-over';c2.strokeStyle=DS.color;c2.lineWidth=DS.tool==='eraser'?DS.size*4:DS.size;c2.lineCap='round';c2.lineJoin='round';c2.beginPath();c2.moveTo(DS.lx,DS.ly);c2.lineTo(p.x,p.y);c2.stroke();DS.lx=p.x;DS.ly=p.y;}
  function end(e){e?.preventDefault();DS.drawing=false;}
  cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);cv.addEventListener('mouseup',end);cv.addEventListener('mouseleave',end);
  cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',end);
  updateToolUI();
}
function setDrawTool(t){DS.tool=t;updateToolUI();}
function setDrawColor(c){DS.color=c;DS.tool='pen';updateToolUI();}
function setDrawSize(s){DS.size=s;updateToolUI();}
function updateToolUI(){
  ['pen','eraser'].forEach(_t=>{const b=document.getElementById('tool-'+t);if(b){b.style.background=DS.tool===t?'#8b2635':'transparent';b.style.borderColor=DS.tool===t?'#8b2635':'#c8a86055';b.style.color=DS.tool===t?'#f5e8c8':'#8b6020';}});
  ['#c9a84c','#8b2635','#3d1a08','#1a3a6a','#2a5a1a','#6a3a1a','#000000'].forEach(c=>{const b=document.getElementById('color-'+c.replace('#',''));if(b)b.style.borderColor=DS.color===c?'#3d1a08':'#c8a86055';});
  [1,3,6,12].forEach(s=>{const b=document.getElementById('size-'+s);if(b)b.style.borderColor=DS.size===s?'#8b2635':'#c8a86055';});
}
function clearDrawCanvas(){
  const cv=document.getElementById('draw-canvas');if(!cv)return;
  const ctx=cv.getContext('2d');ctx.globalCompositeOperation='source-over';ctx.fillStyle='#f5e8cc';ctx.fillRect(0,0,400,400);
  ctx.strokeStyle='#c8a86033';ctx.lineWidth=0.7;[160,120,80,40].forEach(r=>{ctx.beginPath();ctx.arc(200,200,r,0,Math.PI*2);ctx.stroke();});
  ctx.strokeStyle='#c8a86022';ctx.lineWidth=0.5;[0,45,90,135,180,225,270,315].forEach(a=>{const r=a*Math.PI/180;ctx.beginPath();ctx.moveTo(200,200);ctx.lineTo(200+165*Math.cos(r),200+165*Math.sin(r));ctx.stroke();});
}
function saveDrawing(){const cv=document.getElementById('draw-canvas');if(!cv)return;sealSymbol(cv.toDataURL('image/png'));}

// ── Bind ───────────────────────────────────────────────────────────────────────
function bindEvents(){
  if(S.view==='dream'&&S.activeStage==='individuate'&&S.symbolMode==='draw'){setTimeout(initCanvas,60);}
  const rb=document.getElementById('reply-box');if(rb)rb.value=S.replyText;
  const nt=document.getElementById('new-title');if(nt)nt.value=S.newDreamTitle;
  const nx=document.getElementById('new-text');if(nx)nx.value=S.newDreamText;
}

// ── Init ───────────────────────────────────────────────────────────────────────
async function init(){
  // Show home immediately — no login gate
  S.view = 'home';
  S.isGuest = !getToken();

  // Always load from localStorage first (works for everyone)
  loadDreamsFromStorage();
  render();

  // If logged in, also try to sync from server (merges on top)
  if(getToken()){
    try{
      const rows = await apiCall('/dreams','GET');
      if(rows && rows.length > 0){
        S.dreams = rows.map(function(r){
          const stages = Object.assign({journal:'',conversation:[],integrate:'',individuate:''}, r.stages, {symbol: r.symbol||null});
          if(!Array.isArray(stages.conversation)) stages.conversation = [];
          return {id:r.id, title:r.title, date:r.date, entryType:r.entryType||'dream', stages:stages};
        });
        saveDreamsToStorage();
      }
      S.isGuest = false;
      render();
    }catch(e){ console.warn('Dream load failed, using local cache:', e.message); }
  }
}


init();


</script>
<script>
if('serviceWorker' in navigator && (location.hostname === 'tseelam-mask.github.io' || location.hostname === 'localhost')){
  // Unregister all old service workers first, then register fresh
  navigator.serviceWorker.getRegistrations().then(function(regs){
    var unregPromises = regs.map(function(r){ return r.unregister(); });
    return Promise.all(unregPromises);
  }).then(function(){
    // Clear all caches
    return caches.keys().then(function(keys){
      return Promise.all(keys.map(function(k){ return caches.delete(k); }));
    });
  }).then(function(){
    // Register fresh SW
    return navigator.serviceWorker.register('/Mandala/sw.js', {scope: '/Mandala/'});
  }).then(function(reg){
    reg.update();
    console.log('Mandala SW fresh registered:', reg.scope);
  }).catch(function(err){
    console.log('SW registration failed:', err);
  });
}</script>
