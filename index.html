// INITIATION ASSEMBLY SEQUENCE
// The world assembles because someone arrived.
// ══════════════════════════════════════════════════════════════════
async function assembleWorld(){
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // 0.0s — Play initiation tone as assembly begins
  if(window.mandalaAudio) window.mandalaAudio.playInitiationTone();

  // Get initiation screen element
  const initScreen = document.getElementById('initiation-screen');
  if(!initScreen) return;

  // 0.0s — Orb slows its pulse
  const orb = document.getElementById('breath-orb');
  if(orb){
    orb.style.animationDuration = '8s';
    orb.style.transition = 'transform 2.4s ease-in-out, opacity 2.4s ease-in-out';
  }

  // 0.8s — Orb expands and fades
  await wait(800);
  if(orb){
    orb.style.transform = 'scale(3.5)';
    orb.style.opacity = '0.08';
  }

  // Fade initiation text
  const initText = initScreen.querySelector('.initiation-text-content');
  if(initText){
    initText.style.transition = 'opacity 0.8s ease';
    initText.style.opacity = '0';
  }

  // 1.6s — The scene SVG becomes visible; vanishing point appears first
  await wait(800);
  const sceneSVG = document.getElementById('dream-scene-svg');
  if(sceneSVG){
    sceneSVG.style.transition = 'opacity 0.6s ease';
    sceneSVG.style.opacity = '0.15'; // Start barely visible
  }

  // Perspective lines draw themselves outward (strokeDashoffset animation)
  const perspLines = document.querySelectorAll('.persp-line');
  perspLines.forEach((line, i) => {
    const len = line.getTotalLength ? line.getTotalLength() : 600;
    line.style.strokeDasharray = len;
    line.style.strokeDashoffset = len;
    line.style.transition = 'none';
    setTimeout(() => {
      line.style.transition = 'stroke-dashoffset 0.8s ease';
      line.style.strokeDashoffset = '0';
    }, i * 100);  // 0.1s stagger between each of 11 lines
  });

  // 3.6s — Mountain range materializes
  await wait(2000);
  const mountains = document.querySelectorAll('.scene-mountain');
  mountains.forEach(m => {
    m.style.transition = 'opacity 0.6s ease';
    m.style.opacity = '0.45';
  });

  // Also bring scene SVG to fuller opacity
  if(sceneSVG) sceneSVG.style.opacity = '0.5';

  // 4.4s — World breathes into its natural darkness (nigredo — the dream territory)
  await wait(800);
  document.body.style.transition = 'background 1.8s ease-in-out';
  // Do not override — let territory CSS control the atmosphere
  if(sceneSVG) sceneSVG.style.opacity = '0.8';

  // 5.2s — Rose blooms
  await wait(800);
  const rose = document.getElementById('scene-rose');
  if(rose){
    rose.style.transition = 'opacity 1.4s ease';
    rose.style.opacity = '0.6';
  }

  // 6.2s — Birds scatter into sky
  await wait(1000);
  const birds = document.querySelectorAll('.scene-bird');
  birds.forEach((b, i) => {
    setTimeout(() => {
      b.style.transition = 'opacity 0.4s ease';
      b.style.opacity = '0.38';
    }, i * 80);
  });

  // 6.8s — Corner medallions emerge
  await wait(600);
  const medallions = document.querySelectorAll('.corner-medallion');
  medallions.forEach(m => {
    m.style.transition = 'opacity 0.6s ease';
    m.style.opacity = '0.08';
  });

  // 7.2s — Wooden frame arrives
  await wait(400);
  const dreamPage = document.querySelector('.page-dream');
  if(dreamPage){
    dreamPage.style.transition = 'box-shadow 0.5s ease';
    // Frame already set via CSS, just ensure it's applied
  }

  // 7.8s — Alchemical glyphs settle to standard opacity
  await wait(600);
  const glyphs = document.querySelectorAll('.margin-glyph');
  glyphs.forEach(g => {
    g.style.transition = 'opacity 0.8s ease';
    g.style.opacity = '0.10';
  });

  // 8.4s — Initiation screen fades out
  await wait(600);
  if(initScreen){
    initScreen.style.transition = 'opacity 1.2s ease';
    initScreen.style.opacity = '0';
  }

  await wait(1200);
  if(initScreen) initScreen.style.display = 'none';
  if(sceneSVG) sceneSVG.style.opacity = '1';

  // 9.6s — Open directly into the Oracle conversation
  await wait(0);
  if(true){ // no server auth
    S.isGuest = true;
    // Create a guest dream record with the initiation content
    const guestId = 'guest-' + Date.now();
    const guestDream = {
      id: guestId,
      entryType: S.initiationEntryType || S.entryType || 'dream',
      title: (S.initiationDream||'').trim().split(/\s+/).slice(0,5).join(' ') + '…',
      date: new Date().toLocaleDateString('en-US',{year:'numeric',month:'long'}),
      stages: {
        journal: S.initiationDream || '',
        conversation: [
          {role:'dreamer', text: S.initiationDream || ''},
          {role:'jung', text: S.initiationOracle || ''}
        ],
        integrate: '',
        individuate: '',
        symbol: null
      }
    };
    S.dreams = [guestDream];
    S.activeDreamId = guestId;
    S.activeStage = 'descend';  // Skip enter — Oracle already spoke
    saveDreamsToStorage();
  }
  S.view = 'dream';
  render();
  // Trigger entrance animation on first panel
  setTimeout(() => {
    const panels = document.querySelectorAll('.glass-panel, .dream-card');
    panels.forEach((p, i) => {
      p.style.transform = 'translateY(20px)';
      p.style.opacity = '0';
      p.style.transition = 'none';
      setTimeout(() => {
        p.style.transition = 'transform 0.8s ease-out, opacity 0.8s ease';
        p.style.transform = 'translateY(0)';
        p.style.opacity = '1';
      }, i * 80);
    });
  }, 50);
}

      </div>

  }

  return '';
}

async function submitInitiationDream(){
  const el = document.getElementById('initiation-dream-input'); if(el) S.initiationDream = el.innerText || el.textContent || '';
  const dream = S.initiationDream.trim();
  if(!dream || dream.length < 8) return;
  S.initiationStep = 2;
  render();
  try{
    const oracle = await callClaude(
      JUNG_FIRST_ENCOUNTER_SYS(S.entryType),
      [{role:'user', content: dream}]
    );
    S.initiationOracle = oracle;
    S.initiationStep = 3;
    render();
    // After showing the Oracle's response, assemble the world
    await wait(2400);
    assembleWorld();
    return;
  } catch(e){
    S.initiationOracle = 'Something arrived in that dream. I want to stay with it a little longer.';
    S.initiationStep = 3;
    render();
    await wait(2400);
    assembleWorld();
    return;
  }
}

const VESSEL_APP_MAP = {
  meditation: 'meditation',
  music:      'music',
  gym:        'movement',
  hiking:     'walking',

  yoga:       'yoga',

function buildVesselAppLinks(integModes){
  if(!integModes||!integModes.length) return '';
  
  const allApps = [];
  integModes.forEach(function(mode){
    const cat = VESSEL_APP_MAP[mode];
    if(cat && VESSEL_APPS[cat]){
      VESSEL_APPS[cat].forEach(function(app){
        if(!allApps.find(function(a){return a.name===app.name;})){
          allApps.push(app);
        }
      });
    }
  });
  
  if(!allApps.length) return '';
  
  return '<div style="margin-top:16px;">'+
    '<div style="font-family:\'Cinzel\',serif;font-size:7px;letter-spacing:3px;color:rgba(145,85,28,0.5);text-transform:uppercase;margin-bottom:10px;">Open in</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:8px;">'+
      allApps.map(function(app){
        // For Day One, pre-fill with dream content
        var url = app.url;
        return '<a href="'+url+'" style="'+
          'display:inline-flex;align-items:center;gap:7px;'+
          'padding:8px 14px;'+
          'background:rgba(252,248,238,0.92);'+
          'border:1px solid rgba(140,105,40,0.2);'+
          'border-radius:1px;'+
          'font-family:\'Cinzel\',serif;font-size:8px;letter-spacing:1px;'+
          'color:#6a4820;text-decoration:none;'+
          'transition:all 0.2s;'+
        '">'+
          '<span style="font-size:14px;">'+app.icon+'</span>'+
          app.name+
        '</a>';
      }).join('')+
    '</div>'+
  '</div>';
}

async function generateIntegrate(dreamId){
  const dream=getDream(dreamId);if(!dream)return;
  const nl='\n';
  const conv=(dream.stages.conversation||[]).map(function(_t){return(_t.role==='jung'?'Jung':'Dreamer')+': '+_t.text;}).join(nl+nl);
  const selectedLabels=S.integModes.map(function(id){
    const o=INTEG_OPTIONS.find(function(x){return x.id===id;});
    return o?(o.label+' ('+o.alch+' — '+o.desc+')'):null;
  }).filter(Boolean);
  const vessels=selectedLabels.map(function(l,i){return(i+1)+'. '+l;}).join(nl);
  const prompt='Dream: "'+dream.stages.journal+'"'+nl+nl+'Dialogue:'+nl+conv+nl+nl+'The dreamer has chosen these specific vessels for integration:'+nl+vessels+nl+nl+'As Jung, speak directly to these chosen practices. For each one, illuminate how this specific dream\'s energy flows through that particular form of embodiment — not generically, but in direct dialogue with this dream\'s symbols, figures, and insights. Be poetic, specific, and alchemically precise. Weave them together as a unified path rather than a list.';
  S.loading=true;render();
  try{
    const r=await callClaude(JUNG_SYS(),[{role:'user',content:prompt}],1400);
    updateDream(dreamId,function(d){return{...d,stages:{...d.stages,integrate:r}};});
  }catch(e){alert('Error: '+e.message);}
  S.loading=false;render();
}

      '<div style="font-family:\'IM Fell English\',serif;font-size:13px;color:#8a6830;text-align:center;font-style:italic;margin-bottom:20px;">'+t('symbolSub')+'</div>'+
      symbolSection:'');
}


// ── Draw Canvas ────────────────────────────────────────────────────────────────
function buildDrawCanvas(){
  const cols=['#c9a84c','#8b2635','#3d1a08','#1a3a6a','#2a5a1a','#6a3a1a','#000000'];
  return`<div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f0e5c8;border:1px solid #c8a86044;padding:10px 12px;margin-bottom:8px;border-radius:2px;">
      <button id="tool-pen" onclick="setDrawTool('pen')" style="padding:5px 12px;background:#8b2635;border:1px solid #8b2635;color:#f5e8c8;border-radius:1px;font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;cursor:pointer;">PEN</button>
      <button id="tool-eraser" onclick="setDrawTool('eraser')" style="padding:5px 12px;background:transparent;border:1px solid #c8a86055;color:#8b6020;border-radius:1px;font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;cursor:pointer;">ERASE</button>
      <div style="width:1px;height:20px;background:#c8a86044;"></div>
      ${cols.map(c=>`<button onclick="setDrawColor('${c}')" id="color-${c.replace('#','')}" style="width:20px;height:20px;border-radius:50%;background:${c};border:2px solid #c8a86055;cursor:pointer;flex-shrink:0;"></button>`).join('')}
      <div style="width:1px;height:20px;background:#c8a86044;"></div>
      ${[1,3,6,12].map(s=>`<button onclick="setDrawSize(${s})" id="size-${s}" style="width:22px;height:22px;border-radius:50%;background:transparent;border:1px solid #c8a86055;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;"><div style="width:${s*1.4}px;height:${s*1.4}px;border-radius:50%;background:#8b6020;"></div></button>`).join('')}
      <button onclick="clearDrawCanvas()" style="margin-left:auto;padding:5px 10px;background:transparent;border:1px solid #c8a86044;color:#a8844a;font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;cursor:pointer;">CLEAR</button>
    </div>
    <canvas id="draw-canvas" width="400" height="400" style="width:100%;max-width:400px;aspect-ratio:1;border:1px solid #c8a86055;cursor:crosshair;touch-action:none;display:block;border-radius:1px;"></canvas>
    <div style="font-family:'IM Fell English',serif;font-size:11px;color:#a8844a;text-align:center;margin-top:8px;font-style:italic;">The rings and spokes are guides — your marks are the meaning</div>
    ${divider('◈')}
    <button class="btn btn-crimson btn-wide" onclick="saveDrawing()">${t('sealDrawing')}</button>
    <button class="btn btn-outline btn-wide" onclick="setSymbolMode(null)" style="margin-top:8px;">${t('back')}</button>
  </div>`;
}

// ── Canvas state ───────────────────────────────────────────────────────────────
let DS={tool:'pen',color:'#8b2635',size:3,drawing:false,lx:0,ly:0};
function initCanvas(){
  const cv=document.getElementById('draw-canvas');if(!cv)return;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#f5e8cc';ctx.fillRect(0,0,400,400);
  // Parchment-toned guide rings
  ctx.strokeStyle='#c8a86033';ctx.lineWidth=0.7;
  [160,120,80,40].forEach(r=>{ctx.beginPath();ctx.arc(200,200,r,0,Math.PI*2);ctx.stroke();});
  ctx.strokeStyle='#c8a86022';ctx.lineWidth=0.5;
  [0,45,90,135,180,225,270,315].forEach(a=>{const r=a*Math.PI/180;ctx.beginPath();ctx.moveTo(200,200);ctx.lineTo(200+165*Math.cos(r),200+165*Math.sin(r));ctx.stroke();});
  // Cardinal dots
  [0,90,180,270].forEach(a=>{const r=a*Math.PI/180;ctx.beginPath();ctx.arc(200+160*Math.cos(r),200+160*Math.sin(r),2.5,0,Math.PI*2);ctx.fillStyle='#8b263522';ctx.fill();});

  function pos(e){const rect=cv.getBoundingClientRect();const sx=cv.width/rect.width,sy=cv.height/rect.height;const cx=e.touches?e.touches[0].clientX:e.clientX;const cy=e.touches?e.touches[0].clientY:e.clientY;return{x:(cx-rect.left)*sx,y:(cy-rect.top)*sy};}
  function start(e){e.preventDefault();const p=pos(e);DS.drawing=true;DS.lx=p.x;DS.ly=p.y;}
  function move(e){e.preventDefault();if(!DS.drawing)return;const p=pos(e);const c2=cv.getContext('2d');c2.globalCompositeOperation=DS.tool==='eraser'?'destination-out':'source-over';c2.strokeStyle=DS.color;c2.lineWidth=DS.tool==='eraser'?DS.size*4:DS.size;c2.lineCap='round';c2.lineJoin='round';c2.beginPath();c2.moveTo(DS.lx,DS.ly);c2.lineTo(p.x,p.y);c2.stroke();DS.lx=p.x;DS.ly=p.y;}
  function end(e){e?.preventDefault();DS.drawing=false;}
  cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);cv.addEventListener('mouseup',end);cv.addEventListener('mouseleave',end);
  cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',end);
  updateToolUI();
}
function setDrawTool(t){DS.tool=t;updateToolUI();}
function setDrawColor(c){DS.color=c;DS.tool='pen';updateToolUI();}
function setDrawSize(s){DS.size=s;updateToolUI();}
function updateToolUI(){
  ['pen','eraser'].forEach(_t=>{const b=document.getElementById('tool-'+t);if(b){b.style.background=DS.tool===t?'#8b2635':'transparent';b.style.borderColor=DS.tool===t?'#8b2635':'#c8a86055';b.style.color=DS.tool===t?'#f5e8c8':'#8b6020';}});
  ['#c9a84c','#8b2635','#3d1a08','#1a3a6a','#2a5a1a','#6a3a1a','#000000'].forEach(c=>{const b=document.getElementById('color-'+c.replace('#',''));if(b)b.style.borderColor=DS.color===c?'#3d1a08':'#c8a86055';});
  [1,3,6,12].forEach(s=>{const b=document.getElementById('size-'+s);if(b)b.style.borderColor=DS.size===s?'#8b2635':'#c8a86055';});
}
function clearDrawCanvas(){
  const cv=document.getElementById('draw-canvas');if(!cv)return;
  const ctx=cv.getContext('2d');ctx.globalCompositeOperation='source-over';ctx.fillStyle='#f5e8cc';ctx.fillRect(0,0,400,400);
  ctx.strokeStyle='#c8a86033';ctx.lineWidth=0.7;[160,120,80,40].forEach(r=>{ctx.beginPath();ctx.arc(200,200,r,0,Math.PI*2);ctx.stroke();});
  ctx.strokeStyle='#c8a86022';ctx.lineWidth=0.5;[0,45,90,135,180,225,270,315].forEach(a=>{const r=a*Math.PI/180;ctx.beginPath();ctx.moveTo(200,200);ctx.lineTo(200+165*Math.cos(r),200+165*Math.sin(r));ctx.stroke();});
}
function saveDrawing(){const cv=document.getElementById('draw-canvas');if(!cv)return;sealSymbol(cv.toDataURL('image/png'));}

// ── Bind ───────────────────────────────────────────────────────────────────────
function bindEvents(){
  if(S.view==='dream'&&S.activeStage==='individuate'&&S.symbolMode==='draw'){setTimeout(initCanvas,60);}
  const rb=document.getElementById('reply-box');if(rb)rb.value=S.replyText;
  const nt=document.getElementById('new-title');if(nt)nt.value=S.newDreamTitle;
  const nx=document.getElementById('new-text');if(nx)nx.value=S.newDreamText;
}

// ── Init ───────────────────────────────────────────────────────────────────────
async function init(){
  // Load dreams from localStorage
  const hasDreams = loadDreamsFromStorage();

  if(hasDreams){
    // Returning visitor with stored dreams — go straight to home
    S.view = 'home';
    S.isGuest = true;
    render();
  } else {
    // First visit — begin the initiation ritual
    S.view = 'initiation';
    S.isGuest = true;
    S.initiationStep = 0;
    render();
  }

  // DEAD CODE BELOW (server load removed) — kept to avoid parse errors
  if(false){
    try{
      const rows = [];
      S.dreams = rows.map(function(r){
        const stages = Object.assign({journal:'',conversation:[],integrate:'',individuate:''}, r.stages, {symbol: r.symbol||null});
        if(!Array.isArray(stages.conversation)) stages.conversation = [];
        return {id:r.id, title:r.title, date:r.date, stages:stages};
      });
      S.isGuest = false;
      render();
    }catch(e){ console.warn('Dream load failed:', e.message); }
  }
}


init();
