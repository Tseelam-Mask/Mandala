<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400&family=Cinzel:wght@400;600&family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}

html,body{
  height:100%;
  background:#f8f4ec;
  color:#3a2810;
  font-family:'Cormorant Garamond',serif;
  font-size:16px;line-height:1.7;
}
#app{height:100%;min-height:100vh;}
.scroll-view{height:100vh;overflow-y:auto;overflow-x:hidden;}

/* ── PAGE BACKGROUNDS — Dalí dreamscape ─────────────────── */
.page-home,.page-dream,.page-archive,.page-patterns,.page-login{
  min-height:100vh;position:relative;
  background:linear-gradient(180deg,
    #f8f4ec 0%,#f4eee2 22%,#ede3cc 40%,
    #dfd0a8 52%,#cfc098 62%,#bfad88 74%,
    #b0a070 86%,#a09060 100%);
}
.page-login{
  display:flex;align-items:center;justify-content:center;
}
.page-home::before,.page-dream::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,252,245,0.45) 0%,transparent 50%);
}

/* ── TYPOGRAPHY ─────────────────────────────────────────── */
.app-title{
  font-family:'Cinzel Decorative',serif;
  font-size:34px;letter-spacing:12px;
  color:#7a5828;text-align:center;margin-bottom:5px;
  text-shadow:1px 1px 0 rgba(180,130,50,0.15);
}
.app-sub{
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:6px;
  color:#8a6830;text-align:center;text-transform:uppercase;
}

/* ── BUTTONS — three alchemical actions ─────────────────── */
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin:20px 0;}
.btn-action{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:18px 8px;min-height:90px;border-radius:1px;
  cursor:pointer;border:none;font-family:'Cinzel',serif;
  font-size:8px;letter-spacing:3px;text-transform:uppercase;
  position:relative;transition:all 0.4s;
}
.btn-action::before{content:'';position:absolute;inset:3px;border:1px solid rgba(255,255,255,0.12);border-radius:1px;pointer-events:none;}
.btn-new,.btn-gold,.btn-cobalt{background:transparent;border:none;}
.btn-action-glyph{font-size:22px;margin-bottom:7px;display:block;}
.btn-action-sub{font-size:7px;opacity:0.42;margin-top:3px;font-family:'IM Fell English',serif;font-style:italic;letter-spacing:1px;}

/* ── DREAM CARDS ─────────────────────────────────────────── */
.dream-card{
  background:rgba(252,246,232,0.88);
  border:1px solid rgba(120,90,40,0.15);
  border-radius:1px;padding:13px 16px;margin-bottom:7px;
  cursor:pointer;position:relative;overflow:hidden;
  display:flex;align-items:center;gap:12px;transition:all 0.32s;
  box-shadow:0 3px 16px rgba(60,40,15,0.1),inset 0 1px 0 rgba(255,252,240,0.8);
}
.dream-card::before{content:'';position:absolute;top:0;left:0;width:2px;height:100%;background:linear-gradient(180deg,#a82030,#c09030,#a82030);}
.dream-card:hover{background:rgba(255,252,240,0.96);box-shadow:0 5px 22px rgba(60,40,15,0.16);}
.dream-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;color:#2a1a08;margin-bottom:2px;}
.dream-date{font-family:'IM Fell English',serif;font-size:11px;color:#8a6030;font-style:italic;}

/* ── PROGRESS BARS ───────────────────────────────────────── */
.progress-wrap{height:1px;background:rgba(100,70,25,0.15);overflow:hidden;margin-top:5px;}
.progress-bar{height:100%;background:linear-gradient(90deg,#a82030,#c09030);transition:width 0.8s ease;}

/* ── PARCHMENT PANELS ────────────────────────────────────── */
.parchment-panel{
  background:rgba(252,246,232,0.82);
  border:1px solid rgba(120,90,40,0.14);
  border-radius:1px;padding:22px 26px;position:relative;
}
.parchment-panel::before{content:'';position:absolute;inset:5px;border:1px solid rgba(140,105,40,0.07);border-radius:1px;pointer-events:none;}

/* ── CONVERSATION BUBBLES ────────────────────────────────── */
.jung-bubble{
  background:rgba(248,242,225,0.9);
  border:1px solid rgba(100,75,30,0.15);
  border-left:2px solid rgba(160,40,30,0.5);
  border-radius:1px;padding:18px 22px;margin-bottom:14px;
}
.breakdown-bubble{
  border-left-color:rgba(160,125,30,0.6);
  background:rgba(252,246,228,0.92);
}
.you-bubble{
  background:rgba(242,236,215,0.82);
  border:1px solid rgba(100,75,30,0.12);
  border-left:2px solid rgba(140,105,30,0.4);
  border-radius:1px;padding:16px 20px;margin-bottom:14px;
}

/* ── DREAM HEADER / NAV ──────────────────────────────────── */
.dream-header{
  background:rgba(245,238,215,0.92);
  border-bottom:1px solid rgba(140,105,40,0.15);
  padding:11px 18px;position:sticky;top:0;z-index:20;
  backdrop-filter:blur(8px);
}
.nav-tab{
  font-family:'Cinzel',serif;font-size:7px;letter-spacing:3px;
  padding:7px 12px;border-radius:1px;cursor:pointer;
  transition:all 0.22s;text-transform:uppercase;
  color:rgba(90,65,28,0.45);border:none;background:transparent;
}
.nav-tab.active{
  background:linear-gradient(135deg,#5a0810,#901828);
  color:#fce8d0;box-shadow:0 2px 12px rgba(90,8,16,0.28);
}
.nav-tab.done{color:rgba(140,100,35,0.6);}
.nav-tab.locked{color:rgba(140,100,35,0.2);}

/* ── GENERAL BUTTONS ─────────────────────────────────────── */
.btn{
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;
  padding:13px 22px;border-radius:1px;cursor:pointer;
  transition:all 0.25s;text-transform:uppercase;border:none;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn-wide{width:100%;display:flex;}
.btn-crimson{
  background:linear-gradient(135deg,#5a0810,#901828,#780e1e);
  color:#fce8d0;border:1px solid rgba(200,70,50,0.3);
  box-shadow:0 4px 18px rgba(90,8,16,0.28);
}
.btn-crimson:hover{box-shadow:0 6px 26px rgba(110,10,20,0.38);}
.btn-crimson:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none;}
.btn-gold{
  background:linear-gradient(135deg,#3a2808,#6a4818,#4a3410);
  color:#f0d070;border:1px solid rgba(180,140,45,0.3);
}
.btn-gold:hover{border-color:rgba(200,160,55,0.5);}
.btn-outline{
  background:transparent;color:#7a5828;
  border:1px solid rgba(140,105,40,0.28);
}
.btn-outline:hover{border-color:rgba(140,105,40,0.5);color:#5a3818;}

/* ── LOGIN CARD ──────────────────────────────────────────── */
.login-card{
  background:rgba(253,249,240,0.96);
  border:1px solid rgba(150,108,52,0.2);
  border-radius:1px;padding:36px;
  max-width:440px;width:100%;
  /* Wooden frame effect — like the Dalí painting's border */
  box-shadow:
    0 0 0 4px rgba(142,82,38,0.18),
    0 0 0 8px rgba(160,100,50,0.1),
    0 0 0 12px rgba(130,72,30,0.07),
    0 24px 70px rgba(60,35,12,0.2);
  position:relative;
}
.login-card::before{
  content:'';position:absolute;inset:6px;
  border:1px solid rgba(160,115,50,0.12);
  border-radius:1px;pointer-events:none;
}
.login-card::after{
  content:'';position:absolute;inset:10px;
  border:1px solid rgba(160,115,50,0.06);
  border-radius:1px;pointer-events:none;
}

/* ── INPUTS ──────────────────────────────────────────────── */
input,textarea{
  font-family:'Cormorant Garamond',serif;
  background:rgba(248,242,225,0.7);
  color:#3a2810;outline:none;resize:none;
  border:1px solid rgba(140,105,40,0.2);
  border-radius:1px;padding:10px 14px;
  transition:border-color 0.2s;
}
input:focus,textarea:focus{border-color:rgba(140,105,40,0.45);}
input::placeholder,textarea::placeholder{color:rgba(120,90,40,0.35);}

/* ── SYMBOL GRID ─────────────────────────────────────────── */
.symbol-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.symbol-opt{
  background:rgba(252,246,232,0.85);
  border:1px solid rgba(140,105,40,0.18);border-radius:1px;
  padding:22px 14px;cursor:pointer;text-align:center;transition:all 0.25s;
}
.symbol-opt:hover{border-color:rgba(140,105,40,0.4);box-shadow:0 4px 16px rgba(60,40,15,0.1);}

/* ── AFFIRMATION CARDS ───────────────────────────────────── */
.affirmation-card{
  background:rgba(250,244,228,0.9);
  border:1px solid rgba(140,105,40,0.14);
  border-left:2px solid rgba(160,125,30,0.45);
  padding:13px 17px;margin-bottom:7px;border-radius:1px;
  animation:floatUp 0.4s ease forwards;
}

/* ── CIV PANEL ───────────────────────────────────────────── */
.civ-panel{
  background:rgba(238,232,210,0.88);
  border:1px solid rgba(80,110,160,0.2);
  border-top:2px solid rgba(60,100,180,0.3);
  border-radius:1px;padding:22px 26px;
}

/* ── VESSEL GRID ─────────────────────────────────────────── */
.vessel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:14px;}

/* ── TOUR ────────────────────────────────────────────────── */
.tour-overlay{position:fixed;inset:0;background:rgba(30,20,8,0.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.tour-card{
  background:rgba(252,246,232,0.97);
  border:1px solid rgba(140,105,40,0.22);
  max-width:600px;width:100%;border-radius:1px;padding:34px;
  box-shadow:0 30px 80px rgba(30,20,8,0.5);max-height:90vh;overflow-y:auto;
  position:relative;
}
.tour-card::before{content:'';position:absolute;inset:8px;border:1px solid rgba(140,105,40,0.07);border-radius:1px;pointer-events:none;}
.tour-dot{width:7px;height:7px;border-radius:50%;background:rgba(140,105,40,0.2);transition:all 0.3s;cursor:pointer;}
.tour-dot.active{background:#c09030;transform:scale(1.3);}
.tour-dot.done{background:#901828;}

/* ── ANIMATIONS ──────────────────────────────────────────── */
@keyframes mandala-spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(180,140,40,0.3);}50%{box-shadow:0 0 0 8px rgba(180,140,40,0);}}
@keyframes floatUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ── SCROLLBAR ───────────────────────────────────────────── */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:rgba(200,175,120,0.2);}
::-webkit-scrollbar-thumb{background:rgba(140,105,40,0.25);border-radius:2px;}
</style>

// For other languages, fall back to English UI with translated Jung responses
function t(key){
  try{
    var lang=getLang();
    var dict=(UI&&UI[lang])||{};
    var en=(UI&&UI['en'])||{};
    return dict[key]||en[key]||key;
  }catch(e){return key;}
}


function openTour(){S.showTour=true;S.tourStep=0;render();}

function quickNewDream(){
  const id='dream-'+Date.now();
  const today=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long'});
  const nd={id,title:'Untitled Dream',date:today,stages:{journal:'',conversation:[],integrate:'',individuate:'',symbol:null}};
  S.dreams=[nd,...S.dreams];
  syncDreamToServer(nd);
  S.activeDreamId=id;S.activeStage='enter';S.civStory='';
  S.vesselConversation=[];S.integAffirmations=[];S.individConversation=[];
  S.view='dream';render();
  setTimeout(()=>document.getElementById('journal-textarea')?.focus(),100);
}

function doLogout(){
  clearAuth();S.dreams=[];S.view='login';S.authEmail='';S.authPassword='';S.authError='';render();
}

function SEED_DREAMS(){ return []; }

// ── Utils ──────────────────────────────────────────────────────────────────────
const el=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getDream(id){return S.dreams.find(d=>d.id===(id||S.activeDreamId));}
function completedStages(d){
  if(!d)return[];const r=[];
  if(d.stages.journal?.trim())r.push('journal');
  if((d.stages.conversation||[]).length>0)r.push('analyze');
  if(d.stages.integrate?.trim())r.push('integrate');
  if(d.stages.individuate?.trim())r.push('individuate');
  return r;
}
function completedPhases(d){
  if(!d)return[];const r=[];
  if(d.stages.journal?.trim())r.push('enter');
  if(d.stages.integrate?.trim())r.push('descend');
  if(d.stages.individuate?.trim())r.push('return');
  return r;
}
function updateDream(id,fn){S.dreams=S.dreams.map(d=>d.id===id?fn(d):d);const updated=getDream(id);if(updated)syncDreamToServer(updated);}
function render(){
  const sv=document.querySelector('.scroll-view');
  const st=sv?sv.scrollTop:0;
  el('app').innerHTML=buildView();
  bindEvents();
  const nsv=document.querySelector('.scroll-view');
  if(nsv&&st>20)nsv.scrollTop=st;
}

function renderAndScroll(){
  el('app').innerHTML=buildView();
  bindEvents();
  setTimeout(function(){
    var cb=document.getElementById('chat-bottom');
    if(cb)cb.scrollIntoView({behavior:'smooth',block:'end'});
  },80);
}

const _JUNG_SYS_BASE=`You are Carl Gustav Jung — not performing Jung but being him. You are in session with a dreamer.

Your method:
- Ask before you interpret. When you do interpret, it is tentative: "it seems to me", "I wonder if", "this might point toward"
- Amplify each image: ask what it reminds the dreamer of in their waking life before reaching for archetypal meaning
- When you do interpret, go to the specific image — not the dream as a whole
- Draw on alchemy, Vedic philosophy, mythology, and depth psychology as one unified language — never as separate frameworks
- Never repeat phrases across responses. Each response should feel freshly drawn from this specific dreamer's specific words
- Avoid: "Ah", "Indeed", "I see", "fascinating", "this dream suggests", "the unconscious is telling you"
- Speak as if to a specific person, not a generic dreamer
- Keep responses under 200 words unless giving a full interpretation`;

const _JUNG_OPENING_SYS_BASE=`You are Carl Gustav Jung in the opening moments of a session. The dreamer has just shared their dream with you. Your task now is NOT to interpret — it is to understand. 

Ask ONE precise, warm question that opens the dream rather than closes it. Choose the most alive, strange, or emotionally charged image from the dream and ask about the dreamer's felt experience of it — not what it means, but what it felt like, what it reminded them of, whether it has appeared before.

Never begin with "Ah" or "I notice" or "This dream suggests" — these are interpretive moves. Begin with genuine curiosity. 

Your question should be specific to THIS dream's images, not generic. Under 80 words.`;

const _JUNG_BREAKDOWN_SYS_BASE=`You are Carl Gustav Jung. The dreamer has shared enough for a full interpretation. Write as if composing a passage from Memories, Dreams, Reflections — personal, precise, mythically grounded.

Go through each significant image from the dream, one by one:
1. Name the image exactly as the dreamer described it
2. Give its personal layer: what the dreamer's own associations reveal
3. Give its archetypal layer: the collective pattern beneath the personal
4. Give its alchemical or mythic resonance — one specific tradition that illuminates it
5. Connect it to the dreamer's current life situation if the conversation revealed it

End with: "What this dream is asking of you now is —" followed by one clear, forward-facing sentence.

Write in first person as Jung. Tentative where appropriate, direct where the image demands it. 350-500 words.`;

// Dynamic system prompts with language
function JUNG_SYS(){const li=langInstruction();return li?li+'\n\n'+_JUNG_SYS_BASE:_JUNG_SYS_BASE;}
function JUNG_OPENING_SYS(){const li=langInstruction();return li?li+'\n\n'+_JUNG_OPENING_SYS_BASE:_JUNG_OPENING_SYS_BASE;}
function JUNG_BREAKDOWN_SYS(){const li=langInstruction();return li?li+'\n\n'+_JUNG_BREAKDOWN_SYS_BASE:_JUNG_BREAKDOWN_SYS_BASE;}


// ── Mandala Cloud ─────────────────────────────────────────────────────────────
const BASE='https://mandala-cloud-production.up.railway.app';

function getToken(){return localStorage.getItem('mandala_token');}
function getEmail(){return localStorage.getItem('mandala_email');}
function setAuth(token,email){localStorage.setItem('mandala_token',token);localStorage.setItem('mandala_email',email);}
function clearAuth(){localStorage.removeItem('mandala_token');localStorage.removeItem('mandala_email');}

async function apiCall(path,method,body,auth=true){
  const headers={'Content-Type':'application/json'};
  if(auth)headers['Authorization']='Bearer '+getToken();
  const res=await fetch(BASE+path,{method:method||'GET',headers,body:body?JSON.stringify(body):undefined});
  if(res.status===401){clearAuth();S.view='login';render();throw new Error('Session expired — please log in again');}
  const data=await res.json();
  if(!res.ok)throw new Error(data.error||'Server error');
  return data;
}

async function callClaude(system,messages,maxTokens=1200){
  const token=getToken();
  if(!token){S.view='login';render();throw new Error('Please log in first');}
  const res=await fetch(BASE+'/api/dream',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens,system,messages})
  });
  if(res.status===401){clearAuth();S.view='login';render();throw new Error('Session expired');}
  if(!res.ok){const e=await res.json();throw new Error(e.error||'Server error '+res.status);}
  const data=await res.json();
  return data.content?.map(b=>b.text||'').join('')||'';
}

// ── Dream sync ─────────────────────────────────────────────────────────────────
async function syncDreamToServer(dream){
  if(!getToken())return;
  try{
    const{symbol,...stagesNoSym}=dream.stages;
    await apiCall('/dreams/'+dream.id,'PUT',{
      title:dream.title,date:dream.date,
      stages:stagesNoSym,
      symbol:symbol||null
    });
  }catch(e){console.warn('Sync failed:',e.message);}
}

async function loadDreamsFromServer(){
  if(!getToken())return false;
  try{
    const rows=await apiCall('/dreams','GET');
    if(rows.length>0){
      S.dreams=rows.map(r=>({
        id:r.id,title:r.title,date:r.date,
        stages:{...r.stages,symbol:r.symbol||null}
      }));
      return true;
    }
    return false;
  }catch(e){console.warn('Load failed:',e.message);return false;}
}

function langPrefix(){
  const l=getLang();
  if(l==='en')return '';
  const ln=LANGUAGES.find(x=>x.code===l);
  return ln?'[Respond in '+ln.name+' only] ':'';
}

function convMsgs(dream){
  const conv=dream.stages.conversation||[];
  const msgs=[{role:'user',content:langPrefix()+`Dream:\n\n"${dream.stages.journal}"\n\nBegin your analysis.`}];
  let jt=null;
  for(const _turn of conv){if(_turn.role==='jung'){jt=_turn.text;}else{if(jt){msgs.push({role:'assistant',content:jt});jt=null;}msgs.push({role:'user',content:_turn.text});}}
  if(jt)msgs.push({role:'assistant',content:jt});
  return msgs;
}

async function invokeJung(){
  const dream=getDream();if(!dream)return;
  if(!getToken()){S.view='login';render();return;}
  S.loading=true;render();
  try{
    const conv=dream.stages.conversation||[];
    const sys=conv.length===0?JUNG_OPENING_SYS():JUNG_SYS();
    const msgs=convMsgs(dream);
    console.log('Invoking Jung, system length:', sys.length, 'messages:', msgs.length);
    const r=await callClaude(sys,msgs);
    console.log('Jung response received, length:', r.length);
    if(!r){throw new Error('Empty response from Jung');}
    updateDream(S.activeDreamId,d=>({...d,stages:{...d.stages,conversation:[...(d.stages.conversation||[]),{role:'jung',text:r}]}}));
  }catch(e){
    console.error('invokeJung error:', e);
    alert('Error: '+e.message);
  }
  S.loading=false;renderAndScroll();
}

async function requestBreakdown(){
  const dream=getDream();if(!dream)return;S.loading=true;render();
  try{
    const conv=dream.stages.conversation||[];
    const convStr=conv.map(_t=>(_t.role==='jung'?'Jung':'Dreamer')+': '+_t.text).join('\n\n');
    const prompt='Dream: "'+dream.stages.journal+'"\n\nSession so far:\n'+convStr+'\n\nNow provide the full sentence-by-sentence breakdown.';
    const r=await callClaude(JUNG_BREAKDOWN_SYS(),[{role:'user',content:prompt}],1600);
    updateDream(S.activeDreamId,d=>({...d,stages:{...d.stages,conversation:[...conv,{role:'jung',text:r,isBreakdown:true}]}}));
  }catch(e){alert('Error: '+e.message);}
  S.loading=false;renderAndScroll();
}

async function sendReply(){
  const box=document.getElementById('reply-box');
  const txt=(box?box.value:S.replyText).trim();
  if(!txt)return;
  const dream=getDream();if(!dream)return;
  S.replyText='';
  const withUser=[...(dream.stages.conversation||[]),{role:'dreamer',text:txt}];
  updateDream(S.activeDreamId,d=>({...d,stages:{...d.stages,conversation:withUser}}));
  S.loading=true;render();
  try{
    const tmp={...dream,stages:{...dream.stages,conversation:withUser}};
    const r=await callClaude(JUNG_SYS(),convMsgs(tmp));
    updateDream(S.activeDreamId,d=>({...d,stages:{...d.stages,conversation:[...withUser,{role:'jung',text:r}]}}));
  }catch(e){alert('Error: '+e.message);}
  S.loading=false;renderAndScroll();
}

async function generateText(stageId){
  const dream=getDream();if(!dream)return;
  const conv=(dream.stages.conversation||[]).map(_t=>`${_t.role==='jung'?'Jung':'Dreamer'}: ${_t.text}`).join('\n\n');
  const prompts={
    integrate:`Dream: "${dream.stages.journal}"\n\nDialogue:\n${conv}\n\nAs Jung, speak to how this dream's wisdom might be carried into embodied integration: meditation, movement (gym/biking/hiking), nature, mandala drawing, spiritual practice. Be specific and poetic.`,
    individuate:`Dream: "${dream.stages.journal}"\n\nDialogue:\n${conv}\n\nIntegration:\n${dream.stages.integrate}\n\nAs Jung, describe the mandala that wants to emerge from this dream cycle. Describe: the central symbol, the ring structure, the colors, the nodal symbols at the spokes, and a one-line inscription for the border.`,
  };
  S.loading=true;render();
  try{const r=await callClaude(JUNG_SYS(),[{role:'user',content:prompts[stageId]}]);updateDream(S.activeDreamId,d=>({...d,stages:{...d.stages,[stageId]:r}}));}
  catch(e){alert('Error: '+e.message);}
  S.loading=false;render();
}

async function generateSymbol(){
  const dream=getDream();if(!dream)return;S.symbolLoading=true;S.generatedSvg=null;render();
  const conv=(dream.stages.conversation||[]).map(_t=>`${_t.role==='jung'?'Jung':'Dreamer'}: ${_t.text}`).join('\n\n');
  const SYS=`You are a master sacred artist synthesizing five traditions into SVG mandalas. DENSE, RICHLY LAYERED, minimum 60 SVG elements. Respond with ONLY raw SVG starting with <svg. No explanation. No markdown.`;
  const prompt=`Dream: "${dream.stages.journal}"\nDialogue:\n${conv}\nJung's mandala vision:\n${dream.stages.individuate}\n\nCreate a DENSELY LAYERED sacred mandala SVG. ALL FIVE: Alchemical, Hermetic, Mandala, Renaissance, Pure Psyche.\n\nMANDATORY ZONES (center 200,200):\nZONE 1 BORDER (r=185-195): Renaissance illuminated border, 8 ornamental nodes, dream inscription as text.\nZONE 2 OUTER (r=155-180): Ouroboros/serpent path, 8 planetary glyphs ☉☽♄♃♂♀☿ at spoke ends, 8 lotus petal ellipses.\nZONE 3 MIDDLE (r=110-150): 8 radial spokes, vesica piscis at 4 cardinal ends, 4 Jungian symbols at diagonals, pentagram.\nZONE 4 INNER (r=60-105): Rings at r=65,80,95, 8 diamond lozenges, golden spiral arcs, hexagram from two triangles.\nZONE 5 CENTER (r=0-55): Bindu r=8, dream archetype 5+ elements, radial gradient, Hermetic axis.\n\nGLOBAL: viewBox="0 0 400 400" width="400" height="400". Background rect warm dark (NOT pure black — use #1a1008 or similar warm dark). Color palette: warm jewel tones — deep cobalt, crimson, gold, verdigris, amber — like an illuminated manuscript. Stroke weights 0.3-2.5, opacity layers. SVG primitives ONLY. NO foreignObject NO image NO script. Minimum 60 elements.`;
  try{const r=await callClaude(SYS,[{role:'user',content:prompt}],4000);S.generatedSvg=r.trim().replace(/^```[a-z]*\n?/,'').replace(/\n?```$/,'').trim();}
  catch(e){alert('Error: '+e.message);}
  S.symbolLoading=false;render();
}

function sealSymbol(data){
  updateDream(S.activeDreamId,d=>({...d,stages:{...d.stages,symbol:data}}));
  try{window.storage.set('symbol:'+S.activeDreamId,data);}catch(e){}
  S.symbolMode='sealed';render();
}


async function deleteDream(id, e){
  e.stopPropagation(); // don't open the dream
  if(!confirm('Delete this dream cycle? This cannot be undone.'))return;
  S.dreams = S.dreams.filter(function(d){return d.id!==id;});
  render();
  // Delete from server
  try{ await apiCall('/dreams/'+id,'DELETE'); }catch(ex){ console.warn('Delete failed:',ex.message); }
}

function openDream(id){
  S.activeDreamId=id;const d=getDream(id);const done=completedStages(d);
  // Three phases: enter, descend, return
  if(!done.includes('journal'))S.activeStage='enter';
  else if(!done.includes('integrate'))S.activeStage='descend';
  else S.activeStage='return';
  S.symbolMode=d?.stages?.symbol?'sealed':null;
  S.generatedSvg=null;S.replyText='';S.civStory='';
  S.vesselConversation=[];S.vesselReady=false;
  S.integAffirmations=[];S.integConversation=[];S.individConversation=[];
  S.view='dream';render();
}
function setStage(s){
  S.activeStage=s;S.replyText='';
  if(s==='return'){const d=getDream();S.symbolMode=d?.stages?.symbol?'sealed':null;S.civStory='';}
  if(s==='descend'){S.vesselConversation=[];S.vesselReady=false;S.integAffirmations=[];S.integModes=[];S.integConversation=[];S.individConversation=[];}
  render();
}
function clearStage(s){updateDream(S.activeDreamId,d=>({...d,stages:{...d.stages,[s]:''}}));render();}

function startNewDream(){
  const id='dream-'+Date.now();
  const nd={
    id,
    title:'New Dream',
    date:new Date().toLocaleDateString('en-US',{year:'numeric',month:'long'}),
    stages:{journal:'',conversation:[],integrate:'',individuate:'',symbol:null}
  };
  S.dreams=[nd,...S.dreams];
  syncDreamToServer(nd);
  S.activeDreamId=id;
  S.activeStage='enter';
  S.civStory='';
  S.vesselConversation=[];S.vesselReady=false;
  S.integAffirmations=[];S.integConversation=[];S.individConversation=[];
  S.view='dream';
  render();
}

function createNewDream(){
  if(!S.newDreamTitle.trim()||!S.newDreamText.trim())return;
  const id='dream-'+Date.now();
  const nd={id,title:S.newDreamTitle.trim(),date:new Date().toLocaleDateString('en-US',{year:'numeric',month:'long'}),stages:{journal:S.newDreamText.trim(),conversation:[],integrate:'',individuate:'',symbol:null}};
  S.dreams=[nd,...S.dreams];S.newDreamTitle='';S.newDreamText='';
  syncDreamToServer(nd);
  S.activeDreamId=id;S.activeStage='enter';S.view='dream';render();
}

function headerSigil(size=100){
  const c=size/2,sp=[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180,r1=size*.18,r2=size*.43;return`<line x1="${c+r1*Math.cos(r)}" y1="${c+r1*Math.sin(r)}" x2="${c+r2*Math.cos(r)}" y2="${c+r2*Math.sin(r)}" stroke="#8b6020" stroke-width="0.6" stroke-opacity="0.5"/>`;}).join('');
  const cards=[0,90,180,270].map(a=>{const r=a*Math.PI/180;return`<circle cx="${c+size*.35*Math.cos(r)}" cy="${c+size*.35*Math.sin(r)}" r="2.5" fill="#8b2635" fill-opacity="0.7"/>`;}).join('');
  const diag=[45,135,225,315].map(a=>{const r=a*Math.PI/180;return`<polygon points="${c+size*.32*Math.cos(r)-3},${c+size*.32*Math.sin(r)} ${c+size*.32*Math.cos(r)+3},${c+size*.32*Math.sin(r)} ${c+size*.32*Math.cos(r)},${c+size*.32*Math.sin(r)-4}" fill="#c9a84c" fill-opacity="0.6"/>`;}).join('');
  const petals=[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180,px=c+size*.28*Math.cos(r),py=c+size*.28*Math.sin(r);return`<ellipse cx="${px}" cy="${py}" rx="5" ry="10" transform="rotate(${a},${px},${py})" fill="#8b2635" fill-opacity="0.12" stroke="#8b2635" stroke-width="0.4" stroke-opacity="0.3"/>`;}).join('');
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;">
    <defs>
      <radialGradient id="hg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#c9a84c" stop-opacity="0.2"/><stop offset="50%" stop-color="#8b2635" stop-opacity="0.08"/><stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/></radialGradient>
      <filter id="hglow"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <circle cx="${c}" cy="${c}" r="${size*.43}" fill="url(#hg)" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="${c}" cy="${c}" r="${size*.32}" fill="none" stroke="#c9a84c" stroke-width="0.5" stroke-opacity="0.3"/>
    <circle cx="${c}" cy="${c}" r="${size*.18}" fill="none" stroke="#8b6020" stroke-width="0.5" stroke-opacity="0.3"/>
    ${petals}${sp}${cards}${diag}
    <circle cx="${c}" cy="${c}" r="5" fill="#8b2635" filter="url(#hglow)"/>
    <circle cx="${c}" cy="${c}" r="2.5" fill="#c9a84c"/>
  </svg>`;
}

async function generateAffirmations(dreamId){
  const dream=getDream(dreamId);if(!dream)return;
  const conv=(dream.stages.conversation||[]).map(_t=>(_t.role==='jung'?'Jung':'Dreamer')+': '+_t.text).join('\n\n');
  const selectedOptions=S.integModes.map(id=>{const o=INTEG_OPTIONS.find(x=>x.id===id);return o?o.label:null;}).filter(Boolean);
  const followUp=S.integFollowUpAnswer.trim();
  const prompt='Dream: "'+dream.stages.journal+'"\n\nJungian dialogue:\n'+conv+'\n\nThe dreamer has chosen: '+selectedOptions.join(', ')+'\n'+(followUp?'Specific plan: '+followUp:'')+'\n\nAs Jung, generate 5-7 short, powerful affirmations (1-2 sentences each) that:\n1. Directly address the unconscious content and shadow material identified in the dream\n2. Are specifically tailored to be used DURING the chosen physical practice\n3. Speak in first person, present tense\n4. Weave the dream imagery into the affirmation\n5. Are visceral, embodied, not abstract\n\nFormat: return ONLY a JSON array of strings, nothing else. Example: ["I carry my father\'s strength without his wounds.", "Each step dissolves what the dream revealed."]';
  S.loading=true;render();
  try{
    const r=await callClaude('Return only a valid JSON array of affirmation strings. No explanation, no markdown.',[{role:'user',content:prompt}],800);
    const clean=r.trim().replace(/^```[a-z]*\n?/,'').replace(/\n?```$/,'').trim();
    S.integAffirmations=JSON.parse(clean);
    // Also generate the integration text
    const integPrompt='Dream: "'+dream.stages.journal+'"\n\nDialogue:\n'+conv+'\n\nChosen practices: '+selectedOptions.join(', ')+'\n'+(followUp?'Plan: '+followUp:'')+'\n\nAffirmations generated: '+S.integAffirmations.join(' | ')+'\n\nAs Jung, write a poetic, specific integration guidance that weaves the dream\'s unconscious content into the chosen embodied practices. Speak directly to how these specific practices will carry the dream\'s wisdom into the body. Under 300 words.';
    const integText=await callClaude(JUNG_SYS(),[{role:'user',content:integPrompt}],600);
    updateDream(dreamId,d=>({...d,stages:{...d.stages,integrate:integText}}));
  }catch(e){alert('Error generating affirmations: '+e.message);}
  S.loading=false;render();
}

function getLang(){
  const fromState=S.userLang;
  const fromStorage=localStorage.getItem('mandala_lang');
  const fromSession=sessionStorage.getItem('mandala_lang');
  const fromCookie=(document.cookie.match(/mandala_lang=([^;]+)/)||[])[1];
  // Any non-English value wins
  const best=fromState!=='en'?fromState:fromStorage!=='en'?fromStorage:fromSession!=='en'?fromSession:fromCookie!=='en'?fromCookie:'en';
  // Keep state in sync
  if(best&&best!==S.userLang)S.userLang=best;
  return best||'en';
}
function setLang(code){
  S.userLang=code;
  localStorage.setItem('mandala_lang',code);
  sessionStorage.setItem('mandala_lang',code);
  // Also store in a cookie for extra persistence
  document.cookie='mandala_lang='+code+';path=/;max-age=31536000';
  render();
}
function langName(){const l=LANGUAGES.find(x=>x.code===getLang());return l?l.native:'English';}
function langInstruction(){
  const l=getLang();
  if(l==='en')return '';
  const ln=LANGUAGES.find(x=>x.code===l);
  if(!ln)return '';
  return '\n\nCRITICAL LANGUAGE INSTRUCTION: You MUST respond ENTIRELY in '+ln.name+' ('+ln.native+'). Every single word of your response must be in '+ln.name+'. Do not use English at all. The dreamer reads '+ln.name+' and cannot understand English.';
}

let mediaRecorder=null;let audioChunks=[];let isRecording=false;

async function startVoice(){
  if(S.isRecording){stopVoice();return;}
  if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){
    alert('Voice recording works in Chrome and Safari.');return;
  }
  try{
    // Request mic permission
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(function(tr){tr.stop();}); // just for permission
  }catch(e){alert('Microphone access is needed for recording.');return;}
  
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const rec=new SR();
  const langMap={en:'en-US',es:'es-ES',fr:'fr-FR',de:'de-DE',hi:'hi-IN',te:'te-IN',mr:'mr-IN',ja:'ja-JP',zh:'zh-CN',ar:'ar-SA',it:'it-IT',pt:'pt-PT'};
  rec.lang=langMap[getLang()]||'en-US';
  rec.continuous=true;       // keep recording until stopped
  rec.interimResults=true;   // show interim results
  rec.maxAlternatives=1;
  
  let finalTranscript='';
  
  rec.onresult=function(e){
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal){finalTranscript+=e.results[i][0].transcript+' ';}
      else{interim+=e.results[i][0].transcript;}
    }
    // Show interim in the box
    const box=document.getElementById('reply-box')||document.getElementById('new-text');
    if(box){
      const base=S.voiceBase||'';
      box.value=base+finalTranscript+interim;
      S.replyText=box.value;
      S.newDreamText=box.value;
    }
    S.voiceInterim=interim;
  };
  
  rec.onend=function(){
    // Commit final transcript
    const box=document.getElementById('reply-box')||document.getElementById('new-text');
    if(box&&finalTranscript.trim()){
      box.value=(S.voiceBase||'')+finalTranscript.trim();
      S.replyText=box.value;
      S.newDreamText=box.value;
    }
    if(S.isRecording){
      // Restart if still supposed to be recording (continuous mode)
      try{rec.start();}catch(e){S.isRecording=false;render();}
    }
  };
  
  rec.onerror=function(e){
    if(e.error!=='no-speech'){stopVoice();}
  };
  
  // Save what was already in the box
  const box=document.getElementById('reply-box')||document.getElementById('new-text');
  S.voiceBase=box?box.value:'';
  
  rec.start();
  S.voiceRec=rec;
  S.isRecording=true;
  render();
}
function stopVoice(){
  if(S.voiceRec){try{S.voiceRec.stop();}catch(e){}}
  if(mediaRecorder&&mediaRecorder.state!=='inactive'){try{mediaRecorder.stop();}catch(e){}}
  isRecording=false;S.isRecording=false;S.voiceRec=null;render();
}

function startJournalVoice(dreamId){
  if(S.isRecording){stopVoice();return;}
  if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){
    alert('Voice input is supported in Chrome and Safari.');return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const rec=new SR();
  const langMap={en:'en-US',es:'es-ES',fr:'fr-FR',de:'de-DE',hi:'hi-IN',te:'te-IN',mr:'mr-IN',ja:'ja-JP',zh:'zh-CN',ar:'ar-SA',it:'it-IT',pt:'pt-PT'};
  rec.lang=langMap[getLang()]||'en-US';
  rec.interimResults=false;rec.maxAlternatives=1;
  rec.onresult=function(e){
    const transcript=e.results[0][0].transcript;
    const dream=getDream(dreamId);if(!dream)return;
    const current=dream.stages.journal||'';
    const newText=current?(current+' '+transcript):transcript;
    updateDream(dreamId,d=>({...d,stages:{...d.stages,journal:newText}}));
    stopVoice();
  };
  rec.onerror=function(){stopVoice();};
  rec.start();
  S.voiceRec=rec;S.isRecording=true;render();
}

function saveAndStay(dreamId){
  var box=document.getElementById('journal-textarea');
  var text=box?box.value.trim():'';

function saveAndDescend(dreamId){
  var box=document.getElementById('journal-textarea');
  var text=box?box.value.trim():'';
  if(!text){alert('Please write your dream above first.');return;}
  updateDream(dreamId,function(d){return Object.assign({},d,{stages:Object.assign({},d.stages,{journal:text})});});
  beginDescent(dreamId);
}

async function beginDescent(dreamId){
  // First save whatever is in the textarea
  var box=document.getElementById('journal-textarea');
  var journalText=box?box.value.trim():'';
  if(!journalText){
    // Try getting from state
    var d=getDream(dreamId);
    journalText=(d&&d.stages&&d.stages.journal)||'';
  }
  if(!journalText){alert('Please write your dream first.');return;}
  
  // Save journal text to dream
  updateDream(dreamId,function(d){return Object.assign({},d,{stages:Object.assign({},d.stages,{journal:journalText})});});
  
  // Switch to descend and invoke Jung
  S.activeDreamId=dreamId;
  S.activeStage='descend';
  S.loading=true;render();
  try{
    var dream=getDream(dreamId);
    var sys=JUNG_OPENING_SYS();
    var msgs=convMsgs(dream);
    var r=await callClaude(sys,msgs);
    if(!r)throw new Error('Empty response from Jung');
    updateDream(dreamId,function(d){return Object.assign({},d,{stages:Object.assign({},d.stages,{conversation:[...(d.stages.conversation||[]),{role:'jung',text:r}]})});});
  }catch(e){alert('Error: '+e.message);}
  S.loading=false;renderAndScroll();
}

// ── Pattern Intelligence ────────────────────────────────────────────────────
async function analyzePatterns(){
  if(S.dreams.length < 2){
    alert('You need at least 2 completed dream cycles for pattern analysis.');return;
  }
  S.patternsLoading=true;S.showPatterns=true;render();
  try{
    const lang=langInstruction();
    // Build a summary of all dreams for Claude
    const dreamSummaries=S.dreams.map(function(d,i){
      const conv=(d.stages.conversation||[]);
      const breakdown=conv.find(function(_t){return _t.isBreakdown;});
      const jungReplies=conv.filter(function(_t){return _t.role==='jung';});
      return 'Dream '+(i+1)+' ("'+d.title+'", '+d.date+'):\n'+
        'Journal: '+((d.stages.journal||'').slice(0,300))+'\n'+
        (breakdown?'Interpretation: '+breakdown.text.slice(0,400):'No interpretation yet')+'\n'+
        (d.stages.integrate?'Integration: '+d.stages.integrate.slice(0,200):'');
    }).join('\n\n---\n\n');

    const prompt=`You are Carl Jung analyzing a series of dreams from the same dreamer over time. Here are all their dreams in sequence:

${dreamSummaries}

Analyze these dreams as a series — not individually but as a living psychological narrative. Provide:

1. **RECURRING SYMBOLS** — List 3-5 symbols or images that appear across multiple dreams. For each: the symbol, how it has evolved or changed, and what this evolution suggests about the psyche's movement.

2. **ARCHETYPAL THREAD** — The dominant archetype(s) moving through this series (Shadow, Anima/Animus, Self, Trickster, etc.). How is this archetype developing?

3. **THE PSYCHE'S CURRENT** — In 2-3 sentences: what is the unconscious consistently moving toward? What work is being done beneath the surface?

4. **WHAT IS BEING INTEGRATED** — Based on the integration practices chosen, what shadow material is being brought into the body?

5. **SUGGESTED RITUALS** — 2-3 specific ritual suggestions based on the recurring patterns. These should be concrete, embodied practices tied directly to the symbols appearing in the dreams.

6. **THE NEXT DREAM** — What the psyche seems to be preparing to reveal next. Not prediction — but what remains unresolved.

Write as Jung himself, in the intimate tone of Memories Dreams Reflections. This is sacred work.${lang}`;

    S.patterns = await callClaude(JUNG_SYS(),[{role:'user',content:prompt}],1800);
  }catch(e){
    S.patterns='Error: '+e.message;
  }
  S.patternsLoading=false;render();
}

function buildView(){
  const overlay=buildTourOverlay();

  if(S.showPatterns)return buildPatternsView()+fb;
  if(S.view==='login')return buildLogin()+overlay+fb;
  if(S.view==='home')return buildHome()+overlay+fb;

  if(S.view==='dream')return buildDream();
  return'';
}

// ── Login / Signup ─────────────────────────────────────────────────────────────
function handleAuthKey(e){if(e.key==='Enter')doAuth();}
function toggleAuthMode(){S.authMode=S.authMode==='login'?'signup':'login';S.authError='';render();}
async function doAuth(){
  const emailEl=document.getElementById('auth-email');
  const passEl=document.getElementById('auth-password');
  const email=(emailEl?emailEl.value:S.authEmail).trim();
  const password=(passEl?passEl.value:S.authPassword).trim();
  if(!email||!password){S.authError='Please enter your email and password.';render();return;}
  S.authLoading=true;S.authError='';render();
  try{
    const path=S.authMode==='login'?'/auth/login':'/auth/signup';
    const data=await apiCall(path,'POST',{email,password},false);
    setAuth(data.token,data.email);
    S.authLoading=false;
    S.userLang=getLang(); // preserve language choice
    S.dreams=[];
    // Load this user's dreams from server
    try{
      const rows=await apiCall('/dreams','GET');
      S.dreams=rows.map(r=>{
        const stages=Object.assign({journal:'',conversation:[],integrate:'',individuate:''},r.stages,{symbol:r.symbol||null});
        if(!Array.isArray(stages.conversation))stages.conversation=[];
        return{id:r.id,title:r.title,date:r.date,stages};
      });
    }catch(e){S.dreams=[];}
    S.view='home';
    // Show tour for first-time users
    if(S.authMode==='signup'||!localStorage.getItem('mandala_toured')){S.showTour=true;S.tourStep=0;}
    render();
  }catch(e){
    S.authError=e.message;S.authLoading=false;render();
  }
}

// ── Dream Shell ────────────────────────────────────────────────────────────────
function buildDream(){
  const dream=getDream();if(!dream)return buildHome();
  const done=completedStages(dream);
  const phases=completedPhases(dream);
  const conv=dream.stages.conversation||[];
  const hasConv=conv.length>0;
  const curText=dream.stages[S.activeStage==='descend'?'integrate':S.activeStage==='return'?'individuate':'journal']||'';
  const hasText=curText.trim().length>0;

  // Three-phase nav
  const phaseLabels={
    enter:t('enter_phase')||'I · Enter',
    descend:t('descend_phase')||'II · Descend',
    return:t('return_phase')||'III · Return'
  };
  const nav=['enter','descend','return'].map(function(ph){
    const isA=S.activeStage===ph;
    const isDone=phases.includes(ph);
    const cls='stage-btn'+(isA?' active':isDone?' done':'');
    return `<button class="${cls}" onclick="setStage('${ph}')">${phaseLabels[ph]}</button>`;
  }).join('');

  let phaseContent='';
  if(S.activeStage==='enter')phaseContent=buildEnterPhase(dream,done);
  else if(S.activeStage==='descend')phaseContent=buildDescendPhase(dream,conv,hasConv,done);
  else if(S.activeStage==='return')phaseContent=buildReturnPhase(dream,hasText,curText);

  return`<div style="height:100vh;display:flex;flex-direction:column;background:transparent;">
    <!-- Header bar -->
    <div style="background:rgba(245,238,215,0.92);border-bottom:1px solid rgba(140,105,40,0.15);padding:11px 18px;backdrop-filter:blur(8px);">

        <button onclick="S.view='home';render()" style="background:none;border:none;color:#8b6020;font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;cursor:pointer;flex-shrink:0;">${t('backMandala')}</button>

        <div style="font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;color:#9a782888;">${done.length}/4</div>
      </div>
      <!-- Phase nav -->
      <div style="max-width:720px;margin:8px auto 0;display:flex;gap:4px;">${nav}</div>
    </div>
    <!-- Phase content -->
    <div class="scroll-view" style="flex:1;overflow-y:auto;">
      <div style="max-width:680px;margin:0 auto;padding:32px 24px 80px;">

}

async function generateIntegrate(dreamId){
  const dream=getDream(dreamId);if(!dream)return;
  const nl='\n';
  const conv=(dream.stages.conversation||[]).map(function(_t){return(_t.role==='jung'?'Jung':'Dreamer')+': '+_t.text;}).join(nl+nl);
  const selectedLabels=S.integModes.map(function(id){
    const o=INTEG_OPTIONS.find(function(x){return x.id===id;});
    return o?(o.label+' ('+o.alch+' — '+o.desc+')'):null;
  }).filter(Boolean);
  const vessels=selectedLabels.map(function(l,i){return(i+1)+'. '+l;}).join(nl);
  const prompt='Dream: "'+dream.stages.journal+'"'+nl+nl+'Dialogue:'+nl+conv+nl+nl+'The dreamer has chosen these specific vessels for integration:'+nl+vessels+nl+nl+'As Jung, speak directly to these chosen practices. For each one, illuminate how this specific dream\'s energy flows through that particular form of embodiment — not generically, but in direct dialogue with this dream\'s symbols, figures, and insights. Be poetic, specific, and alchemically precise. Weave them together as a unified path rather than a list.';
  S.loading=true;render();
  try{
    const r=await callClaude(JUNG_SYS(),[{role:'user',content:prompt}],1400);
    updateDream(dreamId,function(d){return{...d,stages:{...d.stages,integrate:r}};});
  }catch(e){alert('Error: '+e.message);}
  S.loading=false;render();
}

          '<div style="font-size:28px;color:#9a782888;margin-bottom:10px;">⊕</div>'+
          '<div style="font-family:\'Cinzel\',serif;font-size:9px;letter-spacing:3px;color:#8a6830;">'+t('generate')+'</div>'+
          '<div style="font-family:\'IM Fell English\',serif;font-size:12px;color:#8a6830;font-style:italic;margin-top:6px;">'+t('generateSub')+'</div>'+
        '</div>'+
      '</div>';
  } else if(mode==='draw'){
    symbolSection=buildDrawCanvas();
  } else if(mode==='generate'){
    symbolSection=S.symbolLoading?
      '<div class="parchment-panel">'+loadingSpinner(t('symbolLoading'))+'</div>':
      S.generatedSvg?
        '<div style="background:#f5e8cc;border:1px solid #c8a86055;padding:10px;margin-bottom:14px;">'+S.generatedSvg+'</div>'+
        '<button class="btn btn-crimson btn-wide" onclick="sealSymbol(\'svg::'+S.generatedSvg+'\')">'+t('sealSymbol')+'</button>'+
        divider()+
        '<div style="display:flex;gap:10px;margin-top:4px;">'+
          '<button class="btn btn-outline" onclick="generateSymbol()" style="flex:1;">'+t('generateAgain')+'</button>'+
          '<button class="btn btn-outline" onclick="S.symbolMode=null;render()" style="padding:14px 20px;">←</button>'+
        '</div>':'';
  }

  const convBubbles=(S.individConversation||[]).map(function(turn){
    return turn.role==='jung'?
      '<div class="jung-bubble" style="margin-bottom:10px;">'+
        '<div style="font-family:\'Cinzel\',serif;font-size:8px;letter-spacing:3px;color:#8b2635;margin-bottom:8px;text-transform:uppercase;">C. G. Jung</div>'+
        '<div style="font-family:\'Cormorant Garamond\',serif;font-size:15px;line-height:1.85;color:#8a6830;">'+esc(turn.text)+'</div>'+
      '</div>':
      '<div class="you-bubble" style="margin-bottom:10px;">'+
        '<div style="font-family:\'Cinzel\',serif;font-size:8px;letter-spacing:3px;color:#7a6010;margin-bottom:6px;text-transform:uppercase;">You</div>'+
        '<div style="font-family:\'Cormorant Garamond\',serif;font-size:14px;line-height:1.8;color:#7a5828;">'+esc(turn.text)+'</div>'+
      '</div>';
  }).join('');

  return illuminatedTitle('COAGULATIO · CONJUNCTIO','IV. '+t('individuate').replace('IV · ',''),t('individuateSub'))+
    '<div class="parchment-panel" style="min-height:'+(hasText?'auto':'180px')+';margin-bottom:20px;">'+
      (S.loading&&!hasText?loadingSpinner(t('mandalReveals')):hasText?
        '<div style="font-family:\'Cormorant Garamond\',serif;font-size:16px;line-height:1.95;color:#3a2810;white-space:pre-wrap;">'+esc(curText)+'</div>':
        '<div style="text-align:center;padding:40px 0;font-family:\'IM Fell English\',serif;font-size:14px;color:#c8a86066;font-style:italic;">The mandala waits to be named…</div>'
      )+
    '</div>'+
    (!hasText?
      '<button class="btn btn-crimson btn-wide" onclick="generateText(\'individuate\')" '+(S.loading?'disabled':'')+'>'+
        (S.loading?loadingSpinner():t('invokeJung'))+
      '</button>':''
    )+
    (hasText&&!S.loading?
      '<div style="display:flex;gap:10px;margin-bottom:20px;">'+
        '<button class="btn btn-outline" onclick="generateText(\'individuate\')" style="flex:1;">↺ '+t('generateAgain')+'</button>'+
        '<button class="btn btn-outline" onclick="clearStage(\'individuate\')" style="padding:14px 20px;">Clear</button>'+
      '</div>':'')+

    // Reflection conversation
    (hasText&&!S.loading?
      divider('◈')+
      '<div style="font-family:\'Cinzel\',serif;font-size:9px;letter-spacing:3px;color:#a8844a;margin-bottom:16px;text-transform:uppercase;">Reflect with Jung</div>'+
      convBubbles+
      (S.loading?'<div class="jung-bubble">'+loadingSpinner()+'</div>':'')+
      '<div id="individ-chat-bottom"></div>'+
      '<div class="parchment-panel" style="margin-bottom:10px;">'+
        '<textarea id="individ-reply-box" rows="2" placeholder="Reflect on this vision — what does the symbol mean to you?" '+
          'oninput="S.individReplyText=this.value" '+
          'style="font-size:14px;line-height:1.8;color:#3a2810;background:transparent;border:none;outline:none;width:100%;"></textarea>'+
      '</div>'+
      '<div style="display:flex;gap:10px;margin-bottom:20px;">'+
        '<button class="btn btn-crimson" onclick="sendIndividReply()" style="flex:2;">Send</button>'+
        buildVoiceBtn()+
      '</div>':'')+

    // Civ story
    (hasText&&!S.loading?
      divider('◈','MYTHIC MIRROR')+
      '<div style="font-family:\'Cinzel\',serif;font-size:9px;letter-spacing:4px;color:#a8844a;text-align:center;margin-bottom:8px;text-transform:uppercase;">'+t('ancientMirror')+'</div>'+
      '<div style="font-family:\'IM Fell English\',serif;font-size:13px;color:#8a6830;text-align:center;font-style:italic;margin-bottom:16px;">'+t('ancientMirrorSub')+'</div>'+
      (!S.civStory?
        '<button class="btn btn-gold btn-wide" style="margin-bottom:20px;" onclick="generateCivStory(\''+dream.id+'\')">'+t('summonMirror')+'</button>':
        '<div class="civ-panel" style="margin-bottom:20px;">'+
          '<div style="font-family:\'Cormorant Garamond\',serif;font-size:16px;line-height:2;color:#3a2810;white-space:pre-wrap;">'+esc(S.civStory)+'</div>'+
        '</div>'
      ):'')+ 

    // Symbol section
    (hasText&&!S.loading?
      divider('⊕','CONJUNCTIO')+
      alchTransition('individuate-symbol')+
      '<div style="font-family:\'Cinzel\',serif;font-size:9px;letter-spacing:4px;color:#a8844a;text-align:center;margin-bottom:16px;">'+t('theSymbol')+'</div>'+
      '<div style="font-family:\'IM Fell English\',serif;font-size:13px;color:#8a6830;text-align:center;font-style:italic;margin-bottom:20px;">'+t('symbolSub')+'</div>'+
      symbolSection:'');
}


// ── Draw Canvas ────────────────────────────────────────────────────────────────
function buildDrawCanvas(){
  const cols=['#c9a84c','#8b2635','#3d1a08','#1a3a6a','#2a5a1a','#6a3a1a','#000000'];
  return`<div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f0e5c8;border:1px solid #c8a86044;padding:10px 12px;margin-bottom:8px;border-radius:2px;">
      <button id="tool-pen" onclick="setDrawTool('pen')" style="padding:5px 12px;background:#8b2635;border:1px solid #8b2635;color:#f5e8c8;border-radius:1px;font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;cursor:pointer;">PEN</button>
      <button id="tool-eraser" onclick="setDrawTool('eraser')" style="padding:5px 12px;background:transparent;border:1px solid #c8a86055;color:#8b6020;border-radius:1px;font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;cursor:pointer;">ERASE</button>
      <div style="width:1px;height:20px;background:#c8a86044;"></div>
      ${cols.map(c=>`<button onclick="setDrawColor('${c}')" id="color-${c.replace('#','')}" style="width:20px;height:20px;border-radius:50%;background:${c};border:2px solid #c8a86055;cursor:pointer;flex-shrink:0;"></button>`).join('')}
      <div style="width:1px;height:20px;background:#c8a86044;"></div>
      ${[1,3,6,12].map(s=>`<button onclick="setDrawSize(${s})" id="size-${s}" style="width:22px;height:22px;border-radius:50%;background:transparent;border:1px solid #c8a86055;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;"><div style="width:${s*1.4}px;height:${s*1.4}px;border-radius:50%;background:#8b6020;"></div></button>`).join('')}
      <button onclick="clearDrawCanvas()" style="margin-left:auto;padding:5px 10px;background:transparent;border:1px solid #c8a86044;color:#a8844a;font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;cursor:pointer;">CLEAR</button>
    </div>
    <canvas id="draw-canvas" width="400" height="400" style="width:100%;max-width:400px;aspect-ratio:1;border:1px solid #c8a86055;cursor:crosshair;touch-action:none;display:block;border-radius:1px;"></canvas>
    <div style="font-family:'IM Fell English',serif;font-size:11px;color:#a8844a;text-align:center;margin-top:8px;font-style:italic;">The rings and spokes are guides — your marks are the meaning</div>
    ${divider('◈')}
    <button class="btn btn-crimson btn-wide" onclick="saveDrawing()">${t('sealDrawing')}</button>
    <button class="btn btn-outline btn-wide" onclick="setSymbolMode(null)" style="margin-top:8px;">${t('back')}</button>
  </div>`;
}

// ── Canvas state ───────────────────────────────────────────────────────────────
let DS={tool:'pen',color:'#8b2635',size:3,drawing:false,lx:0,ly:0};
function initCanvas(){
  const cv=document.getElementById('draw-canvas');if(!cv)return;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#f5e8cc';ctx.fillRect(0,0,400,400);
  // Parchment-toned guide rings
  ctx.strokeStyle='#c8a86033';ctx.lineWidth=0.7;
  [160,120,80,40].forEach(r=>{ctx.beginPath();ctx.arc(200,200,r,0,Math.PI*2);ctx.stroke();});
  ctx.strokeStyle='#c8a86022';ctx.lineWidth=0.5;
  [0,45,90,135,180,225,270,315].forEach(a=>{const r=a*Math.PI/180;ctx.beginPath();ctx.moveTo(200,200);ctx.lineTo(200+165*Math.cos(r),200+165*Math.sin(r));ctx.stroke();});
  // Cardinal dots
  [0,90,180,270].forEach(a=>{const r=a*Math.PI/180;ctx.beginPath();ctx.arc(200+160*Math.cos(r),200+160*Math.sin(r),2.5,0,Math.PI*2);ctx.fillStyle='#8b263522';ctx.fill();});

  function pos(e){const rect=cv.getBoundingClientRect();const sx=cv.width/rect.width,sy=cv.height/rect.height;const cx=e.touches?e.touches[0].clientX:e.clientX;const cy=e.touches?e.touches[0].clientY:e.clientY;return{x:(cx-rect.left)*sx,y:(cy-rect.top)*sy};}
  function start(e){e.preventDefault();const p=pos(e);DS.drawing=true;DS.lx=p.x;DS.ly=p.y;}
  function move(e){e.preventDefault();if(!DS.drawing)return;const p=pos(e);const c2=cv.getContext('2d');c2.globalCompositeOperation=DS.tool==='eraser'?'destination-out':'source-over';c2.strokeStyle=DS.color;c2.lineWidth=DS.tool==='eraser'?DS.size*4:DS.size;c2.lineCap='round';c2.lineJoin='round';c2.beginPath();c2.moveTo(DS.lx,DS.ly);c2.lineTo(p.x,p.y);c2.stroke();DS.lx=p.x;DS.ly=p.y;}
  function end(e){e?.preventDefault();DS.drawing=false;}
  cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);cv.addEventListener('mouseup',end);cv.addEventListener('mouseleave',end);
  cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',end);
  updateToolUI();
}
function setDrawTool(t){DS.tool=t;updateToolUI();}
function setDrawColor(c){DS.color=c;DS.tool='pen';updateToolUI();}
function setDrawSize(s){DS.size=s;updateToolUI();}
function updateToolUI(){
  ['pen','eraser'].forEach(_t=>{const b=document.getElementById('tool-'+t);if(b){b.style.background=DS.tool===t?'#8b2635':'transparent';b.style.borderColor=DS.tool===t?'#8b2635':'#c8a86055';b.style.color=DS.tool===t?'#f5e8c8':'#8b6020';}});
  ['#c9a84c','#8b2635','#3d1a08','#1a3a6a','#2a5a1a','#6a3a1a','#000000'].forEach(c=>{const b=document.getElementById('color-'+c.replace('#',''));if(b)b.style.borderColor=DS.color===c?'#3d1a08':'#c8a86055';});
  [1,3,6,12].forEach(s=>{const b=document.getElementById('size-'+s);if(b)b.style.borderColor=DS.size===s?'#8b2635':'#c8a86055';});
}
function clearDrawCanvas(){
  const cv=document.getElementById('draw-canvas');if(!cv)return;
  const ctx=cv.getContext('2d');ctx.globalCompositeOperation='source-over';ctx.fillStyle='#f5e8cc';ctx.fillRect(0,0,400,400);
  ctx.strokeStyle='#c8a86033';ctx.lineWidth=0.7;[160,120,80,40].forEach(r=>{ctx.beginPath();ctx.arc(200,200,r,0,Math.PI*2);ctx.stroke();});
  ctx.strokeStyle='#c8a86022';ctx.lineWidth=0.5;[0,45,90,135,180,225,270,315].forEach(a=>{const r=a*Math.PI/180;ctx.beginPath();ctx.moveTo(200,200);ctx.lineTo(200+165*Math.cos(r),200+165*Math.sin(r));ctx.stroke();});
}
function saveDrawing(){const cv=document.getElementById('draw-canvas');if(!cv)return;sealSymbol(cv.toDataURL('image/png'));}

// ── Bind ───────────────────────────────────────────────────────────────────────
function bindEvents(){
  if(S.view==='dream'&&S.activeStage==='individuate'&&S.symbolMode==='draw'){setTimeout(initCanvas,60);}
  const rb=document.getElementById('reply-box');if(rb)rb.value=S.replyText;
  const nt=document.getElementById('new-title');if(nt)nt.value=S.newDreamTitle;
  const nx=document.getElementById('new-text');if(nx)nx.value=S.newDreamText;
}

// ── Init ───────────────────────────────────────────────────────────────────────
async function init(){
  // Show UI INSTANTLY — no loading screen ever
  S.view = getToken() ? 'home' : 'login';
  render();

  // Then load dreams in background if logged in
  if(getToken()){
    try{
      const rows = await apiCall('/dreams', 'GET');
      S.dreams = rows.map(function(r){
        const stages = Object.assign({journal:'',conversation:[],integrate:'',individuate:''}, r.stages, {symbol: r.symbol||null});
        if(!Array.isArray(stages.conversation)) stages.conversation = [];
        return {id:r.id, title:r.title, date:r.date, stages:stages};
      });
      render(); // re-render once dreams arrive
    }catch(e){
      console.warn('Dream load failed:', e.message);
    }
  }
}


init();


</script>
